<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Drift</title>
<style>
  html, body { margin: 0; height: 100%; background: #05050f; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR;

// ---------- online co-op state (see the "online co-op" section for how it works) ----------
const net = {
  role: null,        // null (offline) | 'host' | 'guest'
  peer: null, conns: [], host: null,
  code: '', typed: '', status: '',
  playing: false,    // a run is in progress (host simulates, guests mirror)
  myId: 0,           // guest: which player slot is mine
  slots: [],         // lobby: [{ ship }] per player
  sendT: 0, events: [], rewarded: false, leaveArm: 0,
  hostW: 0, hostH: 0, vs: 1, vx: 0, vy: 0, // guests draw the host's world scaled to fit their screen
  soff: undefined, lastTs: 0, ptr: [], etr: new Map(), btr: new Map(), // guests: smoothing timelines
  snapN: 0, bossSent: new WeakSet(), bossStatic: new Map(), // bosses' fixed details: host sends them rarely, guests remember them
};
// host: record a visual/sound event so guests can replay it
function netRec(ev) { if (net.role === 'host' && net.playing) net.events.push(ev); }
const guestView = () => net.role === 'guest' && net.playing && net.hostW > 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const rw = window.innerWidth, rh = window.innerHeight;
  cv.width = rw * DPR; cv.height = rh * DPR;
  if (guestView()) {
    // online guest: the world is the host's size, scaled (and letterboxed) to fit this window
    W = net.hostW; H = net.hostH;
    net.vs = Math.min(rw / W, rh / H); net.vx = (rw - W * net.vs) / 2; net.vy = (rh - H * net.vs) / 2;
  } else { W = rw; H = rh; net.vs = 1; net.vx = net.vy = 0; }
  ctx.setTransform(DPR * net.vs, 0, 0, DPR * net.vs, DPR * net.vx, DPR * net.vy);
}
// screen (client) coordinates -> world coordinates
const toWorld = (cx, cy) => ({ x: (cx - net.vx) / net.vs, y: (cy - net.vy) / net.vs });
window.addEventListener('resize', resize); resize();

// ---------- settings (persist between sessions) ----------
const settings = { music: true, sfx: true, shake: true };
try { Object.assign(settings, JSON.parse(localStorage.getItem('neonDriftSettings')) || {}); } catch (e) {}
function toggleSetting(key) {
  settings[key] = !settings[key];
  try { localStorage.setItem('neonDriftSettings', JSON.stringify(settings)); } catch (e) {}
  applyVolumes();
  beep(600, 0.08, 'triangle', 0.05);
}

// ---------- audio ----------
// sound effects and music have separate buses so each can be muted; music also runs through a
// low-pass filter that muffles it while the game is paused or on the upgrade screen
let ac = null, master, sfxBus, musicBus, musicFilter, noiseBuf;
function ensureAudio() {
  if (ac) { if (ac.state === 'suspended' && !document.hidden) ac.resume(); return true; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.connect(master);
    musicFilter = ac.createBiquadFilter(); musicFilter.type = 'lowpass'; musicFilter.frequency.value = 18000;
    musicBus = ac.createGain(); musicBus.connect(musicFilter); musicFilter.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyVolumes();
    startMusic();
    return true;
  } catch (e) { ac = null; return false; }
}
function applyVolumes() {
  if (!ac) return;
  sfxBus.gain.value = settings.sfx ? 1 : 0;
  musicBus.gain.value = settings.music ? 0.6 : 0;
}

const beepLast = {};
function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  try {
    netRec(['s', freq, dur, type, vol, slide]); // guests hear the host's sounds
    if (!ensureAudio()) return;
    // skip near-duplicate sounds fired within a few ms (e.g. 4 players' guns) to avoid audio stutter
    const key = type + (freq / 40 | 0), now = ac.currentTime;
    if (now - (beepLast[key] || 0) < 0.035) return;
    beepLast[key] = now;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(sfxBus);
    o.start(now); o.stop(now + dur);
  } catch (e) {}
}

// ---------- music: a small procedural synthwave loop, scheduled slightly ahead of time ----------
const BPM = 112, STEP = 60 / BPM / 4; // one 16th note
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const PROG_CALM = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]]; // Am  F  C  G
const PROG_BOSS = [[57, 60, 64], [57, 60, 64], [53, 57, 60], [52, 56, 59]]; // Am Am F  E
const music = { step: 0, next: 0, timer: 0, cutoff: 18000 };

function startMusic() {
  if (music.timer) return;
  music.next = ac.currentTime + 0.1;
  music.timer = setInterval(scheduleMusic, 25);
}
// 0 = menus (dreamy), 1 = playing (driving), 2 = boss (faster arp, snare, darker chords)
function musicIntensity() {
  if (state === 'play' || state === 'upgrade') return bosses.length || bossWarn > 0 ? 2 : 1;
  return 0;
}
function scheduleMusic() {
  if (!ac || ac.state !== 'running') return;
  if (music.next < ac.currentTime - 0.05) music.next = ac.currentTime + 0.05; // woke from sleep: don't play a backlog
  while (music.next < ac.currentTime + 0.12) { musicStep(music.step++, music.next); music.next += STEP; }
}
function mTone(freq, t, dur, type, vol, cutoff) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let out = o;
  if (cutoff) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; o.connect(f); out = f; }
  out.connect(g); g.connect(musicBus);
  o.start(t); o.stop(t + dur + 0.02);
}
function mKick(t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
  g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.22);
}
function mNoise(t, dur, vol, hp) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(musicBus);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function musicStep(s, t) {
  const lvl = musicIntensity(), i = s % 16, bar = Math.floor(s / 16);
  const chord = (lvl === 2 ? PROG_BOSS : PROG_CALM)[bar % 4], root = chord[0] - 12;
  if (lvl === 0) {
    if (i % 2 === 0) mTone(mtof(chord[(s / 2 | 0) % 3] + 12), t, 0.5, 'triangle', 0.035);
    if (i === 0) mTone(mtof(root), t, STEP * 15, 'sawtooth', 0.04, 500);
    return;
  }
  if (i % 2 === 0) mTone(mtof(root + (i % 4 === 2 ? 12 : 0)), t, STEP * 1.8, 'sawtooth', 0.05, lvl === 2 ? 900 : 600); // bass
  if (lvl === 2 || i % 2 === 0) mTone(mtof(chord[s % 3] + 12 * (1 + (Math.floor(s / 3) % 2))), t, STEP * 0.9, 'square', 0.018, 2400); // arp
  if (i % 4 === 0) mKick(t);
  if (i % 4 === 2) mNoise(t, 0.05, 0.05, 7000); // hat
  if (lvl === 2) {
    if (i === 4 || i === 12) mNoise(t, 0.15, 0.12, 1500); // snare
    if (i % 2 === 1) mNoise(t, 0.03, 0.025, 9000);
  }
}
// muffle the music while paused / choosing upgrades / on the results screen
function updateMusicFilter() {
  if (!ac) return;
  const target = paused || state === 'upgrade' || state === 'over' ? 700 : 18000;
  if (target !== music.cutoff) { music.cutoff = target; musicFilter.frequency.setTargetAtTime(target, ac.currentTime, 0.15); }
}

function rollCards(n, bossReward) {
  const pool = UPGRADES.filter(u => (run.owned[u.id] || 0) < u.max && (!u.when || u.when()) && (!bossReward || u.r !== 'common'));
  const out = [];
  while (out.length < n && pool.length) {
    const total = pool.reduce((t, u) => t + RARITY[u.r].w, 0);
    let roll = Math.random() * total, i = 0;
    while ((roll -= RARITY[pool[i].r].w) > 0) i++;
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}

function applyUpgrade(u) {
  run.owned[u.id] = (run.owned[u.id] || 0) + 1;

  const p = { id, x, y: H - 100, r: 14 * (m.hitbox || 1), inv: 2, power: 0, shield: m.aegis ? 1 : 0, alive: true,
    shotT: 0, droneT: 0, aegisT: 0, healT: 0, color: P_COLORS[id], ship };
  p.lives = maxLivesOf(p);
  return p;
}

// ship select: each player picks in turn, then the run starts
let shipPick = null;
const baseIndex = id => Math.max(0, SHIPS.findIndex(s => s.id === shipById(id).id || s.id === shipById(id).base));
// online: the same screen, opened from the lobby, picks just your own ship and returns there
function openShipSelect(m, online = false) {
  shipPick = { mode: m, player: 0, picks: [], online, mk2: {} };
  const cur = online ? (net.slots[net.role === 'host' ? 0 : net.myId]?.ship || lastShips[0]) : lastShips[0];
  rememberVariant(cur);
  go('ships');
  sel = baseIndex(cur);
}
function rememberVariant(id) { const s = shipById(id); if (s.mk2 === true) shipPick.mk2[s.base] = true; }
// which version of a ship is chosen on the select screen: MK II if picked (or owned and not switched off)
const wantsMk2 = base => shipPick.mk2[base.id] ?? mk2Owned(base);
function toggleVariant(base, on) { shipPick.mk2[base.id] = on ?? !wantsMk2(base); beep(600, 0.06, 'triangle', 0.04); }
function pickShip(i) {
  const base = SHIPS[i];
  if (!base) return;
  shipPick.view = i;
  if (wantsMk2(base) && !mk2Owned(base)) { // buying the MK II
    const cost = base.mk2.cost;
    if (meta.shards >= cost) {
      meta.shards -= cost; meta.ships[base.id] = true; saveMeta();
      showToast(`${base.name} MK II UNLOCKED!`); beep(660, 0.3, 'triangle', 0.08, 660);
      if (SHIPS.every(mk2Owned)) unlockAch('fleet');
    } else { showToast(`Need ◆ ${cost} for the MK II — or fly the free MK I`); beep(110, 0.15, 'square', 0.05); }
    return;
  }
  const id = wantsMk2(base) ? base.id + '2' : base.id;
  lastShips[shipPick.player] = id;
  try { localStorage.setItem('neonDriftShips', JSON.stringify(lastShips)); } catch (e) {}
  beep(520 + shipPick.player * 80, 0.12, 'triangle', 0.06, 200);
  if (shipPick.online) { setMyOnlineShip(id); go('lobby'); return; }
  shipPick.picks[shipPick.player] = id;
  shipPick.player++;
  if (shipPick.player >= shipPick.mode) { start(shipPick.mode, shipPick.picks); return; }
  rememberVariant(lastShips[shipPick.player]);
  sel = baseIndex(lastShips[shipPick.player]);
}
function shipSelectBack() {
  if (shipPick.online) { go('lobby'); return; }
  if (shipPick.player > 0) {
    shipPick.player--;
    sel = baseIndex(shipPick.picks[shipPick.player]);
    shipPick.picks.length = shipPick.player; // forget the pick being redone, so its "P1" tag disappears
  }
  else go('menu');
}

function start(m, ships) {
  mode = m;
  ships = ships || lastShips;
  run = { s: newStats(), owned: {}, rerolls: metaLv('reroll'), bossKills: 0, earned: 0,
    bossOrder: buildBossOrder(), seenEnemies: { drifter: true, mini: true, segment: true }, ships: ships.slice(0, m),
    endless: runType === 'endless', cycle: 1, mut: {} };
  lasers = []; bossFx = { rings: [], ghosts: [], shards: [], texts: [], zaps: [] }; screenFlash = 0;
  players = Array.from({ length: m }, (_, i) => makePlayer(i, W * (i + 1) / (m + 1), ships[i]));
  bullets = []; enemies = []; particles = []; pickups = []; eBullets = [];
  score = 0; time = 0; levelT = 0; spawnT = 0; shake = 0; combo = 1; comboT = 0; level = 1;
  bosses = []; encounter = null; bossWarn = 0; bossCount = 0; pendingBoss = false; paused = false;
  popups = []; hurtFlash = 0;
  hint = { text: net.role ? 'Move with mouse, WASD or arrows — you fire automatically' : CONTROL_HINTS[m], life: 5 };
  go('play');
  for (let i = 0; i < metaLv('start'); i++) { const [u] = rollCards(1, false); if (u) applyUpgrade(u); }
  fxText('SECTOR 1', W / 2, H * 0.4, '#7df9ff', 30, 1.4);
  if (m === 4) unlockAch('squad');
  // catch up on progress-based trophies earned before they existed (or by other means)
  if (meta.shards >= 1000) unlockAch('hoarder');
  if (SHIPS.every(mk2Owned)) unlockAch('fleet');
  beep(440, 0.1, 'triangle', 0.08, 440);
}

const CONTROL_HINTS = {
  1: 'Move with mouse, WASD or arrows — you fire automatically  ·  P pause  ·  M music',
  2: 'P1: WASD  ·  P2: arrows or mouse  —  ships fire automatically  ·  P pause',
  3: 'P1: mouse  ·  P2: WASD  ·  P3: arrows  —  ships fire automatically  ·  P pause',

};
let popups = [], hurtFlash = 0, hint = null;

// shards for the run so far: mostly from progress (sectors, bosses), a little from score so combos still matter
const runShards = () => Math.round((Math.sqrt(score) * 0.8 + (level - 1) * 12 + run.bossKills * 50
  + (run.victory || run.wonStandard ? VICTORY_BONUS : 0) + (run.endless ? (run.cycle - 1) * 150 : 0)) * (1 + 0.25 * metaLv('salvage')));
// victory: a Standard run that destroyed THE ABYSS (pays a bonus on top of the usual shards)
function endRun(victory = false) {
  paused = false;
  run.victory = victory;
  // (a won Standard run that went on into Endless was already paid for its first part)
  const earned = Math.max(0, runShards() - (run.paid || 0));
  run.earned = earned; meta.shards += earned; saveMeta();
  if (meta.shards >= 1000) unlockAch('hoarder');
  const prev = bestOf(mode, run.endless);
  run.newBest = score > prev && score > 0;
  if (run.newBest) {
    beep(880, 0.5, 'triangle', 0.08, 880);
    best[bestKey(mode, run.endless)] = score;
    try { localStorage.setItem(bestKey(mode, run.endless), score); } catch (e) {}
  }
  if (victory) [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'triangle', 0.07), i * 120));
  go('over');
}
const VICTORY_BONUS = 250;
// a won Standard run can carry on as Endless: same ships, upgrades and score, with the first mutator added
function continueEndless() {
  run.paid = (run.paid || 0) + run.earned; // the Standard finish has already been paid out
  run.endless = true; run.victory = false; run.wonStandard = true; run.victoryT = 0;
  const alive = living();
  for (const p of players) { if (!p.alive) revive(p, alive[0]); p.inv = 2; }
  paused = false; eBullets = []; lasers = [];
  const m = startNextCycle();
  openUpgrade(`ENDLESS BEGINS — NEW MUTATOR: ${m.name}`, true);
}

// ---------- endless mode mutators: one is added each time a cycle is completed (they can stack) ----------
const MUTATORS = [
  { id: 'swift',    name: 'SWIFT',    desc: 'Enemies move 25% faster' },
  { id: 'armored',  name: 'ARMORED',  desc: 'Enemies have 50% more health' },
  { id: 'frenzy',   name: 'FRENZY',   desc: 'Enemies spawn 30% more often' },
  { id: 'volatile', name: 'VOLATILE', desc: 'Enemies burst into bullets when destroyed' },
  { id: 'hellfire', name: 'HELLFIRE', desc: 'Bosses attack 20% faster' },
  { id: 'titans',   name: 'TITANS',   desc: 'Bosses have 30% more health' },
];
function startNextCycle() {
  run.cycle++;
  const m = addMutator();
  fxText(`CYCLE ${run.cycle}`, W / 2, H * 0.35, '#ff9a3d', 44, 2.2);
  hint = { text: `Mutator added: ${m.name} — ${m.desc}. Mutators stack every cycle!`, life: 7 };
  if (run.cycle >= 2) unlockAch('endless2');
  if (run.cycle >= 4) unlockAch('endless4');
  return m;
}
const mut = id => (run && run.mut[id]) || 0; // how many times a mutator has stacked this run
function addMutator() {
  // prefer ones not active yet; once all are in play, they start stacking
  const fresh = MUTATORS.filter(m => !mut(m.id)), pool = fresh.length ? fresh : MUTATORS;
  const m = pool[Math.floor(Math.random() * pool.length)];
  run.mut[m.id] = mut(m.id) + 1;
  return m;
}

const living = () => players.filter(p => p.alive);

function burst(x, y, color, n = 20, speed = 250) {
  netRec(['b', Math.round(x), Math.round(y), color, n, speed]);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * speed;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.5, max: 0.9, color, size: 1 + Math.random() * 3 });
  }
}

// which enemies can appear from which sector, and how often (relative weight)
const SPAWN_TABLE = [
  { type: 'drifter',  from: 1, w: 10 },
  { type: 'swarm',    from: 1, w: 1.5 }, // a V-formation of swarmers
  { type: 'zigzag',   from: 2, w: 5 },
  { type: 'dasher',   from: 2, w: 3 },
  { type: 'shooter',  from: 3, w: 3 },
  { type: 'seeker',   from: 3, w: 3 },
  { type: 'splitter', from: 4, w: 2.5 },
  { type: 'tank',     from: 5, w: 1.5 },
  { type: 'bomber',   from: 5, w: 1.5 },
  { type: 'sniper',   from: 6, w: 1.5 },
  { type: 'healer',   from: 7, w: 1.2 },
  { type: 'orbiter',  from: 3, w: 2.2 },
  { type: 'warper',   from: 4, w: 2 },
  { type: 'serpent',  from: 5, w: 1.3 }, // a head plus a trailing body
  { type: 'guardian', from: 6, w: 1.1 },
  { type: 'carrier',  from: 8, w: 0.9 },
];

function spawnEnemy() {
  const pool = SPAWN_TABLE.filter(s => level >= s.from);
  // the tougher types (anything unlocked after sector 2) get more common the deeper you go
  const weight = s => s.w * (s.from >= 3 ? 1 + (level - s.from) * 0.15 : 1);
  let roll = Math.random() * pool.reduce((t, s) => t + weight(s), 0), type = pool[0].type;
  for (const s of pool) if ((roll -= weight(s)) <= 0) { type = s.type; break; }

  // introduce each new enemy the first time it shows up in a run
  const key = type === 'swarm' ? 'swarmer' : type;
  if (!run.seenEnemies[key]) {
    run.seenEnemies[key] = true;
    fxText(`NEW ENEMY: ${TYPES[key].label}`, W / 2, H * 0.32, TYPES[key].color, 20, 2.2);
  }

  if (type === 'swarm') {
    const cx = 80 + Math.random() * (W - 160);
    for (let i = -2; i <= 2; i++) makeEnemy('swarmer', cx + i * 26, -20 - Math.abs(i) * 22);
  } else if (type === 'bomber') {
    const left = Math.random() < 0.5;
    makeEnemy('bomber', left ? -30 : W + 30, 70 + Math.random() * H * 0.3);
  } else if (type === 'serpent') {
    const x = 80 + Math.random() * (W - 160), head = makeEnemy('serpent', x, -20);
    for (let i = 1; i <= 7; i++) { const s = makeEnemy('segment', x, -20 - i * 12); s.head = head; s.idx = i; s.vx = s.vy = 0; }
  } else {
    const r = TYPES[type].r;
    makeEnemy(type, r + Math.random() * (W - r * 2), -r * 2);
  }
}

let enemyIdSeq = 0; // online guests match enemies between snapshots by id
function makeEnemy(type, x, y) {
  const t = TYPES[type];
  const speed = (80 + Math.min(level, 12) * 15 + Math.random() * 60) * (1 + 0.25 * mut('swift'));
  // enemies toughen each sector to keep pace with your upgrades; a bit more in co-op
  const hp = Math.ceil(t.hp * (1 + (level - 1) * 0.3) * (1 + 0.5 * mut('armored'))) + (t.hp > 1 ? mode - 1 : 0);
  const e = { type, x, y, r: t.r, hp, maxHp: hp, color: t.color, pts: t.pts, vx: 0, vy: speed,
    t: Math.random() * 10, spin: 0, fire: 1 + Math.random() * 2, flash: 0, state: 'enter', timer: 0, aimA: Math.PI / 2, id: ++enemyIdSeq };
  switch (type) {
    case 'tank':     e.vy = speed * 0.4; break;
    case 'swarmer':  e.vy = speed * 1.5; break;
    case 'dasher':   e.vy = 170; e.stopY = 70 + Math.random() * H * 0.25; break;
    case 'seeker':   e.vy = 120; e.life = 9; break;
    case 'splitter': e.vy = speed * 0.5; break;
    case 'bomber':   e.vy = 0; e.vx = x < W / 2 ? 110 : -110; e.fire = 0.8; break;
    case 'sniper':   e.vy = 130; e.stopY = 60 + Math.random() * 90; e.fire = 2; e.stay = 12; break;
    case 'healer':   e.vy = speed * 0.35; e.fire = 2; e.pulse = 0; break;
    case 'orbiter':  e.vy = speed * 0.45; break;
    case 'warper':   e.vy = 140; e.fire = 1.2; e.life = 13; break;
    case 'serpent':  e.vy = speed * 0.55; e.trail = []; break;
    case 'guardian': e.vy = 110; e.stopY = 50 + Math.random() * H * 0.2; e.stay = 15; break;
    case 'carrier':  e.vy = speed * 0.22; e.fire = 1.5; break;
  }
  enemies.push(e);
  return e;
}

// enemy guns reload faster as sectors go on (down to 60% of the base delay by sector 14)
const enemyFireScale = () => Math.max(0.6, 1 - (level - 1) * 0.03);

const GUARD_RANGE = 140;
const orbiterBall = (e, k) => { const a = e.t * 3 + k * Math.PI * 2 / 3; return { x: e.x + Math.cos(a) * 36, y: e.y + Math.sin(a) * 36 }; };

// height of each player's line in the HUD's top-right list (compact for 5-8 online players)
const hudRowH = () => players.length > 4 ? 20 : 48;

const turnToward = (a, want, max) => {
  const d = ((want - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  return a + Math.max(-max, Math.min(max, d));
};

// per-type behavior, run every frame after the enemy moves by its velocity
const ENEMY_AI = {
  drifter(e, dt) { e.x += Math.sin(e.t) * 40 * dt; },
  zigzag(e, dt) { e.x += Math.sin(e.t * 4) * 220 * dt; },
  swarmer(e, dt) { e.x += Math.sin(e.t * 3) * 60 * dt; },
  shooter(e, dt) {
    if (e.y > H * 0.3) e.vy = Math.max(20, e.vy - 200 * dt);
    e.fire -= dt;
    const tgt = nearestPlayer(e.x, e.y);
    if (e.fire <= 0 && e.y > 0 && tgt) {
      e.fire = 1.6 * enemyFireScale(); // gunners fire faster in later sectors
      const a = Math.atan2(tgt.y - e.y, tgt.x - e.x);
      eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260 });
      beep(220, 0.08, 'triangle', 0.03);
    }
  },
  dasher(e, dt) { // stops, locks on, then rockets toward where you were
    if (e.state === 'enter') {
      if (e.y >= e.stopY) { e.state = 'aim'; e.vy = 0; e.timer = 0.9; }
    } else if (e.state === 'aim') {
      const tgt = nearestPlayer(e.x, e.y);
      if (tgt && e.timer > 0.25) e.aimA = Math.atan2(tgt.y - e.y, tgt.x - e.x);
      e.timer -= dt;
      if (e.timer <= 0) {
        e.state = 'dash'; e.vx = Math.cos(e.aimA) * 650; e.vy = Math.sin(e.aimA) * 650;
        beep(500, 0.15, 'sawtooth', 0.03, -300);
      }
    } else if (Math.random() < dt * 40) {
      particles.push({ x: e.x, y: e.y, vx: -e.vx * 0.1, vy: -e.vy * 0.1, life: 0.3, max: 0.3, color: e.color, size: 3 });
    }
  },
  seeker(e, dt) { // steers toward the nearest player, then gives up and flies off
    e.life -= dt;
    let a = Math.atan2(e.vy, e.vx);
    const tgt = nearestPlayer(e.x, e.y);
    if (tgt && e.life > 0) a = turnToward(a, Math.atan2(tgt.y - e.y, tgt.x - e.x), 2.2 * dt);
    const sp = 140 + Math.min(level, 10) * 6;
    e.vx = Math.cos(a) * sp; e.vy = Math.sin(a) * sp; e.aimA = a;
    if (Math.random() < dt * 20) particles.push({ x: e.x - e.vx * 0.08, y: e.y - e.vy * 0.08, vx: 0, vy: 0, life: 0.25, max: 0.25, color: e.color, size: 2 });
  },
  splitter(e, dt) { e.x += Math.sin(e.t * 1.5) * 30 * dt; },
  mini(e, dt) { e.vx *= 0.97; e.vy = Math.min(e.vy + 200 * dt, 220); },
  bomber(e, dt) { // crosses the screen sideways dropping mines
    e.y += Math.sin(e.t * 2) * 12 * dt;
    e.fire -= dt;
    if (e.fire <= 0 && e.x > 20 && e.x < W - 20) {
      e.fire = 1.3;
      eBullets.push({ x: e.x, y: e.y + e.r * 0.5, vx: 0, vy: 70, r: 9, color: e.color, fuse: 1.6 });
      beep(140, 0.1, 'triangle', 0.03);
    }
  },
  sniper(e, dt) { // parks near the top, tracks you with a laser sight, then fires a fast shot
    if (e.state === 'enter') { if (e.y >= e.stopY) { e.state = 'hover'; e.vy = 0; } return; }
    if (e.state === 'leave') return;
    e.x += Math.sin(e.t * 0.8) * 50 * dt;
    e.stay -= dt;
    if (e.stay <= 0) { e.state = 'leave'; e.vy = 140; e.aiming = false; return; }
    const tgt = nearestPlayer(e.x, e.y);
    e.fire -= dt;
    e.aiming = e.fire < 1.2;
    if (e.aiming && tgt && e.fire > 0.3) e.aimA = Math.atan2(tgt.y - e.y, tgt.x - e.x); // locks for the last 0.3s
    if (e.fire <= 0) {
      e.fire = 3.2 * enemyFireScale(); e.aiming = false;
      eBullets.push({ x: e.x + Math.cos(e.aimA) * e.r, y: e.y + Math.sin(e.aimA) * e.r, vx: Math.cos(e.aimA) * 480, vy: Math.sin(e.aimA) * 480, r: 4, color: e.color });
      beep(900, 0.12, 'square', 0.03, -600);
    }
  },
  bloodorb(e, dt) { // drifts out, then homes back to its Leech and heals it on arrival
    const b = e.owner;
    if (!b || !bosses.includes(b) || !bossAlive(b)) { e.dead = true; burst(e.x, e.y, e.color, 4, 60); return; }
    const d = Math.hypot(b.x - e.x, b.y - e.y) || 1, sp = Math.min(230, 40 + e.t * 110);
    const k = Math.min(1, dt * (e.t < 0.4 ? 0.5 : 3));
    e.vx += ((b.x - e.x) / d * sp - e.vx) * k;
    e.vy += ((b.y - e.y) / d * sp - e.vy) * k;
    if (d < b.r) {
      e.dead = true;
      b.hp = Math.min(b.max, b.hp + b.max * LEECH_ORB_HEAL); b.healT = 0.5;
      if (encounter) encounter.orbHealed = true;
      popups.push({ x: b.x + (Math.random() - 0.5) * b.r, y: b.y - b.r, text: '+HEAL', life: 0.7, color: '#ff2d55' });
      burst(e.x, e.y, e.color, 8, 120); beep(500, 0.08, 'sine', 0.03, 200);
    }
  },
  pylon(e, dt) { // circles its Warden, keeping its shield up, and takes potshots
    const b = e.owner;
    if (!b || !bosses.includes(b) || !bossAlive(b)) { e.dead = true; burst(e.x, e.y, e.color, 15, 200); return; }
    const a = time * 0.7 + e.k * Math.PI * 2 / e.n, R = b.r * 2.2;
    e.x = b.x + Math.cos(a) * R; e.y = b.y + Math.sin(a) * R * 0.8; e.spin = a;
    e.fire -= dt;
    const p = nearestPlayer(e.x, e.y);
    if (e.fire <= 0 && p) {
      e.fire = 2.6 * enemyFireScale();
      const sa = Math.atan2(p.y - e.y, p.x - e.x);
      eBullets.push({ x: e.x, y: e.y, vx: Math.cos(sa) * 200, vy: Math.sin(sa) * 200, r: 5, color: e.color });
    }
  },
  egg(e, dt) { // slides to a stop, pulses faster and faster, then hatches a swarm that heals the Hive
    const b = e.owner;
    if (!b || !bosses.includes(b) || !bossAlive(b)) { e.dead = true; burst(e.x, e.y, e.color, 15, 200); return; }
    e.vx *= Math.pow(0.08, dt); e.vy *= Math.pow(0.08, dt);
    e.timer -= dt;
    if (e.timer > 0) return;
    e.dead = true;
    const n = 3 + Math.min(3, mode);
    for (let i = 0; i < n; i++) {
      const m = makeEnemy(isEnraged(b) && i === 0 ? 'shooter' : 'swarmer', e.x, e.y), a = i / n * Math.PI * 2;
      m.vx = Math.cos(a) * 120; m.vy = Math.sin(a) * 120 + 60;
    }
    b.hp = Math.min(b.max, b.hp + b.max * 0.04); b.healT = 0.5;
    popups.push({ x: e.x, y: e.y - 20, text: 'HATCHED!', life: 1, color: e.color });
    popups.push({ x: b.x, y: b.y - b.r, text: '+HEAL', life: 0.8, color: e.color });
    burst(e.x, e.y, e.color, 40, 300); fxRing(e.x, e.y, 6, 60, 0.35, e.color, 3);
    beep(260, 0.3, 'sawtooth', 0.05, -150);
  },
  decoy(e, dt) { // a fake Phantom: bobs in its slot and fires like the real one
    const b = e.owner;
    if (!b || !bosses.includes(b) || !bossAlive(b)) { e.dead = true; return; }
    e.y = e.homeY + Math.sin(e.t * 1.3) * 14;
    e.fire -= dt;
    if (e.fire <= 0) { e.fire = DECOY_FIRE; decoyFan(b, e.x, e.y); }
  },
  orbiter(e, dt) { // three balls circle the core; they hurt on touch and can't be shot
    e.x += Math.sin(e.t * 0.8) * 30 * dt;
    for (let k = 0; k < 3; k++) {
      const b = orbiterBall(e, k);
      for (const p of living()) if (Math.hypot(b.x - p.x, b.y - p.y) < 6 + p.r * 0.7) hurt(p);
    }
  },
  warper(e, dt) { // blinks near you (after marking the spot), then fires a short burst
    e.life -= dt;
    if (e.state === 'enter') { if (e.y > 70) { e.state = 'idle'; e.vy = 0; } return; }
    if (e.life <= 0) { burst(e.x, e.y, e.color, 20, 200); e.dead = true; return; } // warps away for good
    e.fire -= dt;
    if (e.state === 'idle' && e.fire <= 0) {
      const p = nearestPlayer(e.x, e.y);
      if (!p) return;
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, d = 150 + Math.random() * 90;
      e.state = 'marking'; e.timer = 0.65;
      e.dest = { x: Math.max(30, Math.min(W - 30, p.x + Math.cos(a) * d)), y: Math.max(40, Math.min(H * 0.7, p.y + Math.sin(a) * d)) };
    } else if (e.state === 'marking' && (e.timer -= dt) <= 0) {
      fxGhost({ x: e.x, y: e.y, sides: 4, r: e.r, color: e.color, style: '', spin: e.spin }, 0.4);
      e.x = e.dest.x; e.y = e.dest.y; e.state = 'idle'; e.fire = 2.2 * enemyFireScale();
      burst(e.x, e.y, e.color, 14, 160); beep(1000, 0.12, 'sine', 0.03, -600);
      const p = nearestPlayer(e.x, e.y);
      if (p) { const a = Math.atan2(p.y - e.y, p.x - e.x); for (let k = -1; k <= 1; k++) eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a + k * 0.2) * 230, vy: Math.sin(a + k * 0.2) * 230, r: 5, color: e.color }); }
    }
  },
  serpent(e, dt) { // weaves down the screen; the body follows its trail
    e.x += Math.sin(e.t * 2.2) * 150 * dt;
    e.aimA = Math.atan2(e.vy, Math.cos(e.t * 2.2) * 150);
    e.trail.unshift({ x: e.x, y: e.y });
    if (e.trail.length > 60) e.trail.length = 60;
  },
  segment(e, dt) {
    const h = e.head;
    if (h && !h.dead && enemies.includes(h)) {
      const pt = h.trail[Math.min(h.trail.length - 1, e.idx * 6)];
      if (pt) { e.x = pt.x; e.y = pt.y; }
    } else if (e.head) { // head destroyed: the body falls apart
      e.head = null; e.vx = (Math.random() - 0.5) * 120; e.vy = 90 + Math.random() * 60;
    }
  },
  guardian(e, dt) { // parks up top and halves the damage taken by enemies near it
    if (e.state === 'enter') { if (e.y >= e.stopY) { e.state = 'hover'; e.vy = 0; } }
    else if ((e.stay -= dt) <= 0) e.vy = 120;
    e.x += Math.sin(e.t * 0.7) * 40 * dt;
    for (const o of enemies) if (o !== e && !o.dead && o.type !== 'guardian' && Math.hypot(o.x - e.x, o.y - e.y) < GUARD_RANGE) o.guardedT = 0.15;
  },
  carrier(e, dt) { // a slow mothership that keeps launching swarmers
    e.x += Math.sin(e.t * 0.5) * 25 * dt;
    e.fire -= dt;
    if (e.fire <= 0 && e.y > 0 && e.y < H * 0.6) {
      e.fire = 3.2 * enemyFireScale();
      for (let k = -1; k <= 1; k++) { const s = makeEnemy('swarmer', e.x + k * 18, e.y + e.r * 0.6); s.vx = k * 50; }
      beep(260, 0.2, 'sawtooth', 0.03, -120);
    }
  },
  healer(e, dt) { // pulses to repair nearby enemies — take it out first
    e.x += Math.sin(e.t * 1.2) * 50 * dt;
    e.pulse = Math.max(0, e.pulse - dt * 1.2);
    e.fire -= dt;
    if (e.fire <= 0 && e.y > 0) {
      e.fire = 2.5; e.pulse = 1;
      for (const o of enemies) {
        if (o === e || o.dead || o.hp >= o.maxHp || Math.hypot(o.x - e.x, o.y - e.y) > 150) continue;
        o.hp = Math.min(o.maxHp, o.hp + 2); o.healFx = 0.5;
        burst(o.x, o.y, '#5dff7a', 6, 80);
      }
      beep(700, 0.2, 'sine', 0.03, 300);
    }
  },
};

// ---------- shooting ----------
// kind: undefined (normal shot), 'missile' (homing, explodes) or 'rail' (huge piercing slug)
// p (optional): the ship that fired, whose class modifies damage, pierce and bullet speed
function fire(x, y, a, color, kind, p) {
  const s = run.s, m = p ? p.ship.mod : {}, crit = Math.random() < s.crit;
  const speed = kind === 'rail' ? 1500 : kind === 'missile' ? 420 : s.bulletSpeed * (m.bulletSpeed || 1);
  const rage = p && m.rage ? 1 + m.rage * Math.max(0, maxLivesOf(p) - p.lives) : 1; // Berserker: stronger when hurt
  const mult = (kind === 'rail' ? 8 : kind === 'missile' ? 2 : 1) * (crit ? 3 : 1) * (m.dmg || 1) * rage;
  if (Math.sin(a) < 0.3) run.fireAcc = (run.fireAcc || 0) + s.dmg * mult * s.bossDmg; // forward shots count toward firepower
  bullets.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, dmg: s.dmg * mult, crit, hits: [], color,
    pierce: kind === 'rail' ? 999 : kind === 'missile' ? 0 : s.pierce + (m.pierce || 0),
    bounces: kind === 'rail' ? 0 : s.ricochet, size: s.bulletSize + (kind === 'rail' ? 8 : 0),
    missile: kind === 'missile', rail: kind === 'rail', owner: p ? p.id : -1 });
}

function dronePos(p, k) {
  const a = time * 2.5 + k / dronesOf(p) * Math.PI * 2;
  return { x: p.x + Math.cos(a) * 42, y: p.y + Math.sin(a) * 42 };
}
function bladePos(p, k, n) {
  const a = time * 3.2 + k / n * Math.PI * 2;
  return { x: p.x + Math.cos(a) * 58, y: p.y + Math.sin(a) * 58 };
}

// ---------- dealing damage ----------
function addScore(n) {
  const v = Math.round(n * run.s.scoreMult); score += v;
  if (score >= 50000) unlockAch('score50k');
  if (score >= 250000) unlockAch('score250k');
  return v;
}

// src: 'bullet' / 'missile' (direct hits, can chain), or 'splash' / 'chain' / 'blade' (can't chain further)
function damageEnemy(e, dmg, src) {
  if (e.dead) return;
  if (e.guardedT > 0) dmg *= 0.5; // shielded by a Guardian
  e.hp -= dmg; e.flash = 0.08;
  if (run.s.cryo) e.slow = 1 + run.s.cryo * 0.5;
  if (e.hp <= 0) killEnemy(e, src);
}

function killEnemy(e, src) {
  const s = run.s;
  e.dead = true;
  const pts = addScore(e.pts * combo);
  popups.push({ x: e.x, y: e.y, text: '+' + pts.toLocaleString(), life: 0.8, hot: combo >= 4 });
  combo = Math.min(s.comboMax, combo + 1); comboT = s.comboTime;
  meta.stats.kills++; // saved at the end of the run
  unlockAch('first_blood');
  if (meta.stats.kills >= 500) unlockAch('kills500');
  if (meta.stats.kills >= 5000) unlockAch('kills5000');
  if (combo >= 8) unlockAch('combo8');
  if (combo >= 16) unlockAch('combo16');
  const big = e.r >= 20;
  burst(e.x, e.y, e.color, big ? 50 : 25, big ? 360 : 260);
  shake = Math.max(shake, big ? 10 : 4);
  beep(180 + Math.random() * 100, 0.15, 'sawtooth', 0.05, -120);
  if (e.type === 'splitter') for (let k = -1; k <= 1; k++) { // breaks into three minis
    const m = makeEnemy('mini', e.x + k * 10, e.y);
    m.vx = k * 160; m.vy = -60 + Math.abs(k) * 30;
  }
  if (e.type === 'decoy') { // popping a fake Phantom sets off a burst
    for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2; eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, r: 6, color: e.color }); }
    fxText('FAKE!', e.x, e.y - e.r - 20, e.color, 24, 1.2);
  }
  if (e.type === 'pylon') fxRing(e.x, e.y, 6, 50, 0.3, e.color, 3);
  if (mut('volatile') && e.type !== 'bloodorb') { // Endless mutator: a parting ring of bullets
    const n = 5 + mut('volatile') * 2, off = Math.random() * Math.PI;
    for (let k = 0; k < n; k++) { const a = off + k / n * Math.PI * 2; eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 130, vy: Math.sin(a) * 130, r: 4, color: '#ff9a3d' }); }
  }
  const drop = TYPES[e.type].drop ?? 0.07 * s.luck;
  if (Math.random() < drop) {
    const someoneDown = players.some(p => !p.alive);
    const kind = someoneDown && Math.random() < 0.5 ? 'life' : ['power', 'shield', 'life'][Math.floor(Math.random() * 3)];
    pickups.push({ x: e.x, y: e.y, kind, t: 0 });
  }
  if (s.siphon) { // every N kills, heal whoever is lowest
    run.siphonKills = (run.siphonKills || 0) + 1;
    const p = living().filter(q => q.lives < maxLivesOf(q)).sort((a, b) => a.lives - b.lives)[0];
    if (p && run.siphonKills >= SIPHON_KILLS[s.siphon]) {
      run.siphonKills = 0; p.lives++;
      popups.push({ x: p.x, y: p.y - 34, text: '+♥', life: 1.2, hot: true });
      burst(p.x, p.y, '#ff6fb5', 20, 180); beep(760, 0.25, 'triangle', 0.06, 380);
    }
  }
  if (s.chain && (src === 'bullet' || src === 'missile')) chainLightning(e.x, e.y, 1 + s.chain, s.dmg * 2);
}

// lightning jumps from enemy to enemy
function chainLightning(x, y, n, dmg) {
  const hit = new Set();
  for (let i = 0; i < n; i++) {
    let best = null, bd = 170;
    for (const o of enemies) { if (o.dead || hit.has(o)) continue; const d = Math.hypot(o.x - x, o.y - y); if (d < bd) { bd = d; best = o; } }
    if (!best) break;
    hit.add(best);
    bossFx.zaps.push({ x1: x, y1: y, x2: best.x, y2: best.y, life: 0.2, max: 0.2 });
    netRec(['z', Math.round(x), Math.round(y), Math.round(best.x), Math.round(best.y)]);
    x = best.x; y = best.y;
    damageEnemy(best, dmg, 'chain');
  }
  if (hit.size) beep(1400, 0.08, 'sawtooth', 0.025, -900);
}

function splash(x, y, radius, dmg, except) {
  if (bossFx.rings.length < 40) fxRing(x, y, 4, radius, 0.25, '#ffb13d', 2);
  for (const o of enemies) if (o !== except && !o.dead && Math.hypot(o.x - x, o.y - y) < radius + o.r) damageEnemy(o, dmg, 'splash');
}

// Orbital Blades: damage what they touch (with a short per-target cooldown) and delete enemy bullets
function updateBlades() {
  const s = run.s; if (!s.blades) return;
  const n = 1 + s.blades, dmg = s.dmg * 2;
  for (const p of living()) for (let k = 0; k < n; k++) {
    const { x, y } = bladePos(p, k, n);
    for (const e of enemies) {
      if (e.dead || (e.bladeCd || 0) > time || Math.hypot(e.x - x, e.y - y) > e.r + 9) continue;
      e.bladeCd = time + 0.3; damageEnemy(e, dmg, 'blade'); burst(x, y, '#ffffff', 4, 120);
    }
    for (const b of eBullets) if (!b.dead && b.fuse === undefined && Math.hypot(b.x - x, b.y - y) < (b.r || 5) + 9) { b.dead = true; burst(b.x, b.y, b.color || '#ff4d4d', 5, 100); }
    for (const bo of bosses) if ((bo.bladeCd || 0) < time && Math.hypot(bo.x - x, bo.y - y) < bo.r + 9 && bossAlive(bo)) { bo.bladeCd = time + 0.3; hitBoss(bo, dmg * s.bossDmg * bondMult(bo, p.id), x, y); }
  }
}

// Phoenix Core: cancels a fatal hit once, with a screen-clearing blast
function phoenixBlast(p) {
  const s = run.s;
  s.phoenix--; run.owned.phoenix--;
  unlockAch('phoenix');
  p.lives = Math.min(2, maxLivesOf(p)); p.inv = 3;
  for (const b of eBullets) burst(b.x, b.y, b.color || '#ff8080', 2, 80);
  eBullets = []; lasers = [];
  for (const e of enemies) damageEnemy(e, s.dmg * 8, 'splash');
  for (const bo of [...bosses]) hitBoss(bo, s.dmg * 20 * s.bossDmg);
  screenFlash = 0.8; shake = 25;
  fxRing(p.x, p.y, 10, Math.max(W, H), 0.8, '#ffb13d', 8);
  burst(p.x, p.y, '#ffb13d', 120, 600); burst(p.x, p.y, '#ffffff', 60, 400);
  fxText('PHOENIX!', p.x, Math.max(80, p.y - 70), '#ffb13d', 34, 1.6);
  beep(220, 0.8, 'sawtooth', 0.1, 660);
}

function nova(p) {
  const n = 14 * run.s.nova;
  for (let i = 0; i < n; i++) fire(p.x, p.y, i / n * Math.PI * 2, p.color, undefined, p);
}

function nearestTarget(x, y, range) {
  let best = null, bd = range;
  for (const e of enemies) { const d = Math.hypot(e.x - x, e.y - y); if (d < bd) { bd = d; best = e; } }
  for (const bo of bosses) { if (!bossAlive(bo) || bo.shielded) continue; const d = Math.hypot(bo.x - x, bo.y - y) - bo.r; if (d < bd) { bd = d; best = bo; } }
  return best;
}

// ---------- bosses ----------
function makeBoss(def, x, hp, loop, side) {
  hp = Math.round(hp);
  return { r: 58, ...def, x, y: -120, hp, max: hp, side, t: 0, spin: 0, flash: 0,
    pattern: 0, patternT: 0, atkT: 1.5, aim: 0, loop, dying: 0, entered: false, charge: null,
    // team-boss state
    downed: false, reviveT: 0, shielded: false, shieldHit: 0, forceRage: false,
    // animation state
    intro: 0, introRingT: 0, kick: 0, hitKick: 0, rage: 0, wasEnraged: false, appear: 0,
    look: { x: 0, y: 1 }, faceA: Math.PI / 2, ghostT: 0, bigAtk: true, cracks: [],
    // THE ABYSS: tentacles [aim, reach 0-1, state 0 idle/1 warn/2 strike/3 retract, timer, lash length], eruptions, darkness
    ...(def.gimmick === 'abyss' && { tents: Array.from({ length: TENT_N }, () => [0, 0, 0, 0, 0]), erupt: [], dark: 0, darkR: 175,
      phase: 1, maw: 0, mawN: 0, wasEnraged: true }) }; // (no generic ENRAGED moment: it has its own phases)
}

// Boss HP floor: strong builds used to melt bosses in seconds, so every boss has at least enough HP to last
// this long against the team's measured firepower (roughly 60% of shots land on a boss in a real fight)
const BOSS_MIN_SECS = 18, TEAM_MIN_SECS = 24, FINAL_MIN_SECS = 70, BOSS_HIT_RATE = 0.6;
const firepowerHp = secs => (run.dpsEst || 0) * BOSS_HIT_RATE * secs * (1 + 0.3 * mut('titans'));
function spawnEncounter() {
  const e = encounterDef(bossCount);
  const loop = Math.floor((bossCount - 1) / BOSS_CYCLE); // tougher each cycle
  // +40% per fight through the first cycle, then a gentler +20% so endless stays beatable
  const baseHp = 180 * Math.pow(1.4, Math.min(bossCount - 1, BOSS_CYCLE - 1)) * Math.pow(1.2, Math.max(0, bossCount - BOSS_CYCLE)) * (1 + 0.4 * (mode - 1)) * (1 + 0.3 * mut('titans'));
  if (e.single !== undefined) {
    const def = BOSSES[e.single];
    encounter = { kind: 'single', name: def.name, final: def.final };
    // the curve above, or enough to survive your team's actual firepower for a while — whichever is bigger
    bosses = [makeBoss(def, W / 2, Math.max(baseHp * (def.hpMult || 1), firepowerHp(def.final ? FINAL_MIN_SECS : BOSS_MIN_SECS)), loop, 0)];
    if (def.hint) hint = { text: def.hint, life: 6 };
  } else {
    const team = TEAMS[e.team], n = team.members.length;
    const teamHp = Math.max(baseHp, firepowerHp(TEAM_MIN_SECS) / team.members.reduce((t, m) => t + m.hpShare, 0));
    encounter = { kind: team.kind, name: team.name, angle: -Math.PI / 2, tether: 0 };
    bosses = team.members.map((m, i) => {
      const slot = i - (n - 1) / 2; // -0.5/+0.5 for a pair, -1/0/+1 for a trio
      const b = makeBoss(m, W / 2 + slot * W * (n > 3 ? 0.2 : n > 2 ? 0.28 : 0.44), teamHp * m.hpShare, loop, Math.sign(slot));
      b.slot = i; b.lastHit = time;
      // two or three bosses firing at full rate is much denser than a solo boss, so each attacks slower
      // (Sol & Luna's tether is a hazard on its own, so they get the trio treatment)
      b.atkMult = m.atkMult || (n >= 3 ? 2 : team.kind === 'binary' ? 1.5 : 1.4);
      return b;
    });
    if (team.kind === 'aegis') bosses[1].shielded = true;
    hint = { text: team.hint, life: 6 };
  }
  beep(90, 1.2, 'sawtooth', 0.12, -40);
}

// THE LEECH: damaging a player releases blood orbs that float back and heal it (players can shoot them down)
function leech(b, p) {
  if (!b.lifesteal || !bosses.includes(b) || !bossAlive(b)) return;
  for (let i = 0; i < 5; i++) {
    const e = makeEnemy('bloodorb', p.x, p.y), a = Math.random() * Math.PI * 2;
    e.owner = b; e.t = 0; e.hp = e.maxHp = 1;
    e.vx = Math.cos(a) * 170; e.vy = Math.sin(a) * 170 - 40;
  }
  popups.push({ x: p.x, y: p.y - 30, text: 'DRAINED!', life: 1, color: '#ff2d55' });
  beep(200, 0.4, 'sawtooth', 0.06, -120);
}
const LEECH_ORB_HEAL = 0.03; // share of max hp per orb that gets through

// the drain beam: 0.6s telegraph, then a meter fills while the target stays in range
function updateDrain(b, dt) {
  const d = b.drain, p = d.target;
  d.t += dt;
  const dist = Math.hypot(p.x - b.x, p.y - b.y);
  if (!p.alive || b.dying > 0) { b.drain = null; return; }
  if (d.t > 0.6 && dist > d.range) { // broke free
    b.drain = null;
    popups.push({ x: p.x, y: p.y - 30, text: 'BROKE FREE!', life: 1, color: '#7df9ff' });
    beep(700, 0.15, 'triangle', 0.05, 300);
    return;
  }
  if (d.t > 0.6) {
    d.fill += dt;
    if (Math.random() < dt * 30) particles.push({ x: p.x, y: p.y, vx: (b.x - p.x) * 2.5, vy: (b.y - p.y) * 2.5, life: 0.4, max: 0.4, color: '#ff2d55', size: 2.5 });
    if (d.fill >= 1.4) { b.drain = null; if (hurt(p)) leech(b, p); }
  }
  if (d.t > 3) b.drain = null;
}

const bossAlive = b => b.dying <= 0 && !b.downed;
const isEnraged = b => b.hp < b.max / 2 || b.forceRage;

// distance from point (px,py) to the segment a-b (for the Sol & Luna tether)
function distToSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
  return Math.hypot(px - ax - dx * t, py - ay - dy * t);
}

// team mechanics that involve both bosses at once
function updateEncounter(dt) {
  if (!encounter) return;
  if (encounter.kind === 'binary') {
    encounter.angle += dt * (bosses.some(isEnraged) ? 0.85 : 0.5);
    const [a, b] = bosses;
    const linked = bosses.length === 2 && a.entered && b.entered && bossAlive(a) && bossAlive(b);
    encounter.tether = linked ? Math.min(1.5, encounter.tether + dt) : 0; // 1.5s warm-up before it burns
    if (linked && encounter.tether >= 1.5)
      for (const p of living()) if (distToSeg(p.x, p.y, a.x, a.y, b.x, b.y) < 8 + p.r * 0.5 && hurt(p)) encounter.tetherHit = true;
  }
  if (encounter.kind === 'triad') {
    encounter.angle += dt * (bosses.length < 3 ? 0.7 : 0.35);
    for (const b of bosses) { // members left alone for a few seconds heal themselves
      b.regen = bossAlive(b) && b.entered && b.hp < b.max && time - b.lastHit > TRIAD_REGEN_DELAY;
      if (!b.regen) continue;
      b.hp = Math.min(b.max, b.hp + b.max * TRIAD_REGEN_RATE * dt);
      if (Math.random() < dt * 12) particles.push({ x: b.x + (Math.random() - 0.5) * b.r * 2, y: b.y + b.r * 0.5, vx: 0, vy: -70, life: 0.6, max: 0.6, color: '#5dff7a', size: 2.5 });
    }
  }
  if (encounter.kind === 'twins') {
    for (const b of bosses) {
      if (!b.downed) continue;
      b.reviveT -= dt;
      if (b.reviveT <= 0) { // too slow — the fallen twin comes back
        b.downed = false; b.hp = Math.round(b.max * 0.4); b.appear = 1; encounter.revived = true;
        burst(b.x, b.y, b.color, 80, 400); fxRing(b.x, b.y, 10, b.r * 4, 0.6, b.color, 5);
        fxText(`${b.name} REVIVED!`, b.x, b.y - b.r - 30, b.color, 28, 1.6);
        bossRoar(b, true); shake = Math.max(shake, 14);
      }
    }
  }
}

// where each boss drifts to when it isn't charging
function bossHome(b, enraged, hoverY) {
  if (b.slotX !== undefined) return { x: b.slotX, y: b.slotY + Math.sin(b.t * 1.3) * 14 }; // Phantom hiding among its copies
  if (b.style === 'abyss') return { x: W / 2 + Math.sin(b.t * 0.25) * W * 0.18, y: hoverY + 30 + Math.sin(b.t * 0.7) * 14 }; // a slow, looming drift
  const amp = Math.max(0, W / 2 - b.r - 20);
  const sweep = { x: W / 2 + Math.sin(b.t * (enraged ? 0.9 : 0.6)) * amp, y: b.hoverLow ? Math.max(hoverY, H * 0.33) : hoverY };
  if (!encounter || encounter.kind === 'single') return sweep;
  const partner = bosses.find(o => o !== b && bossAlive(o));
  if (encounter.kind === 'binary') {
    if (!partner) return sweep;
    const R = Math.min(W * 0.36, 190), cy = H * (0.3 + Math.sin(time * 0.4) * 0.07);
    const a = encounter.angle + (b.side > 0 ? Math.PI : 0);
    return { x: W / 2 + Math.cos(a) * R, y: cy + Math.sin(a) * R * 0.75 };
  }
  if (encounter.kind === 'quartet') { // a slowly turning diamond; each boss keeps its own slot
    const R = Math.min(W * 0.34, 190), a = time * 0.22 + b.slot * Math.PI / 2;
    const cy = W < 640 ? H * 0.45 : H * 0.35; // sits lower on narrow screens, clear of the stacked HUD
    return { x: W / 2 + Math.cos(a) * R, y: cy + Math.sin(a) * R * 0.55 };
  }
  if (encounter.kind === 'triad') { // a slowly rotating triangle that tightens as members fall
    const alive = bosses.filter(bossAlive), i = alive.indexOf(b), n = alive.length;
    const R = Math.min(W * 0.3, 160) * (n === 3 ? 1 : 0.8), a = encounter.angle + i * Math.PI * 2 / Math.max(1, n);
    if (n === 1) return sweep;
    return { x: W / 2 + Math.cos(a) * R, y: (W < 640 ? H * 0.4 : H * 0.32) + Math.sin(a) * R * 0.6 };
  }
  if (b.role === 'shielder') { // keeps away from the nearest player
    const p = nearestPlayer(b.x, b.y);
    return { x: p && p.x < W / 2 ? W * 0.82 : W * 0.18, y: hoverY * 0.75 };
  }
  if (b.role === 'striker') return { x: sweep.x, y: hoverY + 70 };
  // twins mirror each other; a lone survivor sweeps the whole screen
  if (!partner) return sweep;
  const w = Math.max(0, W / 4 - b.r * 0.5);
  return { x: W / 2 + b.side * (W * 0.25 + Math.sin(time * 0.7) * w * 0.8), y: hoverY + Math.sin(time * 1.1 + b.side) * 20 };
}

// ---------- boss effects ----------
// a destroyed boss's shell shatters: every edge of the body flies off, plus smaller debris
function shatterFx(x, y, color, sides, r, spin) {
  netRec(['d', Math.round(x), Math.round(y), color, sides, r, spin]);
  for (let i = 0; i < sides; i++) {
    const a0 = spin + i / sides * Math.PI * 2, a1 = spin + (i + 1) / sides * Math.PI * 2, mid = (a0 + a1) / 2;
    const sp = 250 + Math.random() * 250;
    bossFx.shards.push({ x: x + Math.cos(mid) * r * 0.9, y: y + Math.sin(mid) * r * 0.9, vx: Math.cos(mid) * sp, vy: Math.sin(mid) * sp,
      rot: mid + Math.PI / 2, vr: (Math.random() - 0.5) * 12, len: 2 * r * Math.sin(Math.PI / sides), life: 1.6, max: 1.6, color });
  }
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, sp = 150 + Math.random() * 400;
    bossFx.shards.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 16, len: 6 + Math.random() * 16, life: 1.2, max: 1.2, color: Math.random() < 0.3 ? '#ffffff' : color });
  }
}
function fxRing(x, y, from, to, life, color, w = 3, delay = 0) {
  netRec(['r', Math.round(x), Math.round(y), from, to, life, color, w, delay]);
  bossFx.rings.push({ x, y, from, to, life, max: life, color, w, delay });
}
function fxGhost(b, life = 0.35) {
  netRec(['g', Math.round(b.x), Math.round(b.y), bossRot(b), b.sides, b.r, b.color, life]);
  bossFx.ghosts.push({ x: b.x, y: b.y, rot: bossRot(b), sides: b.sides, r: b.r, color: b.color, life, max: life });
}
function fxText(text, x, y, color, size = 28, life = 1.6) {
  netRec(['t', text, Math.round(x), Math.round(y), color, size, life]);
  bossFx.texts.push({ text, x, y, color, size, life, max: life });
}
function updateBossFx(dt) {
  for (const r of bossFx.rings) { if (r.delay > 0) r.delay -= dt; else r.life -= dt; }
  for (const g of bossFx.ghosts) g.life -= dt;
  for (const s of bossFx.shards) { s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.985; s.vy *= 0.985; s.rot += s.vr * dt; s.life -= dt; }
  for (const t of bossFx.texts) { t.life -= dt; t.y -= 18 * dt; }
  for (const z of bossFx.zaps) z.life -= dt;
  bossFx.zaps = bossFx.zaps.filter(z => z.life > 0);
  bossFx.rings = bossFx.rings.filter(r => r.life > 0);
  bossFx.ghosts = bossFx.ghosts.filter(g => g.life > 0);
  bossFx.shards = bossFx.shards.filter(s => s.life > 0);
  bossFx.texts = bossFx.texts.filter(t => t.life > 0);
  screenFlash = Math.max(0, screenFlash - dt * 2.5);
}
const easeOut = p => 1 - Math.pow(1 - Math.min(1, Math.max(0, p)), 3);
// the lancer points its tip at you instead of spinning
const bossRot = b => b.style === 'lancer' ? b.faceA + (b.dying > 0 ? b.spin : 0) : b.spin;

function bossRoar(b, big) {
  beep(70, big ? 1 : 0.6, 'sawtooth', 0.12, -30);
  beep(140, big ? 0.8 : 0.5, 'square', 0.05, -80);
}

function nearestPlayer(x, y) {
  let best = null, bd = Infinity;
  for (const p of living()) { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } }
  return best;
}

function bossShot(b, a, speed, r = 6) {
  eBullets.push({ x: b.x + Math.cos(a) * b.r * 0.6, y: b.y + Math.sin(a) * b.r * 0.6,
    vx: Math.cos(a) * speed * BOSS_BULLET_SPEED, vy: Math.sin(a) * speed * BOSS_BULLET_SPEED, r, color: b.ink ? ABYSS_INK : b.color, src: b });
}

// every attack a boss can use; each boss picks a few of these
const BOSS_ATTACKS = {
  ring(b, enraged, rate) {
    const n = enraged ? 22 : 16, off = Math.random() * Math.PI;
    for (let i = 0; i < n; i++) bossShot(b, off + i / n * Math.PI * 2, 170);
    b.atkT = 1.1 * rate; beep(200, 0.2, 'square', 0.04, -100);
  },
  fan(b, enraged, rate, target) {
    if (!target) return;
    const a = Math.atan2(target.y - b.y, target.x - b.x), n = enraged ? 7 : 5;
    for (let i = 0; i < n; i++) bossShot(b, a + (i - (n - 1) / 2) * 0.14, 290, 5);
    b.atkT = 0.7 * rate; beep(320, 0.1, 'triangle', 0.04);
  },
  spiral(b, enraged, rate) {
    b.aim += 0.32;
    bossShot(b, b.aim, 200, 5); bossShot(b, b.aim + Math.PI, 200, 5);
    if (enraged) bossShot(b, b.aim + Math.PI / 2, 200, 5);
    b.atkT = 0.07 * rate;
  },
  summon(b, enraged) { // a squad of minions, once per cycle
    if (b.patternT > 0.8) return;
    const n = 2 + mode;
    for (let i = 0; i < n; i++) makeEnemy(enraged && i === 0 ? 'shooter' : 'zigzag', b.x + (i - (n - 1) / 2) * 50, b.y + 40);
    beep(140, 0.3, 'sawtooth', 0.05, 200);
    b.atkT = 5;
  },
  swarm(b, enraged, rate) { // a steady stream of drones pours out
    makeEnemy(Math.random() < (enraged ? 0.3 : 0.1) ? 'shooter' : 'drifter', b.x + (Math.random() - 0.5) * b.r * 2, b.y + b.r * 0.6);
    b.atkT = Math.max(0.2, 0.45 - mode * 0.05) * rate; beep(160, 0.08, 'sawtooth', 0.02, 80);
  },
  eggs(b, enraged) { // The Hive lays eggs that hatch into a swarm unless they're destroyed
    if (b.patternT > 0.8) return;
    const n = enraged ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const e = makeEnemy('egg', b.x, b.y + b.r * 0.5), tx = W * (0.15 + 0.7 * (i + 0.5) / n) + (Math.random() - 0.5) * 60;
      const ty = Math.min(H * 0.62, b.y + 120 + Math.random() * H * 0.2);
      e.owner = b; e.hp = e.maxHp = Math.max(3, Math.round(b.max * 0.03));
      e.vx = (tx - b.x) * 1.6; e.vy = (ty - b.y) * 1.6; e.timer = EGG_HATCH; e.state = 'egg';
    }
    beep(180, 0.4, 'sine', 0.06, -90);
    b.atkT = 5;
  },
  mines(b, enraged, rate) { // slow mines that burst into rings
    const n = enraged ? 4 : 3;
    for (let i = 0; i < n; i++) {
      const a = Math.PI / 2 + (i - (n - 1) / 2) * 0.6 + (Math.random() - 0.5) * 0.3, sp = 120 + Math.random() * 120;
      eBullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 10, color: b.color, fuse: 1.4 + Math.random() * 0.6 });
    }
    b.atkT = 1.6 * rate; beep(120, 0.2, 'triangle', 0.05);
  },
  laser(b, enraged, rate, target) { // telegraphed vertical beams, one aimed at you
    const xs = target ? [target.x] : [];
    while (xs.length < (enraged ? 3 : 2)) xs.push(30 + Math.random() * (W - 60));
    for (const x of xs) lasers.push({ x, warn: 1.5, fire: 0.5, w: 34, color: b.color });
    b.atkT = 2.2 * rate; beep(600, 0.5, 'sine', 0.04, 400);
  },
  charge(b, enraged, rate, target) { // wind up, then ram the nearest player
    if (!target || b.charge) return;
    b.charge = { phase: 'aim', t: enraged ? 0.7 : 1, tx: target.x, ty: target.y };
    b.atkT = 2.6 * rate; beep(220, 0.6, 'sawtooth', 0.05, 300);
  },
  rain(b, enraged, rate) { // bullets fall from the top of the screen
    for (let i = 0; i < (enraged ? 3 : 2); i++)
      eBullets.push({ x: Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 30, vy: 200 + Math.random() * 80, r: 5, color: b.color });
    b.atkT = 0.13 * rate;
  },
  wave(b, enraged, rate) { // two swaying streams
    const sway = Math.sin(b.t * 3) * 0.9;
    for (const side of [-1, 1]) bossShot(b, Math.PI / 2 + sway * side, 230, 5);
    if (enraged) bossShot(b, Math.PI / 2 + Math.sin(b.t * 5) * 0.4, 260, 5);
    b.atkT = 0.09 * rate;
  },
  drain(b, enraged, rate, target) { // latch a beam onto the nearest player; get out of range or lose a life
    if (!target || b.drain) return;
    b.drain = { target, t: 0, fill: 0, range: enraged ? 420 : 380 };
    b.atkT = 3.4 * rate; beep(90, 0.8, 'sawtooth', 0.06, 60);
  },
  // ----- THE ABYSS -----
  lash(b, enraged, rate) { // tentacles lock onto players (red warning line), then whip out at them
    const targets = living(); if (!targets.length) return;
    const n = (b.phase || 1) + (enraged ? 1 : 0);
    for (let i = 0; i < n; i++) abyssLash(b, targets[i % targets.length], i >= targets.length);
    b.atkT = 1.5 * rate;
  },
  ink(b, enraged, rate, target) { // two staggered rings of black ink, plus a spread at you
    const off = Math.random() * Math.PI;
    for (let i = 0; i < 18; i++) bossShot(b, off + i / 18 * Math.PI * 2, 140, 8);
    for (let i = 0; i < 12; i++) bossShot(b, off + (i + 0.5) / 12 * Math.PI * 2, 205, 6);
    if (target && (enraged || b.phase >= 2)) {
      const a = Math.atan2(target.y - b.y, target.x - b.x);
      for (let i = -2; i <= 2; i++) bossShot(b, a + i * 0.12, 300, 6);
    }
    b.atkT = 1.3 * rate; beep(70, 0.4, 'sawtooth', 0.07, -20);
  },
  eruption(b, enraged, rate) { // tentacles burst up from below, under every player (warning cracks first)
    if (b.patternT > 0.8 && b.erupt.length) return;
    for (const p of living()) b.erupt.push([Math.round(p.x), 0]);
    for (let i = 0; i < (b.phase >= 3 ? 3 : b.phase >= 2 ? 2 : 1); i++) b.erupt.push([Math.round(30 + Math.random() * (W - 60)), -Math.random() * 0.4]);
    b.atkT = 2.4 * rate; beep(45, 0.9, 'sawtooth', 0.08, 30);
  },
  maw(b, enraged, rate) { // its mouth tears open, then breathes out rings of ink (each with a gap to slip through)
    b.maw = 1.1; b.mawN = b.phase >= 3 ? 4 : 3; b.mawGap = Math.random() * Math.PI * 2;
    shake = Math.max(shake, 10); bossRoar(b, true);
    b.atkT = 3 * rate;
  },
  blink(b, enraged, rate) { // teleport somewhere new and burst
    fxGhost(b, 0.6); fxRing(b.x, b.y, b.r * 1.4, 4, 0.3, b.color, 3); // implode where it was
    b.appear = 1;
    burst(b.x, b.y, b.color, 40, 300);
    b.x = b.r + Math.random() * (W - b.r * 2);
    b.y = Math.min(H * 0.45, 120 + Math.random() * H * 0.25);
    burst(b.x, b.y, '#ffffff', 40, 300);
    beep(900, 0.2, 'sine', 0.05, -700);
    const n = enraged ? 18 : 12, off = Math.random() * Math.PI;
    for (let i = 0; i < n; i++) bossShot(b, off + i / n * Math.PI * 2, 150, 7);
    b.atkT = 1.5 * rate;
  },
};

// ---------- boss gimmicks ----------
// each solo boss has one twist. update() returns 'hold' (no moving or attacking) or 'quiet' (no attacking);
// dmg() scales damage taken (fx, fy = where the hit landed, when known)
const EGG_HATCH = 5, HALO_REFLECT_SPEED = 250, RIFT_LIFE = 2.4, RIFT_ARM = 0.4;
const STRIKE_WARN = 1.1, STRIKE_BOLT = 0.25, STRIKE_END = 3.2, STRIKE_R = 52, STATIC_R = 38;

const ownerOf = (e, gimmick) => e.owner || bosses.find(b => b.gimmick === gimmick);
const GIMMICKS = {
  pylons: {
    update(b, dt, enraged) {
      b.guard = enemies.filter(e => e.type === 'pylon' && !e.dead && e.owner === b).length;
      if (b.guard) return;
      b.pylonT = (b.pylonT ?? 1.8) - dt; // first set goes up just after its entrance
      if (b.pylonT > 0) return;
      b.pylonT = enraged ? 11 : 15;
      const n = enraged ? 4 : 3;
      for (let k = 0; k < n; k++) {
        const e = makeEnemy('pylon', b.x, b.y);
        e.owner = b; e.k = k; e.n = n; e.vx = e.vy = 0; e.fire = 1.5 + k * 0.6;
        e.hp = e.maxHp = Math.max(4, Math.round(b.max * 0.03));
      }
      b.guard = n;
      fxRing(b.x, b.y, b.r, b.r * 3, 0.5, b.color, 4);
      fxText('PYLONS RAISED — SHIELD UP', b.x, b.y + b.r + 40, b.color, 20, 1.6);
      beep(300, 0.5, 'square', 0.05, 300);
    },
    dmg: b => b.guard > 0 ? 0.35 : 1,
  },
  overheat: {
    update(b, dt) {
      if (b.vent > 0) {
        b.vent -= dt; b.heat = Math.max(0, b.vent / 3.5);
        if (Math.random() < dt * 30) particles.push({ x: b.x + (Math.random() - 0.5) * b.r, y: b.y, vx: (Math.random() - 0.5) * 60, vy: -90 - Math.random() * 80, life: 0.8, max: 0.8, color: Math.random() < 0.5 ? '#ffffff' : '#ffd8a0', size: 3 });
        for (const p of living()) if (Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.6) hurt(p); // too hot to touch
        if (b.vent <= 0) { // cooled down: a parting ring of embers
          b.vent = 0; b.heat = 0;
          for (let i = 0; i < 14; i++) bossShot(b, i / 14 * Math.PI * 2, 160, 6);
          fxRing(b.x, b.y, b.r, b.r * 3, 0.4, b.color, 4);
        }
        return 'quiet';
      }
      if ((b.heat || 0) >= 1) {
        b.vent = 3.5; b.heat = 1; b.charge = null;
        fxText('OVERHEATED! ×2 DAMAGE', b.x, b.y - b.r - 30, '#ffffff', 26, 1.8);
        fxRing(b.x, b.y, b.r, b.r * 4, 0.6, '#ffffff', 6); shake = Math.max(shake, 14);
        beep(160, 1, 'sawtooth', 0.08, -100);
        return 'quiet';
      }
    },
    // every shot heats it up; big volleys more than rapid fire
    afterAttack(b, enraged) { b.heat = Math.min(1, (b.heat || 0) + (b.atkT >= 0.5 ? 0.085 : 0.011) * (enraged ? 1.15 : 1)); },
    rate: b => 1 - (b.heat || 0) * 0.35,
    dmg: b => b.vent > 0 ? 2 : 1,
  },
  halo: {
    update(b, dt, enraged) {
      if (b.haloUp > 0) { b.haloUp -= dt; if (b.haloUp <= 0) { b.haloUp = 0; b.haloT = enraged ? 6 : 8; } return; }
      if (b.haloW > 0) {
        b.haloW -= dt;
        if (b.haloW <= 0) {
          b.haloW = 0; b.haloUp = enraged ? 3 : 2.5;
          fxRing(b.x, b.y, b.r, b.r * 2.2, 0.4, '#ffffff', 4); beep(1200, 0.4, 'sine', 0.05, 400);
        }
        return;
      }
      b.haloT = (b.haloT ?? 5) - dt;
      if (b.haloT <= 0) { b.haloW = 0.9; fxText('MIRROR HALO!', b.x, b.y - b.r - 30, '#ffffff', 22, 1.2); beep(900, 0.6, 'sine', 0.04, 300); }
    },
    dmg: b => b.haloUp > 0 ? 0 : 1,
  },
  stun: {
    update(b, dt) {
      b.rifts ||= [];
      for (const r of b.rifts) r[4] += dt;
      b.rifts = b.rifts.filter(r => r[4] < RIFT_LIFE);
      for (const r of b.rifts) if (r[4] > RIFT_ARM)
        for (const p of living()) if (distToSeg(p.x, p.y, r[0], r[1], r[2], r[3]) < 9 + p.r * 0.5) hurt(p);
      if (b.stun > 0) {
        b.stun -= dt; if (b.stun <= 0) b.stun = 0;
        if (Math.random() < dt * 8) burst(b.x + (Math.random() - 0.5) * b.r, b.y + (Math.random() - 0.5) * b.r, '#ffffff', 3, 60);
        return 'hold';
      }
    },
    dmg: b => b.stun > 0 ? 2 : 1,
  },
  storm: {
    update(b, dt, enraged) {
      b.strikes ||= [];
      for (const s of b.strikes) {
        const before = s[2]; s[2] += dt;
        if (before < STRIKE_WARN && s[2] >= STRIKE_WARN) { // the bolt lands
          burst(s[0], s[1], '#d8f4ff', 25, 260); shake = Math.max(shake, 7); beep(90, 0.3, 'sawtooth', 0.06, -40);
          fxRing(s[0], s[1], 8, STRIKE_R * 1.3, 0.3, '#d8f4ff', 3);
        }
        const r = s[2] < STRIKE_WARN ? 0 : s[2] < STRIKE_WARN + STRIKE_BOLT ? STRIKE_R : STATIC_R;
        if (r) for (const p of living()) if (Math.hypot(p.x - s[0], p.y - s[1]) < r + p.r * 0.4) hurt(p);
      }
      b.strikes = b.strikes.filter(s => s[2] < STRIKE_END);
      b.boltT = (b.boltT ?? 2) - dt;
      if (b.boltT > 0) return;
      b.boltT = enraged ? 2.6 : 3.4;
      // one strike on every player, plus a few strays
      for (const p of living()) b.strikes.push([Math.round(p.x), Math.round(p.y), 0]);
      for (let i = 0; i < (enraged ? 3 : 1); i++) b.strikes.push([40 + Math.random() * (W - 80), H * 0.35 + Math.random() * H * 0.55, 0]);
      beep(1500, 0.3, 'sawtooth', 0.02, -1200);
    },
  },
  brood: {}, // all in the 'eggs' attack and the egg AI
  abyss: {
    update(b, dt) {
      // three phases: at 66% the lights go out, at 33% it fully awakens
