  // charge-up before a big attack: energy is sucked into the core
  if (b.bigAtk && !b.charge && b.atkT > 0 && b.atkT < 0.45 && Math.random() < dt * 45) {
    const a = Math.random() * Math.PI * 2, d = b.r * (1.8 + Math.random() * 0.8);
    particles.push({ x: b.x + Math.cos(a) * d, y: b.y + Math.sin(a) * d, vx: -Math.cos(a) * d * 2.4, vy: -Math.sin(a) * d * 2.4,
      life: 0.4, max: 0.4, color: Math.random() < 0.3 ? '#ffffff' : b.color, size: 2.5 });
  }
  if (b.atkT > 0 || b.charge || gim === 'quiet') return;
  BOSS_ATTACKS[b.patterns[b.pattern]](b, enraged, rate, tgt);
  GIMMICKS[b.gimmick]?.afterAttack?.(b, enraged);
  // recoil: big attacks punch outward with a shockwave, rapid-fire ones just twitch
  b.bigAtk = b.atkT >= 0.5;
  if (b.bigAtk) { b.kick = 1; fxRing(b.x, b.y, b.r * 0.8, b.r * 2.6, 0.45, b.color, 4); }
  else b.kick = Math.max(b.kick, 0.3);
}

// returns false if the hit was blocked (shield) or didn't count
function hitBoss(b, dmg, fx, fy) {
  if (!bossAlive(b)) return false;
  if (b.shielded) { // Aegis' shield: no damage, just a flash and a ping
    if (b.shieldHit <= 0) beep(1500, 0.04, 'triangle', 0.02);
    b.shieldHit = 0.12; return false;
  }
  const g = GIMMICKS[b.gimmick];
  if (g && b.entered) {
    dmg *= g.dmg?.(b, fx, fy) ?? 1;
    if (dmg <= 0) return false;
    g.onHit?.(b, dmg);
  }
  b.hp -= dmg; b.flash = 0.06; b.lastHit = time;
  dmgNumber(b, dmg, true);
  b.hitKick = Math.min(1, b.hitKick + 0.15);
  if (b.hp > 0) return true;
  b.hp = 0;
  const partner = bosses.find(o => o !== b);
  if (encounter.kind === 'twins' && partner && bossAlive(partner)) {
    // soul link: this twin falls, and comes back unless its twin goes down too
    b.downed = true; b.reviveT = TWIN_REVIVE(); b.charge = null;
    burst(b.x, b.y, b.color, 60, 350); fxRing(b.x, b.y, b.r, b.r * 3, 0.5, b.color, 4);
    fxText(`${b.name} DOWN!`, b.x, b.y - b.r - 30, b.color, 28, 1.6);
    showToast(`Destroy ${partner.name} before ${b.name} revives!`);
    netRec(['o', `Destroy ${partner.name} before ${b.name} revives!`]);
    bossRoar(b, false); shake = Math.max(shake, 12);
    return true;
  }
  startBossDeath(b);
  if (partner && partner.downed) { partner.downed = false; startBossDeath(partner); } // twins fall together
  if (encounter.kind === 'aegis' && b.role === 'shielder' && partner) {
    partner.shielded = false; partner.forceRage = true;
    fxRing(partner.x, partner.y, partner.r * 1.4, partner.r * 4, 0.5, '#5dff7a', 5); burst(partner.x, partner.y, '#5dff7a', 60, 400);
    fxText('SHIELD DOWN!', partner.x, partner.y - partner.r - 30, '#5dff7a', 28, 1.6);
  }
  // losing a partner enrages the rest
  if (['binary', 'triad', 'quartet'].includes(encounter.kind)) for (const o of bosses) if (o !== b && bossAlive(o)) o.forceRage = true;
  return true;
}

// achievements for winning a boss fight (called once, when its last boss is gone)
function onEncounterBeaten(enc, last) {
  unlockAch('first_boss');
  run.coins = (run.coins || 0) + (run.rush ? 60 : 30); // shop money (Boss Rush has few other kills)
  if (!enc.hitTaken) unlockAch('flawless');
  if (living().some(p => p.lives === 1 && maxLivesOf(p) > 1)) unlockAch('clutch');
  if (last.final) unlockAch('omega');
  if (last.secret) unlockAch('zero');
  if (enc.kind === 'twins' && !enc.revived) unlockAch('twins');
  if (enc.kind === 'binary' && !enc.tetherHit) unlockAch('tether');
  if (enc.kind === 'aegis') unlockAch('aegis');
  if (enc.kind === 'triad') unlockAch('triad');
  if (enc.kind === 'quartet') unlockAch('quartet');
  if (enc.name === 'THE LEECH' && !enc.orbHealed) unlockAch('starved');
  if (enc.kind !== 'single' && mode > 1 && !enc.anyDowned) unlockAch('teamwork');
  if (run.owned.glass) unlockAch('glass');
  for (const p of living()) meta.stats.bossShips[p.ship.id] = true;
  if (Object.keys(meta.stats.bossShips).length >= 4) unlockAch('versatile');
  saveMeta();
}

function startBossDeath(b) {
  b.dying = DEATH_TIME; b.charge = null; b.drain = null;
  b.cracks = Array.from({ length: 8 }, () => ({ a: Math.random() * Math.PI * 2, len: 0.6 + Math.random() * 0.5, bend: (Math.random() - 0.5) * 0.8 }));
  bossRoar(b, true);
  addScore(5000 * bossCount * (encounter.kind === 'single' ? 1 : 0.6)); // no combo multiplier: it made boss kills dwarf everything
  if (bosses.every(o => o.dying > 0)) { // the whole encounter is beaten: clear the screen
    for (const e of eBullets) burst(e.x, e.y, e.color || '#ff8080', 3, 80);
    eBullets = []; lasers = [];
  }
}

// ---------- players ----------
const REVIVE_TIME = 2.5, REVIVE_RANGE = 70;

// earned: true when a teammate brought them back (not the automatic rejoin at a new sector)
function revive(p, by, earned) {
  if (earned) { meta.stats.revives++; unlockAch('revive'); if (meta.stats.revives >= 10) unlockAch('revive10'); }
  p.alive = true; p.lives = 1; p.inv = 2.5; p.power = 0; p.shield = 0;
  if (p.wreck) { p.x = p.wreck.x; p.y = p.wreck.y; }
  else { p.x = by ? by.x : W / 2; p.y = by ? Math.min(H - 40, by.y + 40) : H - 100; }
  p.wreck = null; p.reviveProg = 0;
  burst(p.x, p.y, p.color, 40, 300);
  beep(520, 0.3, 'triangle', 0.08, 520);
}

// red screen edges for whoever got hit (online, each player only sees their own)
function flashHurt(p, amount) {
  if (!p.remote) hurtFlash = Math.max(hurtFlash, amount);
  netRec(['h', p.id, amount]);
}

// returns true if the hit landed (broke a shield or cost a life)
function hurt(p) {
  if (p.inv > 0 || !p.alive || p.phaseOn > 0) return false; // (Wraiths are untouchable while phased)
  if (encounter) encounter.hitTaken = true; // for the Flawless achievement
  if (run.s.nova) nova(p);
  if (p.shield > 0) {
    p.shield = 0; p.inv = 1 + run.s.invBonus * 0.5; p.aegisT = 0; flashHurt(p, 0.4); beep(300, 0.2, 'sawtooth', 0.06, -200); burst(p.x, p.y, '#7df9ff', 30);
    if (run.s.angel) for (let i = 0; i < 18; i++) fire(p.x, p.y, i / 18 * Math.PI * 2, '#7df9ff', undefined, p); // Guardian Angel evolution
    return true;
  }
  p.lives--; p.inv = 2 + run.s.invBonus; p.power = 0; shake = 18; combo = 1; flashHurt(p, 1);
  burst(p.x, p.y, '#ffffff', 50, 400);
  beep(120, 0.4, 'sawtooth', 0.1, -80);
  if (p.lives <= 0 && run.s.phoenix > 0) { phoenixBlast(p); return true; }
  if (p.lives <= 0) {
    p.alive = false;
    if (encounter) encounter.anyDowned = true;
    // leave a wreck a teammate can fly to and revive
    p.wreck = { x: p.x, y: Math.min(p.y, H - 60) }; p.reviveProg = 0;
    burst(p.x, p.y, p.color, 80, 500);
    if (!living().length) endRun();
  }
  return true;
}

// which inputs drive each player, per mode (gamepad N always drives player N as well)
const CONTROLS = {
  1: [['wasd', 'arrows', 'mouse']],
  2: [['wasd'], ['arrows', 'mouse']],
  3: [['mouse'], ['wasd'], ['arrows']],
  4: [['mouse'], ['wasd'], ['arrows'], ['ijkl']],
};

function controlsFor(p) {
  let dx = 0, dy = 0;
  // online: remote players' ships are moved by their own computers; the local player gets every control
  if (net.role && p.remote) return { dx: 0, dy: 0, usePointer: false };
  // (online, players sharing this computer split the keyboard like local co-op)
  const k = net.role ? net.mine.indexOf(p.id) : p.id, scheme = CONTROLS[net.role ? net.localN : mode]?.[k] || ['wasd', 'arrows', 'mouse'];
  if (scheme.includes('wasd')) { if (keys.KeyA) dx--; if (keys.KeyD) dx++; if (keys.KeyW) dy--; if (keys.KeyS) dy++; }
  if (scheme.includes('arrows')) { if (keys.ArrowLeft) dx--; if (keys.ArrowRight) dx++; if (keys.ArrowUp) dy--; if (keys.ArrowDown) dy++; }
  if (scheme.includes('ijkl')) {
    if (keys.KeyJ || keys.Numpad4) dx--; if (keys.KeyL || keys.Numpad6) dx++;
    if (keys.KeyI || keys.Numpad8) dy--; if (keys.KeyK || keys.Numpad5 || keys.Numpad2) dy++;
  }
  const usePointer = scheme.includes('mouse');
  const pad = padState[k];
  if (pad && (pad.x || pad.y)) { dx = pad.x; dy = pad.y; }
  return { dx, dy, usePointer };
}

let padState = [null, null, null, null];

// ---------- update ----------
function update(dt) {
  padState = [readPad(0), readPad(1), readPad(2), readPad(3)];
  for (const pad of padState) {
    if (!pad) continue;
    if (state === 'play' && pad.start) { paused = !paused; sel = 0; continue; }
    if (state !== 'play' || paused) { if (pad.nav) moveSel(pad.nav); if (pad.pressed || pad.start) activate(); }
  }

  updateBackground(dt);
  updateAchBanner(dt);
  updateMusicFilter();
  if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
  updateStars(dt);
  if (state !== 'play' || paused) { updateParticles(dt); return; }
  time += dt;
  // how much boss damage the team is putting out per second, smoothed over a few seconds (see firepowerHp)
  run.dpsEst = (run.dpsEst || 0) + ((run.fireAcc || 0) / dt - (run.dpsEst || 0)) * Math.min(1, dt / 5); run.fireAcc = 0;
  const s = run.s;
  time += dt;
  if (hint) { hint.life -= dt; if (hint.life <= 0) hint = null; }
  if (run.victoryT) { run.victoryT -= dt; if (run.victoryT <= 0) { run.victoryT = 0; endRun(true); return; } }
  hurtFlash = Math.max(0, hurtFlash - dt * 1.8);
  for (const pp of popups) { pp.life -= dt; pp.y -= 45 * dt; }
  popups = popups.filter(pp => pp.life > 0);

  updateWarp(dt);
  // sector clock — stops while a boss is incoming or alive (and during a warp to a new zone)
  const bossActive = bosses.length > 0 || bossWarn > 0 || !!run.warp;
  if (!bossActive) {
    levelT += dt;
    if (levelT >= SECTOR_TIME) {
      levelT = 0; level++;
      if (level >= 5) unlockAch('sector5');
      if (level >= 10) unlockAch('sector10');
      const alive = living();
      for (const p of players) if (!p.alive && !p.gone) revive(p, alive[0]); // downed teammates rejoin
      pendingBoss = level % BOSS_EVERY === 0;
      openUpgrade(`SECTOR ${level - 1} CLEARED`, false);
      return;
    }
  }
  if (bossWarn > 0 && !run.warp) { // (the warning waits until the warp is over)
    const before = bossWarn;
    bossWarn -= dt;
    if (Math.floor(before * 2) !== Math.floor(bossWarn * 2)) beep(110, 0.25, 'square', 0.05);
    if (bossWarn <= 0) spawnEncounter();
  }
  if (bosses.length) { updateEncounter(dt); for (const bo of [...bosses]) updateBoss(bo, dt); if (state !== 'play') return; }

  for (const p of players) {
    if (!p.alive) continue;
    const m = p.ship.mod, speed = s.speed * (m.speed || 1);
    const ox = p.x, oy = p.y;
    const { dx, dy, usePointer } = controlsFor(p);
    if (dx || dy) {
      const l = Math.max(1, Math.hypot(dx, dy)); p.x += dx / l * speed * dt; p.y += dy / l * speed * dt;
    } else if (usePointer && pointer) {
      // the ship sits right under a mouse cursor, but a little above a finger so you can see it
      const ty = pointer.y - (pointer.touch ? 50 : 0);
      const k = 1 - Math.exp(-dt * 22); // frame-rate independent, snappy follow
      p.x += (pointer.x - p.x) * k;
      p.y += (ty - p.y) * k;
    }
    p.x = Math.max(p.r, Math.min(W - p.r, p.x));
    p.y = Math.max(p.r, Math.min(H - p.r, p.y));
    // bank into turns and burn brighter when climbing (purely visual)
    const kk = Math.min(1, dt * 12), vx = (p.x - ox) / dt, vy = (p.y - oy) / dt;  // (remote ships report their own bank)
    if (!p.remote) p.tilt = (p.tilt || 0) + (Math.max(-1, Math.min(1, vx / 500)) * 0.45 - (p.tilt || 0)) * kk;
    if (!p.remote) p.thrust = (p.thrust || 0) + (Math.max(0, Math.min(1, -vy / 400)) - (p.thrust || 0)) * kk;
    p.inv = Math.max(0, p.inv - dt);
    p.power = Math.max(0, p.power - dt);
    p.sapped = Math.max(0, (p.sapped || 0) - dt);

    // auto fire
    p.shotT -= dt;
    if (p.shotT <= 0) {
      const powered = p.power > 0;
      // keep leftover time so fire rate (and Overclock) isn't rounded down to whole frames
      p.shotT = Math.max(p.shotT, -0.05) + s.fireDelay * (m.fireRate || 1) * (powered ? 0.6 : 1) * (p.sapped > 0 ? 1.7 : 1); // (a Sapper slows your guns)
      const n = Math.max(1, s.shots + (m.shots || 0) + (powered ? 3 : 0)), step = (powered ? 0.12 : 0.06) * (m.spread || 1);
      for (let i = 0; i < n; i++) fire(p.x + (i - (n - 1) / 2) * 4, p.y - 16, -Math.PI / 2 + (i - (n - 1) / 2) * step, p.color, undefined, p);
      for (let i = 0; i < s.rear; i++) fire(p.x, p.y + 14, Math.PI / 2 + (i - (s.rear - 1) / 2) * 0.25, p.color, undefined, p);
      if (s.bulletHell && (p.volley = (p.volley || 0) + 1) % 5 === 0) // Bullet Hell evolution: a full ring every 5th volley
        for (let i = 0; i < 14; i++) fire(p.x, p.y, i / 14 * Math.PI * 2, p.color, undefined, p);
      beep(880 + p.id * 110, 0.04, 'square', 0.012);
    }
    if (dronesOf(p)) {
      p.droneT -= dt;
      if (p.droneT <= 0) {
        p.droneT = Math.max(p.droneT, -0.05) + (s.swarm ? 0.125 : 0.25); // (Drone Swarm: twice as fast)
        for (let k = 0; k < dronesOf(p); k++) { const d = dronePos(p, k); fire(d.x, d.y - 6, -Math.PI / 2, '#ffffff', undefined, p); }
      }
    }
    if (m.heal) { // Medic: patch up whoever is most hurt (MK II: everyone who's hurt), including yourself
      p.healT += dt;
      if (p.healT >= m.heal) {
        const hurt = living().filter(o => o.lives < maxLivesOf(o)).sort((a, b) => a.lives - b.lives);
        const targets = m.healAll ? hurt : hurt.slice(0, 1);
        if (targets.length) {
          p.healT = 0;
          fxRing(p.x, p.y, 10, m.healAll ? 160 : 90, 0.5, '#5dff7a', 3);
          for (const q of targets) {
            q.lives++;
            for (let i = 0; i < 16; i++) particles.push({ x: p.x, y: p.y, vx: (q.x - p.x) * 2.2 + (Math.random() - 0.5) * 60, vy: (q.y - p.y) * 2.2 + (Math.random() - 0.5) * 60, life: 0.45, max: 0.45, color: '#5dff7a', size: 3 });
            burst(q.x, q.y, '#5dff7a', 14, 120); // (also shows the heal on online guests' screens)
            popups.push({ x: q.x, y: q.y - 34, text: '+♥', life: 1.2, color: '#5dff7a' });
          }
          beep(760, 0.25, 'triangle', 0.06, 380);
        }
      }
    }
    if (s.missiles) { // pairs of homing missiles peel off the wings
      p.missileT = (p.missileT ?? 1) - dt;
      if (p.missileT <= 0) {
        p.missileT = Math.max(p.missileT, -0.05) + (s.missiles >= 2 ? 0.85 : 1.15) * (s.inferno ? 0.5 : 1); // (Inferno Barrage: twice as often)
        for (let i = 0; i < 2 * s.missiles; i++) {
          const side = i % 2 ? 1 : -1;
          fire(p.x + side * 12, p.y, -Math.PI / 2 + side * (0.6 + (i >> 1) * 0.35), '#ff9a3d', 'missile', p);
        }
        beep(300, 0.12, 'sawtooth', 0.025, 300);
      }
    }
    if (s.railgun) {
      p.railT = (p.railT ?? 1.5) - dt;
      if (p.railT <= 0) {
        p.railT = Math.max(p.railT, -0.05) + (s.railgun >= 2 ? 1.3 : 1.9);
        fire(p.x, p.y - 20, -Math.PI / 2, '#bff8ff', 'rail', p);
        fxRing(p.x, p.y - 20, 4, 30, 0.2, '#bff8ff', 3);
        shake = Math.max(shake, 3); beep(160, 0.3, 'sawtooth', 0.05, 900);
      }
    }
    // shield recharge: from the Aegis Field upgrade and/or the Juggernaut's built-in generator (whichever is faster)
    const aegisEvery = Math.min(s.aegis ? [0, 20, 14, 9][s.aegis] : Infinity, m.aegis || Infinity) * (s.angel ? 0.5 : 1); // (Guardian Angel: twice as fast)
    if (m.phase) { // Wraith: phase out briefly on a timer
      if (p.phaseOn > 0) p.phaseOn -= dt;
      else if ((p.phaseCd = (p.phaseCd || 0) + dt) >= m.phase) {
        p.phaseCd = 0; p.phaseOn = m.phaseDur;
        beep(1100, 0.25, 'sine', 0.04, -700); fxRing(p.x, p.y, 30, 6, 0.3, p.color, 2);
      }
    }
    if (isFinite(aegisEvery) && !p.shield) {
      p.aegisT += dt;
      if (p.aegisT >= aegisEvery) { p.shield = 1; p.aegisT = 0; beep(700, 0.2, 'triangle', 0.05, 300); }
    }
  }

  // spawn (faster in co-op)
  updateHazards(dt); // (the zone's hazard, if it has one)
  spawnT -= dt;
  if (spawnT <= 0 && !bossActive) {
    spawnEnemy();
    spawnT = Math.max(0.18, 0.9 - level * 0.07) * (0.6 + Math.random() * 0.8) * [1, 1, 0.7, 0.55, 0.45, 0.4, 0.36, 0.33, 0.3][mode] / (1 + 0.3 * mut('frenzy'));
  }

  // things that bend your shots: Vortex enemies, and THE SINGULARITY (from much further away)
  const vortexes = [...enemies.filter(e => e.type === 'vortex' && !e.dead).map(e => ({ x: e.x, y: e.y, r: VORTEX_R })),
    ...bosses.filter(o => o.gimmick === 'gravity' && bossAlive(o)).map(o => ({ x: o.x, y: o.y, r: SINGULARITY_PULL }))];
  for (const b of bullets) {
    if ((s.homing && !b.rail) || b.missile) {
      const tgt = nearestTarget(b.x, b.y, b.missile ? 600 : 350);
      if (tgt) {
        const sp = Math.hypot(b.vx, b.vy);
        let cur = Math.atan2(b.vy, b.vx);
        const d = ((Math.atan2(tgt.y - b.y, tgt.x - b.x) - cur + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        cur += Math.sign(d) * Math.min(Math.abs(d), (b.missile ? 5 : s.homing * 4) * dt);
        b.vx = Math.cos(cur) * sp; b.vy = Math.sin(cur) * sp;
      }
    }
    for (const v of vortexes) { // Vortexes bend your shots into themselves (shielding whatever is behind them)
      const dx = v.x - b.x, dy = v.y - b.y, d = Math.hypot(dx, dy);
      if (b.rail || d > v.r || d < 1) continue;
      const sp = Math.hypot(b.vx, b.vy), a = turnToward(Math.atan2(b.vy, b.vx), Math.atan2(dy, dx), 6 * dt);
      b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
    }
    // remember where it was, so hits are checked along the whole path (fast shots at low fps can't skip small targets)
    b.px = b.x; b.py = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.missile && Math.random() < dt * 40) particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.25, max: 0.25, color: '#ff9a3d', size: 2 });
    if (b.bounces > 0) { // Ricochet: bounce off the edges (and allow re-hitting the same enemy)
      if (b.x < 0 || b.x > W) { b.vx = -b.vx; b.x = Math.max(0, Math.min(W, b.x)); b.bounces--; b.hits = []; }
      else if (b.y < 0 || b.y > H) { b.vy = -b.vy; b.y = Math.max(0, Math.min(H, b.y)); b.bounces--; b.hits = []; }
    }
    for (const bo of bosses) {
      if (b.dead || !bossAlive(bo)) continue;
      if (bo.shielded && distToSeg(bo.x, bo.y, b.px, b.py, b.x, b.y) < bo.r * 1.45) { // bounces off Aegis' bubble
        b.dead = true; hitBoss(bo, 0);
        if (Math.random() < 0.5) burst(b.x, b.y, '#5dff7a', 3, 120);
        continue;
      }
      if (bo.haloUp > 0 && distToSeg(bo.x, bo.y, b.px, b.py, b.x, b.y) < bo.r * 1.5) { // Null Seraph's halo sends shots back
        b.dead = true;
        if ((bo.reflectCd || 0) < time) {
          bo.reflectCd = time + 0.06;
          const a = Math.atan2(-b.vy, -b.vx) + (Math.random() - 0.5) * 0.3;
          eBullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * HALO_REFLECT_SPEED, vy: Math.sin(a) * HALO_REFLECT_SPEED, r: 5, color: '#ffffff', src: bo });
        }
        if (Math.random() < 0.3) burst(b.x, b.y, '#ffffff', 3, 120);
        continue;
      }
      if (hitsWyrmBody(bo, b)) { b.dead = true; hitBoss(bo, b.dmg * s.bossDmg * bondMult(bo, b.owner) * 0.6); if (Math.random() < 0.3) burst(b.x, b.y, '#ffd0a0', 3, 120); continue; } // body: 60%
      if (distToSeg(bo.x, bo.y, b.px, b.py, b.x, b.y) >= bo.r + b.size) continue;
      b.dead = true; hitBoss(bo, b.dmg * s.bossDmg * bondMult(bo, b.owner), b.x, b.y);
      if ((b.missile || s.explosive) && bossFx.rings.length < 40) fxRing(b.x, b.y, 4, 30, 0.2, '#ffb13d', 2);
      if (Math.random() < 0.3) burst(b.x, b.y, bo.color, 3, 120);
      if (bossAlive(bo) && Math.random() < 0.15) beep(1200, 0.02, 'square', 0.01);
    }
  }
  updateBlades();
  for (const bo of bosses) {
    if (!bossAlive(bo)) continue;
    for (const p of living()) if (Math.hypot(p.x - bo.x, p.y - bo.y) < bo.r + p.r * 0.7 && hurt(p)) leech(bo, p);
  }
  if (state !== 'play') return;

  const shrapnel = [], flow = s.chrono * timeFlow(); // (Chrono Field slows enemy fire; CHRONOS can stop it)
  const ice = enemies.filter(e => e.type === 'ice' && !e.dead); // (FROZEN RINGS: ice chunks are cover)
  for (const b of eBullets) {
    for (const c of ice) if (!b.dead && Math.hypot(b.x - c.x, b.y - c.y) < c.r + (b.r || 5)) { b.dead = true; chipIce(c); }
    if (!b.orb) { b.x += b.vx * dt * flow; b.y += b.vy * dt * flow; } // (orbiting bullets are moved by THE SINGULARITY)
    if (b.fuse !== undefined) { // boss mine: slows down, then bursts into a ring
      if (flow) { b.vx *= 0.97; b.vy *= 0.97; b.fuse -= dt; }
      if (b.fuse <= 0 && !b.dead) {
        b.dead = true; burst(b.x, b.y, b.color, 20, 200); beep(180, 0.15, 'square', 0.04, -100);
        for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; shrapnel.push({ x: b.x, y: b.y, vx: Math.cos(a) * 180, vy: Math.sin(a) * 180, r: 5, color: b.color }); }
      }
    }
    for (const p of living()) if (!b.dead && Math.hypot(b.x - p.x, b.y - p.y) < p.r * 0.7 + (b.r || 5)) { b.dead = true; if (hurt(p) && b.src) leech(b.src, p); }
  }
  eBullets.push(...shrapnel);
  if (state !== 'play') return;

  for (const l of lasers) {
    if (l.warn > 0) { l.warn -= dt; if (l.warn <= 0) { beep(150, 0.4, 'sawtooth', 0.06, -60); shake = Math.max(shake, 6); } }
    else { l.fire -= dt; for (const p of living()) if (Math.abs(p.x - l.x) < l.w / 2 + p.r * 0.5) hurt(p); }
  }
  lasers = lasers.filter(l => l.warn > 0 || l.fire > 0);
  if (state !== 'play') return;
  eBullets = eBullets.filter(b => !b.dead && b.y < H + 20 && b.y > -20 && b.x > -20 && b.x < W + 20);

  for (const e of enemies) {
    if (e.dead) continue;
    // Cryo Rounds: frozen enemies move, turn and shoot slower
    e.slow = Math.max(0, (e.slow || 0) - dt);
    const edt = (e.slow > 0 ? dt * (s.cryo >= 2 ? 0.4 : 0.55) : dt) * (e.elite === 'swift' ? 1.6 : 1); // (swift elites do everything faster)
    if (e.elite === 'regen' && e.hp < e.maxHp) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.1 * dt);
    e.t += edt; e.spin += edt * 2; e.flash = Math.max(0, e.flash - dt);
    e.healFx = Math.max(0, (e.healFx || 0) - dt); e.guardedT = Math.max(0, (e.guardedT || 0) - dt);
    e.x += e.vx * edt; e.y += e.vy * edt;
    ENEMY_AI[e.type]?.(e, edt);
    for (const b of bullets) {
      if (b.dead || e.dead || TYPES[e.type].ghost || b.hits.includes(e) || distToSeg(e.x, e.y, b.px ?? b.x, b.py ?? b.y, b.x, b.y) >= e.r + 4 + b.size) continue;
      if (e.type === 'bulwark' && Math.abs(angleDiff(Math.atan2((b.py ?? b.y) - e.y, (b.px ?? b.x) - e.x), e.aimA)) < BULWARK_ARC) {
        b.dead = true; e.shieldHit = 0.1; if (Math.random() < 0.4) burst(b.x, b.y, '#dfe8ff', 3, 120); continue; // blocked by its shield
      }
      if (b.pierce > 0) { b.pierce--; b.hits.push(e); } else b.dead = true;
      if (b.crit) burst(b.x, b.y, '#ffffff', 6, 150);
      e.lastBy = b.owner; // (whose kill effect to show)
      damageEnemy(e, b.dmg, b.missile ? 'missile' : 'bullet');
      // missiles always explode; Explosive Rounds make every hit explode
      if (b.missile) splash(b.x, b.y, s.inferno ? 90 : 45, b.dmg * 0.6, e);
      else if (s.explosive) splash(b.x, b.y, 30 + s.explosive * 15, b.dmg * 0.5, e);
    }
    if (!TYPES[e.type].harmless) for (const p of living()) {
      if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r * 0.7) {
        if (p.inv <= 0 && !(p.phaseOn > 0)) { e.dead = true; burst(e.x, e.y, e.color, 25); }
        hurt(p);
      }
    }
    if (state !== 'play') return;
  }
  enemies = enemies.filter(e => !e.dead && e.y < H + 60 && e.y > -200 && e.x > -120 && e.x < W + 120);
  bullets = bullets.filter(b => !b.dead && b.y > -40 && b.y < H + 40 && b.x > -40 && b.x < W + 40);

  // hands-on revive: hover near a downed teammate's wreck to bring them back
  for (const p of players) {
    if (p.alive || !p.wreck) continue;
    const helper = living().find(q => Math.hypot(q.x - p.wreck.x, q.y - p.wreck.y) < REVIVE_RANGE);
    if (helper) {
      const before = p.reviveProg;
      p.reviveProg += dt * (helper.ship.mod.reviveSpeed || 1) * (1 + 0.25 * metaLv('medkit')); // Medics (and Field Medic) revive faster
      if (Math.floor(before * 4) !== Math.floor(p.reviveProg * 4)) beep(400 + p.reviveProg * 200, 0.08, 'triangle', 0.04);
      if (Math.random() < dt * 30) particles.push({ x: helper.x, y: helper.y, vx: (p.wreck.x - helper.x) * 3, vy: (p.wreck.y - helper.y) * 3, life: 0.3, max: 0.3, color: helper.color, size: 3 });
      if (p.reviveProg >= REVIVE_TIME) revive(p, helper, true);
    } else p.reviveProg = Math.max(0, p.reviveProg - dt * 0.5);
  }

  comboT -= dt; if (comboT <= 0) combo = 1;

  for (const k of pickups) {
    k.t += dt; k.y += 90 * dt;
    {
      const p = nearestPlayer(k.x, k.y), mag = p ? s.magnet + (p.ship.mod.magnet || 0) : 0; // Medics have a built-in magnet
      if (mag) {
        const d = Math.hypot(p.x - k.x, p.y - k.y);
        if (d < 140 * mag && d > 1) { k.x += (p.x - k.x) / d * 380 * dt; k.y += (p.y - k.y) / d * 380 * dt; }
      }
    }
    for (const p of living()) {
      if (k.dead || Math.hypot(k.x - p.x, k.y - p.y) >= p.r + 14) continue;
      k.dead = true; beep(660, 0.25, 'triangle', 0.08, 660);
      burst(k.x, k.y, '#ffffff', 15, 150);
      if (k.kind === 'power') p.power = s.powerDur;
      if (k.kind === 'shield') p.shield = 1;
      if (k.kind === 'life') {
        // a life pickup revives a downed teammate first
        const down = players.find(q => !q.alive);
        if (down) revive(down, p, true);
        else if (p.lives < maxLivesOf(p)) p.lives++;
        else addScore(500 * combo);
      }
    }
  }
  pickups = pickups.filter(k => !k.dead && k.y < H + 30);

  updateParticles(dt);
}

function updateParticles(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt * 40);
  updateBossFx(dt);
}

// ---------- draw helpers ----------
// soft neon glow (the most expensive thing to draw: PERFORMANCE MODE turns it off)
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = settings.lowfx ? 0 : blur; }

// Canvas shadowBlur is slow when used on hundreds of things per frame, so bullets and particles
// fake their glow with soft halo circles instead, batched into one path per color per layer.
function hexA(hex, a) {
  if (hex.length === 4) hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function circlePath(list, k) {
  ctx.beginPath();
  for (const it of list) { const r = it.r * k; ctx.moveTo(it.x + r, it.y); ctx.arc(it.x, it.y, r, 0, Math.PI * 2); }
}
// items: [{ x, y, r, color }] — r is the solid core radius
function drawGlowDots(items, whiteCore = true) {
  if (!items.length) return;
  const byColor = new Map();
  for (const it of items) { let l = byColor.get(it.color); if (!l) byColor.set(it.color, l = []); l.push(it); }
  ctx.save();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;

  for (const [col, list] of byColor) {
    ctx.fillStyle = hexA(col, 0.14); circlePath(list, 2.6); ctx.fill();
    ctx.fillStyle = hexA(col, 0.28); circlePath(list, 1.6); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const [col, list] of byColor) { ctx.fillStyle = col; circlePath(list, 1); ctx.fill(); }
  if (whiteCore) { ctx.fillStyle = '#ffffff'; circlePath(items, 0.45); ctx.fill(); }
  ctx.restore();
}

function polygon(sides, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) { const a = rot + i / sides * Math.PI * 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath();
}

function wrap(text, maxW) {
  const lines = []; let line = '';
  for (const w of text.split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

// shrink a line of text until it fits the screen width
function fitText(text, y, size, color, weight = '') {
  ctx.fillStyle = color;
  do { ctx.font = `${weight} ${size}px system-ui`; size--; } while (size > 8 && ctx.measureText(text).width > W - 32);
  ctx.fillText(text, W / 2, y);
}

function panel(x, y, w, h, color, selected) {
  ctx.save();
  ctx.fillStyle = selected ? 'rgba(25,30,60,0.95)' : 'rgba(10,12,28,0.9)';
  ctx.strokeStyle = color; ctx.lineWidth = selected ? 3 : 1.5;
  if (selected) glow(color, 25);
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function button(label, x, y, w, h, color, action) {
  const i = buttons.length;
  buttons.push({ x, y, w, h, action });
  const on = sel === i;
  panel(x, y, w, h, color, on);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = on ? '#fff' : color;
  let size = 16; // shrink the label to fit narrow buttons
  do { ctx.font = `bold ${size}px system-ui`; size--; } while (size > 9 && ctx.measureText(label).width > w - 12);
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
}

// ---------- draw: world ----------

// mk2: the upgraded MK II model — a bit bigger, gold trim, glowing wingtip pods and hotter engines
function drawHull(shape, color, thrust = 0, mk2 = false, skin) {
  const h = HULLS[shape] || HULLS.striker, GOLD = '#ffe93d';
  ctx.save();
  if (mk2) ctx.scale(1.12, 1.12);
  glow('#ff9d3d', 20); ctx.fillStyle = '#ff9d3d';
  for (const [fx, fy, w] of h.flames) {
    const f = 10 + Math.random() * 8 + thrust * 12 + (mk2 ? 6 : 0);
    ctx.beginPath(); ctx.moveTo(fx - w, fy); ctx.lineTo(fx, fy + f); ctx.lineTo(fx + w, fy); ctx.fill();
    if (mk2) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(fx - w * 0.4, fy); ctx.lineTo(fx, fy + f * 0.55); ctx.lineTo(fx + w * 0.4, fy); ctx.fill(); ctx.fillStyle = '#ff9d3d'; }
  }
  if (mk2) { // glowing pods on the wingtips
    const tip = h.pts.reduce((a, b) => Math.abs(b[0]) > Math.abs(a[0]) ? b : a);
    glow(GOLD, 14); ctx.fillStyle = GOLD;

      ctx.beginPath(); ctx.moveTo(x, y - 5); ctx.lineTo(x + 3, y); ctx.lineTo(x, y + 5); ctx.lineTo(x - 3, y); ctx.closePath(); ctx.fill();

    const j = 2 + (Math.random() < 0.08 ? 5 : 0);
    ctx.shadowBlur = 0; ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(0,255,255,0.7)'; hullPath(1, -j, 0); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,0,255,0.7)'; hullPath(1, j, 1); ctx.stroke();
  }

  ctx.strokeStyle = sk === 'skin_stealth' ? hexA(color, 0.55) : rim; ctx.lineWidth = sk === 'skin_stealth' ? 1.5 : 2.5;

  }

    if (mk2) { ctx.globalAlpha /= 0.7; ctx.fillStyle = '#fff'; ctx.strokeStyle = GOLD; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.stroke(); }

    ctx.beginPath(); ctx.ellipse(0, -2, 5, 3.2 * ((t % 3) < 0.1 ? 0.15 : 1), 0, 0, Math.PI * 2); ctx.fill();

}

function drawShip(p) {

      for (let k = -1; k <= 1; k++) ctx.fillRect(k * r * 0.5 - 3, r * 0.3, 6, 5);
      break;
    case 'seeker': // engine glow
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -r * 0.45, 2.5 + Math.random() * 1.5, 0, Math.PI * 2); ctx.fill();
      break;
  }
  ctx.restore();
  // health bar for tougher enemies once they've been hit
  if (e.maxHp >= 3 && e.hp < e.maxHp && e.hp > 0) {
    const w = Math.max(24, r * 2), x = e.x - w / 2, y = e.y - r - (e.type === 'dasher' ? 16 : 10);
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(x, y, w, 3);
    ctx.fillStyle = e.color; ctx.fillRect(x, y, w * e.hp / e.maxHp, 3);
  }
  if (e.elite) { // its title, above the health bar
    const el = ELITES[e.elite];
    ctx.save(); ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = el.color;
    ctx.fillText('★ ' + el.name, e.x, e.y - e.r * 1.45 - 6); ctx.restore();

}

// warnings drawn beneath enemies: aim lines and heal pulses
function drawEnemyTelegraph(e) {
  if (e.type === 'puddle') { // a toxic puddle (dashed while it's still settling)
    const pr = puddleR(e), settled = PUDDLE_LIFE - e.timer > 0.35;
    ctx.save(); ctx.fillStyle = hexA(e.color, settled ? 0.3 : 0.12); ctx.strokeStyle = hexA(e.color, 0.7); ctx.lineWidth = 1.5;
    if (!settled) ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.ellipse(e.x, e.y, pr * 1.1, pr * 0.85, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  if (e.type === 'meteor' && e.state === 'warn') { // incoming meteor: its lane lights up and arrows flash at the side it comes from
    const blink = Math.floor(time * 10) % 2, hw = e.r + 4, c = e.color;
    ctx.save(); ctx.fillStyle = hexA(c, 0.06 + (1 - e.timer / METEOR_WARN) * 0.12); ctx.fillRect(0, e.y - hw, W, hw * 2);
    ctx.strokeStyle = c; ctx.globalAlpha = 0.55; ctx.setLineDash([12, 10]); ctx.lineDashOffset = -time * 80 * e.side; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, e.y - hw); ctx.lineTo(W, e.y - hw); ctx.moveTo(0, e.y + hw); ctx.lineTo(W, e.y + hw); ctx.stroke(); ctx.setLineDash([]);
    if (blink) {
      ctx.globalAlpha = 1; ctx.fillStyle = c; const sx = e.side > 0 ? 6 : W - 6;
      for (let k = 0; k < 2; k++) { const ax = sx + e.side * k * 12; ctx.beginPath(); ctx.moveTo(ax + e.side * 10, e.y); ctx.lineTo(ax, e.y - 8); ctx.lineTo(ax, e.y + 8); ctx.fill(); }
      ctx.font = 'bold 11px system-ui'; ctx.textAlign = e.side > 0 ? 'left' : 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('METEOR!', e.side > 0 ? 6 : W - 6, e.y - hw - 2);
    }
    ctx.restore();
  }
  if (e.type === 'bolt') { // ion storm: a pink circle of charge closes in, then the bolt lands
    const c = e.color;
    ctx.save();
    if (e.state === 'warn') {
      const k = Math.max(0, Math.min(1, 1 - e.timer / BOLT_WARN));
      ctx.globalAlpha = 0.35 + k * 0.5; ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.lineDashOffset = time * 30;
      ctx.beginPath(); ctx.arc(e.x, e.y, BOLT_R * (1.6 - k * 0.6), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = 0.07 + k * 0.16; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(e.x, e.y, BOLT_R, 0, Math.PI * 2); ctx.fill();
      if (Math.random() < 0.25 + k * 0.5) { // sparks crawling over the circle
        const a = Math.random() * Math.PI * 2; ctx.globalAlpha = 0.8; ctx.strokeStyle = '#ffd0f0'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(e.x + Math.cos(a) * BOLT_R * 0.3, e.y + Math.sin(a) * BOLT_R * 0.3); ctx.lineTo(e.x + Math.cos(a + 0.5) * BOLT_R * 0.7, e.y + Math.sin(a + 0.5) * BOLT_R * 0.7); ctx.stroke();
      }
    } else { // the strike: a jagged bolt from the top of the screen
      glow(c, 40); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5; ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.moveTo(e.x + (Math.random() - 0.5) * 40, 0);
      for (let i = 1; i < 12; i++) ctx.lineTo(e.x + (Math.random() - 0.5) * 50 * (1 - i / 12), e.y * i / 12);
      ctx.lineTo(e.x, e.y); ctx.stroke();
      ctx.globalAlpha = 0.5; ctx.fillStyle = '#ffd0f0'; ctx.beginPath(); ctx.arc(e.x, e.y, BOLT_R, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  if (e.type === 'firework' && e.state === 'warn' && Math.floor(time * 10) % 2) { // it's coming from below!
    ctx.save(); ctx.fillStyle = e.color; ctx.beginPath(); ctx.moveTo(e.x, H - 30); ctx.lineTo(e.x - 9, H - 14); ctx.lineTo(e.x + 9, H - 14); ctx.fill();
    ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center'; ctx.fillText('!', e.x, H - 38); ctx.restore();
  }
  if (e.type === 'magnet') { // its pull range
    ctx.save(); ctx.strokeStyle = e.color; ctx.globalAlpha = 0.12; ctx.setLineDash([2, 9]); ctx.lineDashOffset = time * 30;
    ctx.beginPath(); ctx.arc(e.x, e.y, MAGNET_R, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  if (e.type === 'shell') { // where a mortar shell will land: a shrinking circle, and the shell dropping onto it
    const k = Math.max(0, Math.min(1, 1 - e.timer / 1.3));
    ctx.save(); ctx.strokeStyle = e.color; ctx.lineWidth = 2; ctx.globalAlpha = 0.5 + k * 0.5;
    ctx.beginPath(); ctx.arc(e.x, e.y, SHELL_R * (1.3 - k * 0.3), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.1 + k * 0.2; ctx.fillStyle = e.color; ctx.fill();
    ctx.globalAlpha = 1; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(e.x - 8, e.y); ctx.lineTo(e.x + 8, e.y); ctx.moveTo(e.x, e.y - 8); ctx.lineTo(e.x, e.y + 8); ctx.stroke();
    glow(e.color, 12); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(e.x, e.y - (1 - k) * 220, 5, 0, Math.PI * 2); ctx.fill();

  }

    ctx.save(); ctx.strokeStyle = e.color; ctx.lineWidth = 2; glow(e.color, 10); ctx.beginPath(); ctx.moveTo(e.x, e.y);
    for (let i = 1; i < 4; i++) ctx.lineTo(e.x + (e.dest.x - e.x) * i / 4 + (Math.random() - 0.5) * 8, e.y + (e.dest.y - e.y) * i / 4);
    ctx.lineTo(e.dest.x, e.dest.y); ctx.stroke(); ctx.restore();
  }
  if (e.type === 'vortex') { // the pull zone
    ctx.save(); ctx.strokeStyle = e.color; ctx.globalAlpha = 0.18; ctx.lineWidth = 1.5; ctx.setLineDash([3, 7]); ctx.lineDashOffset = time * 40;
    ctx.beginPath(); ctx.arc(e.x, e.y, VORTEX_R, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  if (e.type === 'bulwark') { // its shield: a thick arc facing its aim (bullets from that side bounce off)
    ctx.save(); glow('#dfe8ff', 14); ctx.strokeStyle = (e.shieldHit || 0) > 0 ? '#ffffff' : '#bcd0ff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.4, e.aimA - BULWARK_ARC, e.aimA + BULWARK_ARC); ctx.stroke(); ctx.restore();
    e.shieldHit = Math.max(0, (e.shieldHit || 0) - 1 / 60);
  }

    if (e.state === 'aim') {
      ctx.strokeStyle = e.color; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]); ctx.globalAlpha = 0.3 + (e.timer < 0.35 ? 0.5 * (Math.floor(time * 20) % 2) : 0.2);
      ctx.beginPath(); ctx.moveTo(e.x, e.y + e.r); ctx.lineTo(e.x, H); ctx.stroke();
    } else {
      glow(e.color, 30); ctx.fillStyle = e.color; ctx.globalAlpha = 0.85; ctx.fillRect(e.x - 8, e.y, 16, H - e.y);
      ctx.fillStyle = '#fff'; ctx.fillRect(e.x - 3, e.y, 6, H - e.y);
    }
    ctx.restore();
  }
  if (e.type === 'linker' && e.dest) { // the beam between the pair (thin and dashed while warming up)
    const live = e.t > LINK_WARM;
    ctx.save(); ctx.strokeStyle = e.color; ctx.lineCap = 'round';
    if (live) { glow(e.color, 18); ctx.lineWidth = 4 + Math.sin(time * 30) * 1.5; ctx.globalAlpha = 0.85; }
    else { ctx.lineWidth = 1.5; ctx.setLineDash([5, 6]); ctx.globalAlpha = 0.5; }
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.dest.x, e.dest.y); ctx.stroke(); ctx.restore();
  }
  if (e.elite) { // a spinning aura in its power's color
    const c = ELITES[e.elite].color;
    ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.globalAlpha = 0.75; ctx.setLineDash([6, 5]); ctx.lineDashOffset = -time * 40;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.45, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 0.12 + Math.sin(time * 6) * 0.05; ctx.fillStyle = c; ctx.fill(); ctx.restore();
  }
  if (e.type === 'pylon') { // energy chain feeding the Warden's shield
    const b = ownerOf(e, 'pylons');
    if (b) {
      ctx.save(); ctx.strokeStyle = e.color; ctx.lineWidth = 2; ctx.globalAlpha = 0.45 + Math.sin(time * 10 + e.id) * 0.2;
      ctx.setLineDash([8, 6]); ctx.lineDashOffset = -time * 60;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.restore();
    }
  }
  if (e.type === 'orbiter') { // the three orbiting balls (these hurt!)
    ctx.save(); ctx.shadowBlur = 0; ctx.strokeStyle = hexA(e.color, 0.15); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(e.x, e.y, 36, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    drawGlowDots([0, 1, 2].map(k => ({ ...orbiterBall(e, k), r: 6, color: e.color })));
  }

    const k = 1 - e.timer / 0.65;
    ctx.save(); ctx.strokeStyle = e.color; ctx.lineWidth = 2; ctx.globalAlpha = 0.4 + k * 0.5;
    ctx.beginPath(); ctx.arc(e.dest.x, e.dest.y, 26 - k * 14, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([3, 5]); ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.dest.x, e.dest.y); ctx.stroke();
    ctx.restore();
  }
  if (e.type === 'guardian') { // shield links to everything it protects
    ctx.save(); ctx.shadowBlur = 0; ctx.strokeStyle = e.color;
    ctx.globalAlpha = 0.1; ctx.setLineDash([2, 8]); ctx.beginPath(); ctx.arc(e.x, e.y, GUARD_RANGE, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 0.35; ctx.lineWidth = 1.5;
    for (const o of enemies) if (o.guardedT > 0 && Math.hypot(o.x - e.x, o.y - e.y) < GUARD_RANGE) {
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(o.x, o.y); ctx.stroke();
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r + 6, 0, Math.PI * 2); ctx.stroke();

  }
  if (e.type === 'dasher' && e.state === 'aim') {
    ctx.save(); ctx.shadowBlur = 0;
    ctx.globalAlpha = e.timer < 0.25 ? 0.8 : 0.35; ctx.strokeStyle = e.color; ctx.lineWidth = e.timer < 0.25 ? 3 : 1.5;
    ctx.setLineDash([8, 8]);

    ctx.restore();

    ctx.globalAlpha = locked ? (Math.floor(e.fire * 30) % 2 ? 0.9 : 0.4) : 0.3;
    ctx.strokeStyle = e.color; ctx.lineWidth = locked ? 2.5 : 1;
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(e.aimA) * 1400, e.y + Math.sin(e.aimA) * 1400); ctx.stroke();
    ctx.restore();

    ctx.save(); ctx.shadowBlur = 0; ctx.strokeStyle = e.color;
    ctx.globalAlpha = 0.12; ctx.setLineDash([4, 8]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(e.x, e.y, 150, 0, Math.PI * 2); ctx.stroke();
    if (e.pulse > 0) {
      ctx.setLineDash([]); ctx.globalAlpha = e.pulse * 0.7; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, 150 * (1 - e.pulse) + 10, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
}

// links between team bosses, drawn underneath them
function drawEncounterFx() {
  if (!encounter || bosses.length < 2) return;
  const t = performance.now() / 1000;
  ctx.save(); ctx.lineCap = 'round';
  if (encounter.kind === 'binary' && encounter.tether > 0) {
    const [a, b] = bosses, live = encounter.tether >= 1.5;
    if (!live) { // warming up: a thin flickering line so you can see where it will be
      ctx.globalAlpha = 0.3 + (Math.floor(t * 12) % 2) * 0.3; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    } else { // a crackling beam, orange at Sol's end fading to blue at Luna's
      const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      g.addColorStop(0, a.color); g.addColorStop(1, b.color);
      glow('#ffffff', 25); ctx.strokeStyle = g; ctx.lineWidth = 12 + Math.sin(t * 30) * 2; ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.moveTo(a.x, a.y);
      for (let i = 1; i < 10; i++) {
        const k = i / 10;
        ctx.lineTo(a.x + (b.x - a.x) * k + (Math.random() - 0.5) * 6, a.y + (b.y - a.y) * k + (Math.random() - 0.5) * 6);
      }
      ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }
  if (encounter.kind === 'aegis') { // Aegis feeds its shield to Blade along a flowing beam
    const [shielder, striker] = bosses;
    if (striker && striker.shielded && bossAlive(shielder)) {
      ctx.strokeStyle = '#5dff7a'; ctx.lineWidth = 3; ctx.globalAlpha = 0.6; glow('#5dff7a', 15);
      ctx.setLineDash([12, 10]); ctx.lineDashOffset = -t * 60;
      ctx.beginPath(); ctx.moveTo(shielder.x, shielder.y); ctx.lineTo(striker.x, striker.y); ctx.stroke();
    }
  }
  if (encounter.kind === 'quartet') { // each boss is linked to its partner player
    ctx.lineWidth = 1.5; ctx.setLineDash([3, 9]); ctx.lineDashOffset = -t * 30;
    for (const b of bosses) {
      const p = players[b.bond];
      if (!bossAlive(b) || !p) continue;
      ctx.globalAlpha = p.alive ? 0.22 : 0.08; ctx.strokeStyle = b.color;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(p.alive ? p.x : p.wreck?.x ?? p.x, p.alive ? p.y : p.wreck?.y ?? p.y); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.fillStyle = b.color; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(`P${b.bond + 1}`, b.x, b.y + b.r + 14);
      ctx.setLineDash([3, 9]);
    }
  }
  if (encounter.kind === 'triad') { // faint resonance lines between surviving members
    const alive = bosses.filter(bossAlive);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.18 + Math.sin(t * 3) * 0.08; ctx.setLineDash([4, 10]);
    ctx.beginPath();
    alive.forEach((b, i) => { const n = alive[(i + 1) % alive.length]; if (alive.length > 1) { ctx.moveTo(b.x, b.y); ctx.lineTo(n.x, n.y); } });
    ctx.stroke();
  }
  ctx.restore();
}

// a fallen Gemini twin: a flickering, cracked shell with its revive countdown
function drawDownedTwin(b) {
  const t = performance.now() / 1000, p = b.reviveT / TWIN_REVIVE();
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.globalAlpha = 0.3 + Math.sin(t * (6 + (1 - p) * 20)) * 0.15; // flickers faster as it's about to return
  ctx.strokeStyle = b.color; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
  polygon(b.sides, b.r, b.spin); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.lineWidth = 5; glow('#ff5a70', 15); ctx.strokeStyle = '#ff5a70';
  ctx.beginPath(); ctx.arc(0, 0, b.r + 12, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 26px system-ui'; ctx.fillText(Math.ceil(b.reviveT), 0, 0);
  ctx.restore();
}

// ----- THE ABYSS -----
// overall scale: warp-in, slow breathing, recoil, flinch, phase-change throb, death shrink
function abyssScale(b) {
  let sc = 1 + Math.sin(b.t * 1.4) * 0.035 + b.kick * 0.08 - b.hitKick * 0.04;
  if (!b.entered) sc *= 0.3 + 0.7 * easeOut(b.intro);
  if (b.rage > 0) sc *= 1 + Math.sin(b.rage * 30) * 0.06;
  if (b.dying > 0) sc *= 1 - (1 - b.dying / DEATH_TIME) * 0.35;
  return sc;
}
// the body's ragged outline: a lumpy, slowly heaving mass
function abyssBlob(b, r, t) {
  ctx.beginPath();
  for (let i = 0; i <= 48; i++) {
    const a = i / 48 * Math.PI * 2;
    const rr = r * (1 + Math.sin(a * 5 + t * 1.7) * 0.06 + Math.sin(a * 9 - t * 2.3) * 0.04 + Math.sin(a * 3 - t * 0.8) * 0.05);
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
}
// eyes all over its body: a few at first, more open each phase; they all stare at you
const ABYSS_EYES = [[-0.55, -0.45, 0.13], [0.55, -0.45, 0.13], [-0.68, 0.08, 0.1], [0.68, 0.08, 0.1],
  [-0.38, 0.55, 0.09], [0.38, 0.55, 0.09], [0, -0.72, 0.1], [-0.2, -0.62, 0.07], [0.2, -0.62, 0.07]];
function drawAbyssEyes(b) {
  const t = b.t, sc = abyssScale(b), r = b.r, deathP = b.dying > 0 ? 1 - b.dying / DEATH_TIME : 0;
  const open = b.dying > 0 ? Math.max(0, 1 - deathP * 1.5) : b.entered ? 1 : b.intro;
  const small = b.phase >= 3 ? ABYSS_EYES.length : b.phase >= 2 ? 6 : 2;
  ctx.save(); ctx.translate(b.x, b.y); ctx.scale(sc, sc);
  const eye = (x, y, rad, k, main) => {
    const blink = (t * (0.4 + k * 0.07) + k * 0.37) % 4 < 0.12 ? 0.08 : 1;
    const h = rad * 0.62 * open * blink * (main && b.rage > 0 ? 1.3 : 1);
    if (h < 0.5) return;
    glow(b.color, main ? 40 : 18); ctx.fillStyle = b.flash > 0 ? '#ffffff' : main ? '#ff2a3a' : '#d0102a';
    ctx.beginPath(); ctx.ellipse(x, y, rad, h, 0, 0, Math.PI * 2); ctx.fill();

    // a glowing ring, then a black slit pupil that follows you
    ctx.shadowBlur = 0; ctx.fillStyle = '#ffb3a0';
    ctx.beginPath(); ctx.ellipse(x + b.look.x * rad * 0.3, y + b.look.y * h * 0.3, rad * 0.45, Math.min(h, rad * 0.45), 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(x + b.look.x * rad * 0.35, y + b.look.y * h * 0.35, rad * (main ? 0.1 : 0.14), Math.min(h * 0.9, rad * 0.5), 0, 0, Math.PI * 2); ctx.fill();
  };
  ABYSS_EYES.slice(0, small).forEach(([ex, ey, er], k) => eye(ex * r, ey * r, er * r, k + 1, false));
  eye(0, -r * 0.08, r * 0.36, 0, true);
  // the maw: a ragged mouth of teeth tearing open beneath the great eye
  const mawOpen = b.maw > 0 || b.mawN > 0 ? Math.min(1, b.mawN > 0 && b.maw <= 0.32 ? 1 : 1.1 - b.maw) : 0;
  if (mawOpen > 0) {
    const mw = r * 0.55, mh = r * 0.3 * mawOpen, my = r * 0.42;
    glow(b.color, 30); ctx.fillStyle = '#000'; ctx.strokeStyle = b.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, my, mw, mh, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffe8e0'; ctx.shadowBlur = 0;
    for (let i = 0; i < 9; i++) { // fangs, top and bottom
      const x = -mw * 0.85 + i / 8 * mw * 1.7, tw = mw * 0.09;
      ctx.beginPath(); ctx.moveTo(x - tw, my - mh * 0.9); ctx.lineTo(x + tw, my - mh * 0.9); ctx.lineTo(x, my - mh * 0.9 + mh * 0.75); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - tw, my + mh * 0.9); ctx.lineTo(x + tw, my + mh * 0.9); ctx.lineTo(x, my + mh * 0.9 - mh * 0.75); ctx.fill();

      for (let i = 0; i < 6; i++) {
        const a = t * 0.4 + i / 6 * Math.PI * 2, s = 9 + Math.sin(t * 3 * busy + i) * 3;
        ctx.save(); ctx.translate(Math.cos(a) * r * 1.5, Math.sin(a) * r * 1.5);
        polygon(6, s, 0); ctx.stroke();
        ctx.globalAlpha *= 0.4; ctx.fill();
        ctx.restore();
      }
      break;
    }
    case 'phantom': // wobbling echo outlines
      if (layer !== 'back') break;
      ctx.lineWidth = 1.5;
      for (let i = 1; i <= 2; i++) {
        ctx.save(); ctx.globalAlpha *= 0.3 / i;
        ctx.translate(Math.sin(t * 2 + i) * 12 * i, Math.cos(t * 1.7 + i) * 8 * i);
        polygon(b.sides, r * (1 + i * 0.12), -b.spin + i); ctx.stroke();
        ctx.restore();
      }
      break;
    case 'architect': // blueprint lines and a turning gear
      if (layer === 'back') {
        ctx.lineWidth = 1; ctx.globalAlpha *= 0.5; ctx.setLineDash([4, 5]);
        ctx.strokeRect(-r * 1.6, -r * 1.6, r * 3.2, r * 3.2); ctx.beginPath(); ctx.moveTo(-r * 1.9, 0); ctx.lineTo(r * 1.9, 0); ctx.moveTo(0, -r * 1.9); ctx.lineTo(0, r * 1.9); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha /= 0.5;
      } else for (const [gx, gy, gr, dir] of [[-r * 1.15, -r * 1.15, r * 0.32, 1], [r * 1.15, r * 1.15, r * 0.32, -1]]) {
        ctx.save(); ctx.translate(gx, gy); ctx.rotate(t * 2 * dir * fast); ctx.lineWidth = 2; ctx.beginPath();
        for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, rr = i % 2 ? gr : gr * 1.35; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        ctx.closePath(); ctx.stroke(); ctx.restore();
      }
      break;
    case 'oracle': // a ring of runes and watching eyes
      if (layer === 'back') {
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2 + t * 0.3, r1 = r * 1.5; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.lineTo(Math.cos(a) * (r1 + (i % 3 ? 5 : 12)), Math.sin(a) * (r1 + (i % 3 ? 5 : 12))); ctx.stroke(); }
      } else for (let i = 0; i < 6; i++) {
        const a = i / 6 * Math.PI * 2 - t * 0.5, x = Math.cos(a) * r * 1.9, y = Math.sin(a) * r * 1.9;
        ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, 6, 3.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x + b.look.x * 2, y + b.look.y * 1.2, 1.6, 0, Math.PI * 2); ctx.fill();
      }
      break;
    case 'singularity': // a tilted accretion disk spinning around the black core
      ctx.save(); ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = (layer === 'back' ? 0.35 : 0.7) - i * 0.12;
        ctx.beginPath(); ctx.ellipse(0, 0, r * (1.6 + i * 0.35), r * (0.45 + i * 0.1), -0.35, layer === 'back' ? Math.PI : 0, layer === 'back' ? Math.PI * 2 : Math.PI); ctx.stroke();
      }
      ctx.restore();
      if (layer === 'front') { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2); ctx.fill(); }
      break;
    case 'chronos': // a clock face: 12 ticks and two hands (which stop when time does)
      if (layer === 'back') {
        ctx.lineWidth = 2;
        for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, r1 = r * (i % 3 ? 1.5 : 1.42); ctx.beginPath(); ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.lineTo(Math.cos(a) * r * 1.62, Math.sin(a) * r * 1.62); ctx.stroke(); }
      } else {
        const tt = b.stop > 0 ? b._frozenT ??= t : (b._frozenT = undefined, t);
        ctx.lineCap = 'round'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(tt * 0.5 - Math.PI / 2) * r * 0.7, Math.sin(tt * 0.5 - Math.PI / 2) * r * 0.7); ctx.stroke();
        ctx.lineWidth = 2.5; ctx.strokeStyle = c;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(tt * 3 * fast - Math.PI / 2) * r * 1.3, Math.sin(tt * 3 * fast - Math.PI / 2) * r * 1.3); ctx.stroke();
        ctx.lineCap = 'butt';
        if (b.stopW > 0) { ctx.globalAlpha *= 0.5 + Math.sin(t * 30) * 0.5; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r * 1.75, 0, Math.PI * 2); ctx.stroke(); }
      }
      break;
    case 'zero': { // glitching: offset cyan/magenta copies of its outline, plus orbiting cube fragments
      const j = (enraged ? 5 : 3) + (Math.random() < 0.08 ? 12 : 0);
      if (layer === 'back') {
        ctx.save(); ctx.lineWidth = 2; ctx.globalAlpha *= 0.65;
        ctx.strokeStyle = '#00ffff'; ctx.translate(-j, (Math.random() - 0.5) * j); polygon(b.sides, r * 1.08, b.spin); ctx.stroke();
        ctx.strokeStyle = '#ff00ff'; ctx.translate(j * 2, (Math.random() - 0.5) * j); polygon(b.sides, r * 1.08, b.spin); ctx.stroke();
        ctx.restore();
      } else {
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const a = t * 0.8 * fast + i / 6 * Math.PI * 2, d = r * (1.7 + Math.sin(t * 3 + i) * 0.15);
          ctx.save(); ctx.translate(Math.cos(a) * d, Math.sin(a) * d); ctx.rotate(t * 2 + i);
          ctx.strokeStyle = i % 3 === 0 ? '#00ffff' : i % 3 === 1 ? '#ff00ff' : c; ctx.strokeRect(-6, -6, 12, 12); ctx.restore();
        }
      }
      break;
    }
    case 'leech': { // dangling, swaying tendrils that reach toward its prey
      if (layer !== 'back') break;
      ctx.lineWidth = 3; ctx.lineCap = 'round';
      const reach = b.drain ? 1.4 : 1;
      for (let i = 0; i < 6; i++) {
        const base = Math.PI * (0.15 + i * 0.14), sway = Math.sin(t * 2.5 * fast + i) * 0.35;
        const x0 = Math.cos(base) * r * 0.8, y0 = Math.sin(base) * r * 0.8;
        const L = r * (1.3 + (i % 2) * 0.4) * reach;
        ctx.beginPath(); ctx.moveTo(x0, y0);
        ctx.quadraticCurveTo(x0 + Math.cos(base + sway) * L * 0.6, y0 + L * 0.5, x0 + Math.cos(base - sway) * L * 0.4, y0 + L);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(x0 + Math.cos(base - sway) * L * 0.4, y0 + L, 3, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
  }
  ctx.lineCap = 'butt';
}

// shockwaves, afterimages, shattered debris and pop-up text
// gimmick visuals: shields, heat gauges, halos, rifts, lightning... (drawn in world space)
function drawGimmick(b) {
  if (!b.gimmick || b.dying > 0 || !b.entered) return;
  const t = performance.now() / 1000;
  ctx.save(); ctx.lineCap = 'round';
  const label = (text, color, y = b.y + b.r * 1.7) => {
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.fillStyle = color; ctx.font = 'bold 13px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, b.x, y);
  };
  switch (b.gimmick) {
    case 'pylons':
      if (b.guard > 0) { // hexagonal cage while any pylon stands
        glow(b.color, 20); ctx.strokeStyle = b.color; ctx.lineWidth = 3; ctx.globalAlpha = 0.6 + Math.sin(t * 6) * 0.2;
        ctx.save(); ctx.translate(b.x, b.y); polygon(6, b.r * 1.5, t * 0.6); ctx.stroke();
        ctx.globalAlpha = 0.08; ctx.fillStyle = b.color; ctx.fill(); ctx.restore();
        label(`SHIELDED · ${b.guard} PYLON${b.guard > 1 ? 'S' : ''}`, b.color);
      }
      break;
    case 'overheat': {
      const heat = b.heat || 0, hot = b.vent > 0;
      const col = hot ? '#ffffff' : heat > 0.7 ? '#ff5d3d' : '#ffb13d';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.55, 0, Math.PI * 2); ctx.stroke();
      glow(col, 15 + heat * 25); ctx.strokeStyle = col;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.55, -Math.PI / 2, -Math.PI / 2 + heat * Math.PI * 2); ctx.stroke();
      if (hot) {
        ctx.globalAlpha = 0.18 + Math.sin(t * 20) * 0.08; ctx.fillStyle = '#ffd8a0';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.6, 0, Math.PI * 2); ctx.fill();
        label('OVERHEATED — ×2 DAMAGE', '#ffffff');
      } else if (heat > 0.75 && Math.floor(t * 6) % 2) label('HEAT CRITICAL', '#ff5d3d');
      break;
    }
    case 'halo':
      if (b.haloW > 0) { // flickering outline before it goes up
        ctx.globalAlpha = 0.3 + (Math.floor(t * 16) % 2) * 0.4; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 6]);
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.5, 0, Math.PI * 2); ctx.stroke();
      } else if (b.haloUp > 0) {
        glow('#ffffff', 30); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.globalAlpha = 0.9;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.5, 0, Math.PI * 2); ctx.stroke();
        ctx.lineWidth = 2; ctx.strokeStyle = b.color;
        for (let i = 0; i < 12; i++) { // feathers
          const a = t * 1.5 + i / 12 * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(b.x + Math.cos(a) * b.r * 1.5, b.y + Math.sin(a) * b.r * 1.5);
          ctx.lineTo(b.x + Math.cos(a + 0.2) * b.r * 1.85, b.y + Math.sin(a + 0.2) * b.r * 1.85); ctx.stroke();
        }
        ctx.globalAlpha = 0.1; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.5, 0, Math.PI * 2); ctx.fill();
        label('REFLECTING!', '#ffffff', b.y + b.r * 2.1);
      }
      break;
    case 'stun':
      for (const r of b.rifts || []) { // void rifts: thin while arming, then a burning tear
        const armed = r[4] > RIFT_ARM, fade = Math.min(1, (RIFT_LIFE - r[4]) * 2);
        ctx.globalAlpha = fade * (armed ? 0.9 : 0.35); ctx.strokeStyle = armed ? '#ff4d4d' : '#ffffff';
        ctx.lineWidth = armed ? 8 + Math.sin(t * 30) * 2 : 2; glow('#ff4d4d', armed ? 25 : 0);
        ctx.beginPath(); ctx.moveTo(r[0], r[1]);
        for (let i = 1; i < 10; i++) {
          const k = i / 10, w = armed ? Math.sin(t * 25 + i * 2) * 5 : 0;
          ctx.lineTo(r[0] + (r[2] - r[0]) * k + w, r[1] + (r[3] - r[1]) * k - w);
        }
        ctx.lineTo(r[2], r[3]); ctx.stroke();
        if (armed) { ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.shadowBlur = 0; ctx.stroke(); }
      }
      if (b.stun > 0) { // dizzy stars
        ctx.globalAlpha = 1; ctx.fillStyle = '#ffe93d'; glow('#ffe93d', 15);
        for (let i = 0; i < 3; i++) {
          const a = t * 5 + i / 3 * Math.PI * 2, x = b.x + Math.cos(a) * b.r * 0.8, y = b.y - b.r * 1.1 + Math.sin(a) * b.r * 0.25;
          ctx.save(); ctx.translate(x, y); ctx.rotate(t * 4); ctx.beginPath();
          for (let k = 0; k < 10; k++) { const rr = k % 2 ? 3 : 8, aa = k / 10 * Math.PI * 2; ctx.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr); }
          ctx.fill(); ctx.restore();
        }
        label('STUNNED — ×2 DAMAGE', '#ffe93d', b.y + b.r * 1.5);
      }
      break;
    case 'abyss': drawAbyssWarnings(b); break;
    case 'judgment':
      if (b.judge) { // everything outside the safe circles is about to be hit
        const j = b.judge, k = Math.min(1, j.t / JUDGE_WARN), hit = j.t >= JUDGE_WARN;
        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H);
        for (const [x, y] of j.zones) { ctx.moveTo(x + JUDGE_R, y); ctx.arc(x, y, JUDGE_R, 0, Math.PI * 2, true); }
        ctx.fillStyle = hit ? 'rgba(255,255,255,0.55)' : hexA(b.color, 0.06 + k * 0.22 + (Math.floor(t * 8) % 2) * 0.04); ctx.fill('evenodd');
        ctx.restore();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; glow('#ffffff', 20);
        for (const [x, y] of j.zones) { ctx.beginPath(); ctx.arc(x, y, JUDGE_R, 0, Math.PI * 2); ctx.stroke(); }
        if (!hit) label(`GET IN A SAFE CIRCLE — ${Math.max(0, JUDGE_WARN - j.t).toFixed(1)}`, '#ffffff', H * 0.32);
      }
      break;
    case 'gravity': { // the supernova meter around it
      const n = b.nova || 0;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.3, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = n > 0.8 ? '#ffffff' : b.color; glow(b.color, 10 + n * 25);
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.3, -Math.PI / 2, -Math.PI / 2 + n * Math.PI * 2); ctx.stroke();
      if (n > 0.8 && Math.floor(t * 6) % 2) label('SUPERNOVA CHARGING', '#ffffff', b.y + b.r * 2.7);
      break;
    }
    case 'zero':
      if (b.grid) { // the beam grid: flickering guides, then solid white beams
        const g = b.grid, live = g.t >= GRID_WARN, k = Math.min(1, g.t / GRID_WARN);
        ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff';
        if (!live) { ctx.globalAlpha = 0.25 + k * 0.4 + (Math.floor(t * 16) % 2) * 0.15; ctx.lineWidth = 1.5; ctx.setLineDash([4, 6]); }
        else { glow('#7df9ff', 30); ctx.globalAlpha = 0.9; }
        for (const x of g.v) live ? ctx.fillRect(x - GRID_W / 2, 0, GRID_W, H) : (ctx.beginPath(), ctx.moveTo(x, 0), ctx.lineTo(x, H), ctx.stroke());
        for (const y of g.h) live ? ctx.fillRect(0, y - GRID_W / 2, W, GRID_W) : (ctx.beginPath(), ctx.moveTo(0, y), ctx.lineTo(W, y), ctx.stroke());
        if (!live) { ctx.globalAlpha = 0.06 + k * 0.08; for (const x of g.v) ctx.fillRect(x - GRID_W / 2, 0, GRID_W, H); for (const y of g.h) ctx.fillRect(0, y - GRID_W / 2, W, GRID_W); }
      }
      if (b.invW > 0 && Math.random() < 0.5) label('ERROR', '#ff3df2', b.y + b.r * 1.7);
      break;
    case 'storm':
      for (const s of b.strikes || []) {
        const [x, y, age] = s;
        if (age < STRIKE_WARN) { // target circle closing in
          const k = age / STRIKE_WARN;
          ctx.globalAlpha = 0.35 + k * 0.5; ctx.strokeStyle = '#d8f4ff'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
          ctx.beginPath(); ctx.arc(x, y, STRIKE_R * (1.6 - k * 0.6), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
          ctx.globalAlpha = 0.08 + k * 0.15; ctx.fillStyle = '#7da8ff'; ctx.beginPath(); ctx.arc(x, y, STRIKE_R, 0, Math.PI * 2); ctx.fill();
        } else if (age < STRIKE_WARN + STRIKE_BOLT) { // the bolt from the sky
          ctx.globalAlpha = 1; glow('#7df9ff', 40); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5;
          ctx.beginPath(); ctx.moveTo(x + (Math.random() - 0.5) * 40, 0);
          for (let i = 1; i < 12; i++) ctx.lineTo(x + (Math.random() - 0.5) * 50 * (1 - i / 12), y * i / 12);
          ctx.lineTo(x, y); ctx.stroke();
          ctx.globalAlpha = 0.5; ctx.fillStyle = '#d8f4ff'; ctx.beginPath(); ctx.arc(x, y, STRIKE_R, 0, Math.PI * 2); ctx.fill();
        } else { // crackling static left behind
          const fade = Math.min(1, (STRIKE_END - age) * 2);
          ctx.globalAlpha = 0.15 * fade; ctx.fillStyle = '#5d8dff'; ctx.beginPath(); ctx.arc(x, y, STATIC_R, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 0.8 * fade; ctx.strokeStyle = '#d8f4ff'; ctx.lineWidth = 1.5; glow('#7df9ff', 10);
          for (let i = 0; i < 3; i++) {
            const a = Math.random() * Math.PI * 2; ctx.beginPath(); ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(a + 0.4) * STATIC_R * 0.5, y + Math.sin(a + 0.4) * STATIC_R * 0.5);
            ctx.lineTo(x + Math.cos(a) * STATIC_R, y + Math.sin(a) * STATIC_R); ctx.stroke();
          }
        }
      }
      break;
  }
  ctx.restore();
}

function drawBossFx(layer) {
  if (layer === 'under') {
    for (const g of bossFx.ghosts) {
      const p = g.life / g.max;
      ctx.save(); ctx.translate(g.x, g.y); ctx.scale(1 + (1 - p) * 0.25, 1 + (1 - p) * 0.25);
      ctx.globalAlpha = p * 0.45; ctx.strokeStyle = g.color; ctx.lineWidth = 2; glow(g.color, 15);
      polygon(g.sides, g.r, g.rot); ctx.stroke();
      ctx.restore();
    }
    return;
  }
  for (const r of bossFx.rings) {
    if (r.delay > 0) continue;
    const p = 1 - r.life / r.max;
    ctx.save(); ctx.globalAlpha = 1 - p; ctx.strokeStyle = r.color; ctx.lineWidth = r.w * (1 - p * 0.6); glow(r.color, 20);
    ctx.beginPath(); ctx.arc(r.x, r.y, Math.max(1, r.from + (r.to - r.from) * easeOut(p)), 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  for (const s of bossFx.shards) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.globalAlpha = Math.min(1, s.life / s.max * 1.5); ctx.strokeStyle = s.color; ctx.lineWidth = 3; glow(s.color, 15);
    ctx.beginPath(); ctx.moveTo(-s.len / 2, 0); ctx.lineTo(s.len / 2, 0); ctx.stroke();
    ctx.restore();
  }
  for (const z of bossFx.zaps) { // chain lightning arcs
    ctx.save(); ctx.globalAlpha = z.life / z.max; ctx.strokeStyle = '#d8f4ff'; ctx.lineWidth = 2.5; glow('#7df9ff', 15);
    ctx.beginPath(); ctx.moveTo(z.x1, z.y1);
    for (let i = 1; i < 6; i++) {
      const t = i / 6;
      ctx.lineTo(z.x1 + (z.x2 - z.x1) * t + (Math.random() - 0.5) * 16, z.y1 + (z.y2 - z.y1) * t + (Math.random() - 0.5) * 16);
    }
    ctx.lineTo(z.x2, z.y2); ctx.stroke();
    ctx.restore();
  }
  for (const tx of bossFx.texts) {
    const age = tx.max - tx.life;
    const pop = age < 0.15 ? age / 0.15 * 1.3 : Math.max(1, 1.3 - (age - 0.15) * 2);
    ctx.font = `900 ${Math.min(tx.size, W / 12)}px system-ui`;
    const half = Math.min(W / 2, ctx.measureText(tx.text).width * pop / 2 + 8); // keep it on screen near the edges
    ctx.save(); ctx.translate(Math.max(half, Math.min(W - half, tx.x)), Math.max(20, tx.y)); ctx.scale(pop, pop);
    ctx.globalAlpha = Math.min(1, tx.life / 0.4);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    glow(tx.color, 25); ctx.fillStyle = '#fff'; ctx.fillText(tx.text, 0, 0);
    ctx.restore();
  }
}

// all player bullets in a few batched strokes: a soft additive glow pass, then bright cores
function drawPlayerBullets() {
  if (!bullets.length) return;
  const size = run.s.bulletSize;
  const trace = (list, len) => {
    ctx.beginPath();
    for (const b of list) {
      const sp = Math.hypot(b.vx, b.vy) || 1, l = b.crit ? len * 1.5 : len;
      ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx / sp * l, b.y - b.vy / sp * l);
    }
  };
  const normal = [], crits = [], rails = [], missiles = [];
  for (const b of bullets) (b.missile ? missiles : b.rail ? rails : b.crit ? crits : normal).push(b);
  const byColor = {};
  for (const b of normal) (byColor[b.color] ||= []).push(b);
  if (crits.length) byColor['#ffffff'] = crits;
  ctx.save();
  ctx.shadowBlur = 0; ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'lighter';
  for (const col in byColor) { ctx.strokeStyle = hexA(col, 0.3); ctx.lineWidth = 9 + size; trace(byColor[col], 13); ctx.stroke(); }
  if (rails.length) { ctx.strokeStyle = 'rgba(160,240,255,0.35)'; ctx.lineWidth = 20; trace(rails, 60); ctx.stroke(); }
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = '#fff6b0'; ctx.lineWidth = 3 + size * 0.5; trace(normal, 13); ctx.stroke();
  if (crits.length) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4.5 + size * 0.5; trace(crits, 13); ctx.stroke(); }
  if (rails.length) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; trace(rails, 60); ctx.stroke(); }
  ctx.restore();
  if (missiles.length) drawGlowDots(missiles.map(b => ({ x: b.x, y: b.y, r: 4, color: '#ff9a3d' })));
}

const PICK = { power: ['#ffe93d', 'P'], shield: ['#7df9ff', 'S'], life: ['#ff6fb5', '+'] };

function drawWorld() {
  for (const l of lasers) {
    ctx.save();
    if (l.warn > 0) { // blinking telegraph line
      ctx.globalAlpha = Math.floor(l.warn * 10) % 2 ? 0.7 : 0.25;
      ctx.strokeStyle = l.color; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.moveTo(l.x, 0); ctx.lineTo(l.x, H); ctx.stroke();
      ctx.globalAlpha = 0.08; ctx.fillStyle = l.color; ctx.fillRect(l.x - l.w / 2, 0, l.w, H);
    } else {
      const w = l.w * (0.7 + Math.random() * 0.3);
      glow(l.color, 40); ctx.fillStyle = l.color; ctx.globalAlpha = 0.85; ctx.fillRect(l.x - w / 2, 0, w, H);
      ctx.fillStyle = '#fff'; ctx.fillRect(l.x - w / 6, 0, w / 3, H);
    }
    ctx.restore();
  }
  drawBossFx('under');
  drawEncounterFx();
  for (const bo of bosses) drawBoss(bo);
  for (const bo of bosses) drawGimmick(bo);
  const shots = [], ink = [];
  for (const b of eBullets) {
    const c = b.color || '#ff4d4d';
    if (b.fuse !== undefined) { // mine: pulsing ring that blinks faster as it's about to burst
      glow(c, 20); ctx.strokeStyle = c; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = Math.floor(b.fuse * (b.fuse < 0.5 ? 20 : 6)) % 2 ? '#fff' : c;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2); ctx.fill();
      continue;
    }
    if (c === ABYSS_INK) { ink.push(b); continue; }
    shots.push({ x: b.x, y: b.y, r: b.r || 5, color: c });
  }
  drawGlowDots(shots);
  if (ink.length) { // THE ABYSS's ink: black drops with a red rim
    ctx.save(); glow('#ff1f3d', 12); ctx.fillStyle = '#000'; ctx.strokeStyle = '#ff1f3d'; ctx.lineWidth = 2; ctx.beginPath();
    for (const b of ink) { const r = b.r || 5; ctx.moveTo(b.x + r, b.y); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); }
    ctx.fill(); ctx.stroke(); ctx.restore();
  }
  drawPlayerBullets();
  for (const e of enemies) drawEnemyTelegraph(e);
  for (const e of enemies) drawEnemy(e);
  for (const k of pickups) {
    const [c, l] = PICK[k.kind];
    glow(c, 20); ctx.strokeStyle = c; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(k.x, k.y, 13 + Math.sin(k.t * 6) * 2, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = c; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(l, k.x, k.y + 1);
  }
  for (const p of players) if (!p.alive && p.wreck) drawWreck(p);
  for (const p of players) drawTrail(p);
  for (const p of players) if (p.alive && (p.inv <= 0 || Math.floor(p.inv * 12) % 2 === 0)) drawShip(p);
  drawTeamUi();
  drawBossFx('over');
  // floating score from kills
  ctx.shadowBlur = 0; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const pp of popups) {
    if (pp.dn && !settings.dmgNums) continue;
    ctx.globalAlpha = Math.min(1, pp.life / 0.4);
    ctx.font = `bold ${pp.dn ? (pp.dn === 2 ? 14 : 11) : pp.hot || pp.color ? 15 : 12}px system-ui`;
    ctx.fillStyle = pp.dn ? (pp.dn === 2 ? '#ffe9a0' : '#ffffff') : pp.color || (pp.hot ? '#ffe93d' : '#dfe8ff');
    ctx.fillText(pp.text, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
}

// ---------- draw: HUD & screens ----------
function drawHUD() {
  ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 22px system-ui';
  ctx.fillText(score.toLocaleString(), 16, 14);
  ctx.font = '13px system-ui'; ctx.fillStyle = '#9ab';
  ctx.fillText(`${mode > 1 ? `${mode}P CO-OP   ` : ''}${run.endless ? `ENDLESS C${run.cycle}   ` : ''}${run.rush ? `BOSS RUSH ${bossCount}/${run.bossOrder.length}` : `SECTOR ${level}`} · ${curZone().name}   BEST ${bestOf(mode, runKind()).toLocaleString()}   ● ${run.coins || 0}`, 16, 42);
  if (combo > 1) { ctx.fillStyle = '#ffe93d'; ctx.font = 'bold 16px system-ui'; ctx.fillText(`x${combo} COMBO`, 16, 62); }
  // active endless mutators
  const muts = MUTATORS.filter(m => mut(m.id)).map(m => m.name + (mut(m.id) > 1 ? ` ×${mut(m.id)}` : ''));
  if (muts.length) { ctx.fillStyle = '#ff9a3d'; ctx.font = 'bold 11px system-ui'; ctx.fillText(muts.join(' · '), 16, combo > 1 ? 84 : 64); }

  ctx.textAlign = 'right';
  const compactHud = players.length > 4; // online 5-8 players: one short line each
  players.forEach((p, i) => {
    const y = 14 + i * hudRowH();
    ctx.font = compactHud ? '15px system-ui' : '20px system-ui'; ctx.fillStyle = p.alive ? p.color : '#556';
    const label = mode > 1 ? `P${p.id + 1} ` : '';
    ctx.fillText(p.alive ? label + '♥'.repeat(p.lives) + '♡'.repeat(Math.max(0, maxLivesOf(p) - p.lives)) : label + (p.gone ? 'LEFT' : 'DOWN'), W - 16, y);
    if (compactHud) return;
    ctx.font = 'bold 12px system-ui';
    if (p.alive && p.power > 0) { ctx.fillStyle = '#ffe93d'; ctx.fillText(`SPREAD ${p.power.toFixed(1)}s`, W - 16, y + 26); }
    else if (!p.alive) { ctx.fillStyle = '#889'; ctx.fillText(p.gone ? 'left the game' : 'fly to the wreck to revive', W - 16, y + 26); }
    else { ctx.fillStyle = hexA(p.color, 0.55); ctx.fillText(p.ship.name, W - 16, y + 26); }
  });

  // sector progress bar along the bottom edge
  if (!bosses.length && bossWarn <= 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, H - 4, W, 4);
    ctx.fillStyle = level % BOSS_EVERY === BOSS_EVERY - 1 ? '#ff5a70' : '#7df9ff';
    ctx.fillRect(0, H - 4, W * levelT / SECTOR_TIME, 4);
  }

  // owned upgrades, bottom-left
  ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let x = 16, y = H - 14;
  for (const u of UPGRADES) {
    const n = run.owned[u.id]; if (!n) continue;
    const t = n > 1 ? `${u.name} ×${n}` : u.name, w = ctx.measureText(t).width + 14;
    if (x + w > W - 16) { x = 16; y -= 20; }
    ctx.fillStyle = 'rgba(10,12,28,0.7)'; ctx.fillRect(x, y - 12, w, 17);
    ctx.fillStyle = RARITY[u.r].color; ctx.fillText(t, x + 7, y);
    x += w + 6;
  }

  // one health bar per boss, stacked; status tags explain team mechanics
  // (with 3+ bosses, the bars go into a compact 2-column grid so they don't cover the fight)
  const narrow = W < 640, compact = bosses.length >= 3;
  const full = narrow ? W - 32 : Math.min(compact ? 560 : 460, W - 360), bw = compact ? (full - 10) / 2 : full;
  const top = narrow ? 14 + players.length * hudRowH() + 8 : 18;
  bosses.forEach((bo, i) => {
    const bx = compact ? (W - full) / 2 + (i % 2) * (bw + 10) : (W - bw) / 2;
    const by = compact ? top + Math.floor(i / 2) * 28 : top + i * 34, cx = bx + bw / 2;
    let status = '', statusColor = bo.color;
    if (bo.downed) { status = `REVIVING IN ${Math.ceil(bo.reviveT)}s`; statusColor = '#ff5a70'; }
    else if (bo.shielded) { status = 'SHIELDED'; statusColor = '#5dff7a'; }
    else if (bo.regen) { status = 'REGENERATING'; statusColor = '#5dff7a'; }
    else if (bo.healT > 0) { status = 'HEALING'; statusColor = '#ff2d55'; }
    else if (isEnraged(bo) && bo.dying <= 0) status = 'ENRAGED';
    else if (bo.bond !== undefined) { status = `P${bo.bond + 1}'S TARGET`; statusColor = P_COLORS[bo.bond]; }
    // "NAME  ·  STATUS", centered as a whole, with the status in its own color
    ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.font = `bold ${compact ? 10 : 13}px system-ui`;
    const head = bo.name + (status ? (compact ? ' · ' : '  ·  ') : ''), x0 = cx - ctx.measureText(head + status).width / 2;
    ctx.fillStyle = bo.color; ctx.fillText(head, x0, by);
    if (status) { ctx.fillStyle = statusColor; ctx.fillText(status, x0 + ctx.measureText(head).width, by); }
    if (!compact && !bo.downed) { ctx.textAlign = 'right'; ctx.fillStyle = '#cde'; ctx.font = 'bold 11px system-ui'; ctx.fillText(`${Math.ceil(Math.max(0, bo.hp / bo.max) * 100)}%`, bx + bw, by + 1); } // HP left
    const barY = by + (compact ? 14 : 19), barH = compact ? 5 : 7;
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(bx, barY, bw, barH);
    if (bo.downed) { // the revive timer drains across the empty bar
      ctx.fillStyle = hexA('#ff5a70', 0.5); ctx.fillRect(bx, barY, bw * bo.reviveT / TWIN_REVIVE(), barH);
    } else {
      glow(bo.color, 12); ctx.fillStyle = bo.color;
      ctx.fillRect(bx, barY, bw * Math.max(0, bo.hp / bo.max), barH);
      ctx.shadowBlur = 0;
      if (bo.shielded) { ctx.strokeStyle = '#5dff7a'; ctx.lineWidth = 1.5; ctx.strokeRect(bx - 2, barY - 2, bw + 4, barH + 4); }
    }
  });
  if (state === 'play') drawZoneCard();
  if (bossWarn > 0 && !run.warp && Math.floor(bossWarn * 4) % 2 === 0) {
    const info = net.role === 'guest' ? net.warnInfo || { name: '???' } : encounterInfo(bossCount); // (guests don't know the boss order)
    ctx.fillStyle = 'rgba(255,40,60,0.12)'; ctx.fillRect(0, H / 2 - 60, W, 120);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    glow('#ff3050', 30); ctx.fillStyle = '#ff5a70';
    ctx.font = `900 ${Math.min(56, W / 9)}px system-ui`; ctx.fillText(info.team ? 'TEAM BOSS' : 'WARNING', W / 2, H / 2 - 14);
    ctx.shadowBlur = 0; fitText(`${info.name} APPROACHING${info.final ? ' — FINAL BOSS' : ''}`, H / 2 + 30, 16, '#ffb0bb');
  }
  if (hint && !paused) {
    ctx.save(); ctx.globalAlpha = Math.min(1, hint.life);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '15px system-ui'; ctx.fillStyle = '#cde';
    wrap(hint.text, Math.min(620, W - 40)).forEach((l, i) => ctx.fillText(l, W / 2, H * 0.62 + i * 20));
    ctx.restore();
  }
  if (paused) drawPause();
}

const SETTING_LIST = [['music', 'MUSIC  [M]'], ['sfx', 'SOUND EFFECTS'], ['shake', 'SCREEN SHAKE'], ['dmgNums', 'DAMAGE NUMBERS'],
  ['calm', 'REDUCED FLASHING'], ['fps', 'SHOW FPS'], ['lowfx', 'PERFORMANCE MODE']];
function toggleFullscreen() {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) {}
}
// all the settings toggles (two columns on wide screens); returns the y just below them
function settingsButtons(y) {
  const cols = W >= 640 ? 2 : 1, gap = 8, bh = cols > 1 ? 42 : 38, bw = Math.min(cols > 1 ? 250 : 300, (W - 32 - gap) / cols);
  const x0 = (W - (bw * cols + gap * (cols - 1))) / 2;
  const items = [...SETTING_LIST.map(([k, label]) => [`${label}:  ${settings[k] ? 'ON' : 'OFF'}`, settings[k] ? '#5dff7a' : '#778', () => toggleSetting(k)]),
    [`FULLSCREEN  [F]:  ${document.fullscreenElement ? 'ON' : 'OFF'}`, document.fullscreenElement ? '#5dff7a' : '#778', toggleFullscreen]];
  items.forEach(([label, color, act], i) => button(label, x0 + (i % cols) * (bw + gap), y + Math.floor(i / cols) * (bh + gap), bw, bh, color, act));
  return y + Math.ceil(items.length / cols) * (bh + gap);
}

let pauseView = 'main'; // 'main' or 'settings'
function restartRun() {
  if (net.role === 'guest' || !run) return;
  paused = false; pauseView = 'main';
  if (net.role === 'host') startOnline(); else start(mode, run.ships);
}
function drawPause() {
  ctx.fillStyle = 'rgba(3,3,12,0.78)'; ctx.fillRect(0, 0, W, H);
  if (net.role === 'guest') { title('PAUSED BY HOST', 90, '#7df9ff', 40); drawBuildPanel((W - Math.min(520, W - 32)) / 2, 130, Math.min(520, W - 32)); return; }
  if (pauseView === 'settings') {

    return;

  title('PAUSED', 64, '#7df9ff', 48);
  // buttons on the left (or on top on phones), your build on the right (or below)
  const wide = W >= 760, bw = wide ? 240 : Math.min(300, W - 32), bh = wide ? 42 : 38, gap = wide ? 50 : 44;
  const bx = wide ? W / 2 - 280 : (W - bw) / 2, by = 110;
  button('RESUME  [P]', bx, by, bw, bh, '#7df9ff', () => { paused = false; });
