  if (wide) drawBuildPanel(W / 2 - 20, by, Math.min(320, W / 2 - 40));
  else drawBuildPanel((W - Math.min(420, W - 32)) / 2, by + gap * 4 + 6, Math.min(420, W - 32));
}
// your stats, your upgrades and how close you are to each evolution
function drawBuildPanel(x, y, w) {
  const s = run.s, lines = [];
  const pct = v => Math.round(v * 100) + '%';
  const stats = [['Damage', '×' + s.dmg.toFixed(2)], ['Fire rate', (1 / s.fireDelay).toFixed(1) + '/s'], ['Shots', s.shots], ['Pierce', s.pierce],
    ['Crit', pct(s.crit)], ['Boss dmg', '×' + s.bossDmg.toFixed(2)], ['Speed', Math.round(s.speed)], ['Max lives', s.maxLives]];
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#7df9ff'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'left'; ctx.fillText('YOUR BUILD', x, y);
  y += 20;
  ctx.font = '12px system-ui';
  stats.forEach(([k, v], i) => {
    const cx = x + (i % 2) * (w / 2), cy = y + Math.floor(i / 2) * 17;
    ctx.textAlign = 'left'; ctx.fillStyle = '#9ab'; ctx.fillText(k, cx, cy);
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.fillText(String(v), cx + w / 2 - 12, cy);
  });
  y += Math.ceil(stats.length / 2) * 17 + 8;
  const owned = UPGRADES.filter(u => run.owned[u.id]);
  ctx.textAlign = 'left'; ctx.fillStyle = '#7df9ff'; ctx.font = 'bold 13px system-ui'; ctx.fillText(`UPGRADES (${owned.length})`, x, y); y += 18;
  ctx.font = '12px system-ui'; ctx.fillStyle = '#cde';
  const text = owned.map(u => (u.r === 'evo' ? '★ ' : '') + u.name + (run.owned[u.id] > 1 ? ` ×${run.owned[u.id]}` : '')).join(' · ') || 'None yet';
  for (const l of wrap(text, w).slice(0, 5)) { ctx.fillText(l, x, y); y += 15; }
  // evolutions you've started on (and ones you've finished)
  const evo = EVOLUTIONS.filter(e => run.owned[e.id] || e.needs.some(([id]) => run.owned[id]));
  if (evo.length && y < H - 40) {
    y += 6; ctx.fillStyle = RARITY.evo.color; ctx.font = 'bold 13px system-ui'; ctx.fillText('EVOLUTIONS', x, y); y += 18;
    ctx.font = '11px system-ui';
    for (const e of evo) {
      if (y > H - 20) break;
      const done = run.owned[e.id], ready = !done && e.needs.every(([id, lv]) => (run.owned[id] || 0) >= lv);
      const need = e.needs.map(([id, lv]) => `${UPGRADES.find(u => u.id === id).name} ${Math.min(lv, run.owned[id] || 0)}/${lv}`).join(' + ');
      ctx.fillStyle = done ? '#5dff7a' : ready ? RARITY.evo.color : '#9ab';
      ctx.fillText(done ? `✓ ${e.name}` : ready ? `★ ${e.name} — ready! Next boss reward` : `${e.name}: ${need}`, x, y, w);
      y += 15;
    }
  }
}

// "ACHIEVEMENT UNLOCKED" banner that slides down from the top
function drawAchBanner() {
  if (!achShow) return;
  const { a, t } = achShow, c = ACH_CATS[a.cat];
  const slide = t < 0.3 ? easeOut(t / 0.3) : t > 3.1 ? 1 - easeOut((t - 3.1) / 0.3) : 1;
  const w = Math.min(380, W - 32), h = 58, x = (W - w) / 2, y = -h + (h + 14) * slide;
  ctx.save();
  panel(x, y, w, h, c, true);
  ctx.translate(x + 30, y + h / 2);

// ---------- quick chat: 1-4 pops a callout over your ship (everyone online sees it) ----------
const EMOTES = [['HELP!', '#ff5a70'], ['REVIVE ME!', '#5dff7a'], ['ON MY WAY', '#7df9ff'], ['NICE!', '#ffe93d']];
function showEmote(id, k) {
  const p = players[id]; if (!p || !EMOTES[k]) return;
  p.emote = { k, until: performance.now() + 2200 };
  beep(700 + k * 120, 0.08, 'triangle', 0.04);
}
function sendEmote(k) {
  const me = net.role ? net.mine[0] : 0, p = players[me];
  if (!p || (p.emoteCd || 0) > performance.now()) return; // no spamming
  p.emoteCd = performance.now() + 700;
  showEmote(me, k);
  if (net.role === 'guest') net.host?.send({ emote: k }); else netRec(['e', me, k]);
}
// callouts, name tags (online) and arrows pointing to downed teammates
function drawTeamUi() {
  const now = performance.now(), online = !!net.role;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of players) {
    const at = p.alive ? p : p.wreck; if (!at) continue;
    if (online && p.alive && players.length > 1) { // who's who
      ctx.font = 'bold 10px system-ui'; ctx.fillStyle = hexA(p.color, 0.8);
      ctx.fillText(isMine(p.id) ? (net.mine.length > 1 ? `YOU · P${p.id + 1}` : 'YOU') : `P${p.id + 1}`, p.x, p.y + 30);
    }
    if (p.emote && now < p.emote.until) { // speech bubble
      const [text, color] = EMOTES[p.emote.k], pop = Math.min(1, (p.emote.until - now) / 200, (now - p.emote.until + 2200) / 120);
      ctx.font = 'bold 13px system-ui';
      const w = ctx.measureText(text).width + 18, x = Math.max(w / 2 + 4, Math.min(W - w / 2 - 4, at.x)), y = Math.max(20, at.y - 44);
      ctx.globalAlpha = Math.max(0, pop); ctx.fillStyle = 'rgba(5,5,16,0.85)'; ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(x - w / 2, y - 12, w, 24, 8); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(at.x - 5, y + 12); ctx.lineTo(at.x, y + 19); ctx.lineTo(at.x + 5, y + 12); ctx.fill();
      ctx.fillStyle = color; ctx.fillText(text, x, y + 1); ctx.globalAlpha = 1;
    }
  }
  // arrows from your ship (online) or every ship (local) toward downed teammates
  const mine = online ? living().filter(p => isMine(p.id)) : living();
  for (const p of mine) for (const d of players) {
    if (d.alive || !d.wreck) continue;
    const dx = d.wreck.x - p.x, dy = d.wreck.y - p.y, dist = Math.hypot(dx, dy);
    if (dist < 140) continue;
    const a = Math.atan2(dy, dx), x = p.x + Math.cos(a) * 44, y = p.y + Math.sin(a) * 44, pulse = 1 + Math.sin(now / 150) * 0.15;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(pulse, pulse);
    ctx.fillStyle = d.color; glow(d.color, 12);
    ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-5, -6); ctx.lineTo(-2, 0); ctx.lineTo(-5, 6); ctx.fill(); ctx.restore();
    ctx.font = 'bold 9px system-ui'; ctx.fillStyle = d.color; ctx.fillText(`P${d.id + 1}`, x + Math.cos(a) * 16, y + Math.sin(a) * 16 - 2);
  }
  ctx.restore();
}

// the solo fights of the zone you just entered are drawn from its own boss list (ones you haven't fought

function assignZoneBosses(z) {
  const cycleStart = Math.floor(bossCount / BOSS_CYCLE) * BOSS_CYCLE + 1, cycleEnd = cycleStart + BOSS_CYCLE - 1;
  encounterDef(cycleEnd); // (Endless builds each cycle's order as it goes)
  const at = n => run.bossOrder[(n - 1) % run.bossOrder.length];
  for (let n = bossCount + 1; n <= Math.min(cycleEnd, bossCount + BOSSES_PER_ZONE); n++) {
    const e = at(n);
    if (e.single === undefined || BOSSES[e.single].final) continue;
    const fought = new Set();
    for (let k = cycleStart; k < n; k++) if (at(k).single !== undefined) fought.add(at(k).single);
    const pool = z.bosses.map(name => BOSSES.findIndex(b => b.name === name)).filter(i => i >= 0 && !fought.has(i));
    if (!pool.length) continue;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    for (let k = n + 1; k <= cycleEnd; k++) if (at(k).single === pick) at(k).single = e.single;

// ---------- the route map: after a zone is cleared, choose where to go next ----------
function routeOptions() {

}

    p.tilt = (p.tilt || 0) + (Math.max(-1, Math.min(1, (p.x - ox) / dt / 500)) * 0.45 - (p.tilt || 0)) * kk;
    p.thrust = (p.thrust || 0) + (Math.max(0, Math.min(1, -(p.y - oy) / dt / 400)) - (p.thrust || 0)) * kk;
  }
}

// ----- lobby: pick ships -----
// quick-cycle through every ship you can fly (A/D in the lobby); CHANGE SHIP opens the full picker
function cycleShip(d) {
  const list = flyableShips(), slot = net.slots[net.mine[0]];
  if (!slot) return;
  const i = list.findIndex(s => s.id === slot.ship);
  setMyOnlineShip(list[(i + d + list.length) % list.length].id, 0);
  beep(520, 0.08, 'triangle', 0.05);
}
// k = which of the players on this computer
function setMyOnlineShip(id, k = 0) {
  const slot = net.slots[net.mine[k]];
  if (!slot) return;
  slot.ship = id; lastShips[k] = id;
  try { localStorage.setItem('neonDriftShips', JSON.stringify(lastShips)); } catch (e) {}
  if (net.role === 'host') broadcastLobby(); else net.host?.send({ ship: id, k });
}

// ----- keys for the online screens -----
function onlineKey(e) {
  if (state === 'joinCode') {
    if (e.code === 'Escape') { go('online'); return true; }
    if (e.code === 'Backspace') { net.typed = net.typed.slice(0, -1); return true; }
    if (e.code === 'Enter') { if (net.typed.length === CODE_LEN) joinGame(net.typed); return true; }
    if (/^[0-9]$/.test(e.key)) typeCodeDigit(e.key); // number row or numpad
    return true;
  }
  if (state === 'online') {
    if (e.code === 'Escape') { go('menu'); return true; }
    if (e.code === 'KeyB') { go('browse'); return true; }
    if (e.code === 'KeyL') { cycleLocalPlayers(); return true; }
    return false; // arrows/Enter work the buttons as usual
  }
  if (state === 'browse') {
    if (e.code === 'Escape') { go('online'); return true; }
    const n = +e.key, r = sortedRooms()[n - 1];
    if (n >= 1 && r && roomOpen(r)) { joinGame(r.code); return true; }
    return false; // arrows/Enter work the buttons
  }
  if (state === 'lobby') {
    if (e.code === 'Escape') { leaveOnline(); return true; }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { cycleShip(-1); return true; }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { cycleShip(1); return true; }
    if (e.code === 'KeyC') { openShipSelect(1, true); return true; }
    if (net.role === 'host' && e.code === 'KeyE') { toggleRunType(); broadcastLobby(); return true; }
    if (net.role === 'host' && e.code === 'KeyP') { togglePublic(); return true; }
    if (net.role === 'host' && e.code === 'Enter') { startOnline(); return true; }
    return true;
  }
  if (net.role === 'guest' && net.playing) {
    if (e.code === 'Escape') { // press twice to leave
      if (performance.now() < net.leaveArm) leaveOnline('You left the game');
      else { net.leaveArm = performance.now() + 2000; showToast('Press Esc again to leave the game'); }
      return true;
    }
    if (e.code === 'KeyP') return true; // only the host can pause
    if (state === 'over') return true;  // the host decides what happens next
  }
  return false;
}

// ----- online screens -----
function cycleLocalPlayers() {
  net.localN = net.localN % 4 + 1;
  beep(440 + net.localN * 80, 0.1, 'triangle', 0.05);
}
function drawOnline() {
  const cy = Math.max(170, H / 2 - 110), bw = Math.min(300, W - 32), bx = (W - bw) / 2;
  title('ONLINE CO-OP', cy - 80, '#9dff5d', 48);
  fitText('Play with up to 7 friends over the internet', cy - 34, 15, '#9ab');
  // friends sharing this computer can come along (they split the keyboard like local co-op)
  button(`PLAYERS ON THIS PC:  ${net.localN}  [L]`, bx, cy, bw, 38, net.localN > 1 ? '#c08dff' : '#9ab', cycleLocalPlayers);
  if (net.localN > 1) fitText(CONTROLS[net.localN].map((c, k) => `P${k + 1}: ${c.map(n => CONTROL_NAMES[n]).join('/')}`).join('  ·  '), cy + 50, 12, '#c08dff');
  const oy = cy + (net.localN > 1 ? 66 : 50);
  button('BROWSE PUBLIC GAMES  [B]', bx, oy, bw, 46, '#ffe93d', () => go('browse'));
  button('HOST A GAME', bx, oy + 56, bw, 46, '#9dff5d', hostGame);
  button('JOIN WITH A CODE', bx, oy + 112, bw, 46, '#7df9ff', () => { net.typed = ''; go('joinCode'); });
  button('BACK  [Esc]', bx, oy + 168, bw, 40, '#9ab', () => go('menu'));
  ctx.font = '13px system-ui';
  wrap('Everyone needs an internet connection and this same version of the game. The host runs the game; friends join with a 4-digit room code. Some strict networks (like school or work) can block the connection.', Math.min(460, W - 40))
    .forEach((l, i) => fitText(l, oy + 186 + i * 18, 13, '#789'));
}
// typing the last digit joins straight away
function typeCodeDigit(d) {
  if (net.typed.length >= CODE_LEN) return;
  net.typed += d; beep(700 + net.typed.length * 60, 0.05, 'triangle', 0.04);
  if (net.typed.length === CODE_LEN) joinGame(net.typed);
}
function drawJoin() {
  const top = Math.max(120, H / 2 - 230), bw = Math.min(300, W - 32), bx = (W - bw) / 2;
  title('JOIN A GAME', top, '#7df9ff', 44);
  fitText('Type the 4-digit room code — it joins as soon as you finish', top + 40, 14, '#9ab');
  const boxW = Math.min(300, W - 32), boxX = (W - boxW) / 2, cy = top + 64;
  panel(boxX, cy, boxW, 64, '#7df9ff', true);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.font = '900 38px system-ui';
  const blink = Math.floor(performance.now() / 500) % 2 ? '_' : ' ';
  ctx.fillText((net.typed + (net.typed.length < CODE_LEN ? blink : '')).padEnd(CODE_LEN, ' ').split('').join('  '), W / 2, cy + 34);
  // on-screen number pad (for mouse or touchscreen)
  const kw = Math.min(90, (bw - 16) / 3), kh = 46, kx = (W - (kw * 3 + 16)) / 2, ky = cy + 80;
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', 'C'].forEach((k, i) => {
    const x = kx + (i % 3) * (kw + 8), y = ky + Math.floor(i / 3) * (kh + 8);
    const act = k === '⌫' ? () => { net.typed = net.typed.slice(0, -1); } : k === 'C' ? () => { net.typed = ''; } : () => typeCodeDigit(k);
    button(k, x, y, kw, kh, /\d/.test(k) ? '#7df9ff' : '#9ab', act);
  });
  button('BACK  [Esc]', bx, ky + 4 * (kh + 8) + 6, bw, 40, '#9ab', () => go('online'));
}
// the public game list (see the directory code)
function drawBrowse() {
  title('PUBLIC GAMES', 60, '#ffe93d', 44);
  const rooms = sortedRooms().slice(0, 8);
  const searching = !dir.serving && !dir.conn?.open;
  fitText(dir.status || (searching ? 'Looking for public games…' : rooms.length ? `${rooms.length} game${rooms.length > 1 ? 's' : ''} found — click one to join` : 'No public games right now — host one!'), 100, 14, '#9ab');
  const rw = Math.min(560, W - 32), rx = (W - rw) / 2, rh = 54, top = 124;
  rooms.forEach((r, i) => {
    const y = top + i * (rh + 8), open = roomOpen(r);
    if (open) buttons.push({ x: rx, y, w: rw, h: rh, action: () => joinGame(r.code) });
    panel(rx, y, rw, rh, open ? '#ffe93d' : '#445', sel === i);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = open ? '#fff' : '#778'; ctx.font = 'bold 16px system-ui'; ctx.fillText(`${i + 1}.  ${r.name}`, rx + 14, y + 19);
    ctx.fillStyle = RUN_COLOR[r.run] || '#9ab'; ctx.font = '12px system-ui'; ctx.fillText(`${RUN_LABEL[r.run] || r.run}  ·  code ${r.code}`, rx + 14, y + 38);
    ctx.textAlign = 'right'; ctx.font = 'bold 15px system-ui';
    ctx.fillStyle = open ? '#9dff5d' : '#c88'; ctx.fillText(!open ? 'FULL' : r.playing ? 'JOIN GAME ▶' : 'JOIN', rx + rw - 14, y + 19);
    ctx.fillStyle = r.playing ? '#ffb13d' : '#9ab'; ctx.font = '12px system-ui'; ctx.fillText(`${r.playing ? 'in progress · ' : 'in lobby · '}${r.n} / ${MAX_ONLINE}`, rx + rw - 14, y + 38);
  });
  if (searching || !rooms.length) { // a little radar sweep while waiting
    const t = performance.now() / 1000, cy = top + 60;
    ctx.save(); ctx.strokeStyle = '#ffe93d'; ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) { const p = (t * 0.6 + k / 3) % 1; ctx.globalAlpha = 1 - p; ctx.beginPath(); ctx.arc(W / 2, cy, 8 + p * 40, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
  }
  const by = top + Math.max(2, rooms.length) * (rh + 8) + 10, bw = Math.min(300, W - 32), bx = (W - bw) / 2;
  button('HOST A PUBLIC GAME', bx, by, bw, 44, '#9dff5d', () => { net.wantPublic = true; hostGame(); });
  button('BACK  [Esc]', bx, by + 52, bw, 40, '#9ab', () => go('online'));
  ctx.font = '12px system-ui';
  wrap('The list updates by itself. Public games can be joined even after they start — you drop in with your last-used ship. Strict networks (school/work) may hide some games — use a room code then.', Math.min(460, W - 40))
    .forEach((l, i) => fitText(l, by + 112 + i * 17, 12, '#789'));
}
// host: show or hide this room on the public list
function togglePublic() {
  net.public = net.wantPublic = !net.public;
  if (net.public) dirBeat(); else dirUnlist();
  beep(net.public ? 660 : 440, 0.12, 'triangle', 0.05);
}
function drawLobby() {
  const host = net.role === 'host', me = net.mine[0] ?? 0;
  const ctrlOf = i => (CONTROLS[net.localN]?.[net.mine.indexOf(i)] || []).map(c => CONTROL_NAMES[c]).join(' / '); // (players sharing this computer)
  title('ONLINE LOBBY', 56, '#9dff5d', 44);
  fitText(net.status + (net.peer ? (relayOn ? '  ·  relay ON' : '  ·  direct only') : ''), 96, 14, '#9ab');
  if (host && net.code) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    fitText('ROOM CODE', 128, 13, '#9dff5d', 'bold');
    glow('#9dff5d', 20); fitText(net.code.split('').join(' '), 166, 44, '#ffffff', '900'); ctx.shadowBlur = 0;
  }
  // 8 slots in two columns of 4
  const gap = 10, full = Math.min(760, W - 32), cw = (full - gap) / 2, x0 = (W - full) / 2, top = host ? 204 : 128, rh = 48;
  for (let i = 0; i < MAX_ONLINE; i++) {
    const s = net.slots[i], c = P_COLORS[i];
    const rx = x0 + Math.floor(i / 4) * (cw + gap), y = top + (i % 4) * (rh + 8);
    panel(rx, y, cw, rh, s ? c : '#334', isMine(i));
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = s ? c : '#556'; ctx.font = 'bold 14px system-ui';
    ctx.fillText(`P${i + 1}${i === 0 ? ' (host)' : ''}${isMine(i) ? (net.mine.length > 1 ? ` — you · ${ctrlOf(i)}` : ' — you') : ''}`, rx + 50, y + 16);
    ctx.fillStyle = s ? '#dfe8ff' : '#556'; ctx.font = '12px system-ui';
    ctx.fillText(s ? shipById(s.ship).name + (isMine(i) ? '  · click to change' : '') : 'open slot…', rx + 50, y + 33);
    if (s) { ctx.save(); ctx.translate(rx + 25, y + 24); ctx.scale(0.65, 0.65); drawHull(shipById(s.ship).shape, c, 0, shipById(s.ship).mk2 === true, s.cos?.skin); ctx.restore(); }
    if (isMine(i) && s) buttons.push({ x: rx, y, w: cw, h: rh, action: () => openShipSelect(1, true, net.mine.indexOf(i)) }); // click your own slot to pick a ship
  }
  const by = top + 4 * (rh + 8) + 10, bw = Math.min(300, W - 32), bx = (W - bw) / 2;
  fitText(`Run: ${RUN_LABEL[runType]}${host ? ' [E]' : ''}${host ? `   ·   ${net.public ? `PUBLIC as "${net.roomName}"` : 'PRIVATE (code only)'}  [P]` : ''}`, by + 4, 13, RUN_COLOR[runType], 'bold');
  button('CHANGE MY SHIP  [C]', bx, by + 20, bw, 40, P_COLORS[me], () => openShipSelect(1, true));
  if (host) {
    const n = net.slots.length;
    const ready = net.conns.length > 0; // (needs at least one friend from another computer)
    button(ready ? `START  ·  ${n} PLAYERS  [Enter]` : 'WAITING FOR FRIENDS…', bx, by + 68, bw, 44, ready ? '#9dff5d' : '#667', startOnline);
  }
  button('LEAVE  [Esc]', bx, by + (host ? 120 : 68), bw, 40, '#ff5a70', () => leaveOnline());
  if (host) button(net.public ? 'PUBLIC: anyone can join, even mid-game  [P]' : 'PRIVATE: code only  [P]', bx, by + 168, bw, 36, net.public ? '#ffe93d' : '#9ab', togglePublic);
}

let last = performance.now(), fps = 60, beatT = 0, slowT = 0;
// if the game keeps running slowly, turn PERFORMANCE MODE on by itself (only once: it can be switched back off in Settings)
function autoPerf(raw) {
  if (settings.lowfx || settings.autoPerfDone || state !== 'play' || paused || document.hidden) { slowT = 0; return; }
  slowT = fps < 45 ? slowT + raw : Math.max(0, slowT - raw * 2);
  if (slowT < 4) return;
  settings.autoPerfDone = true; toggleSetting('lowfx');
  showToast('Running slowly: PERFORMANCE MODE is now ON (Settings to change)', 4);
}
// on your last life: a heartbeat you can hear (the red screen edges are in drawVignette)
function heartbeat(dt) {
  if (state !== 'play' || paused || !run) return;
  const mine = net.role ? players.filter(p => isMine(p.id)) : players;
  if (!mine.some(p => p?.alive && p.lives === 1 && maxLivesOf(p) > 1)) { beatT = 0; return; }
  if ((beatT -= dt) <= 0) { beatT = 0.9; beep(58, 0.12, 'sine', 0.09, -8); setTimeout(() => beep(50, 0.14, 'sine', 0.07, -8), 150); }
}
function loop(now) {
  // cap big hitches (tab switches) without slowing the game down on 30-50fps machines
  const raw = (now - last) / 1000, dt = Math.min(0.05, raw); last = now;
  if (raw > 0) fps += (1 / raw - fps) * 0.05; // (smoothed, for SHOW FPS)
  if (raw < 1) autoPerf(raw); // (ignore the huge gap after switching tabs)
  heartbeat(dt);
  dirTick(dt); // public lobby list
  if (net.role === 'guest' && net.playing) guestFrame(dt);
  else {
    if (net.role === 'host' && net.playing && run) smoothRemotePlayers();
    update(dt);
    if (net.role === 'host' && net.playing && run) hostTick(dt);
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
