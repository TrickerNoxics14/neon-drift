  lasers = s.lz.map(a => ({ x: a[0], warn: a[1], fire: a[2], w: a[3], color: a[4] }));
  // bosses: take the fresh state, but keep gliding their positions
  const oldB = new Map(bosses.map(b => [b.name, b]));
  bosses = s.bo.map(o => {
    // fold in the boss's fixed details (sent in full only now and then)
    if (o.style !== undefined) net.bossStatic.set(o.name, o);
    const st = net.bossStatic.get(o.name);
    if (!st) return null; // haven't received its details yet: skip it for a moment
    o = Object.assign({}, st, o);
    if (o.drain) o.drain.target = players[o.drain.target];
    let tr = net.btr.get(o.name); if (!tr) net.btr.set(o.name, tr = newTrack());
    trackPush(tr, s.ts, [o.x, o.y]);
    const prev = oldB.get(o.name); if (prev) { o.x = prev.x; o.y = prev.y; }
    return o;
  }).filter(Boolean);
  for (const name of net.btr.keys()) if (!bosses.some(b => b.name === name)) net.btr.delete(name);
  encounter = s.ec;
  offer = s.of ? { title: s.of.ti, bossReward: !!s.of.br, cards: s.of.c.map(id => UPGRADES.find(u => u.id === id)) } : null;
  hint = s.hi ? { text: s.hi[0], life: s.hi[1] } : null;
  popups = s.pp.map(a => ({ x: a[0], y: a[1], text: a[2], life: a[3], hot: !!a[4], color: a[5] || undefined }));
  for (const ev of s.ev) replayEvent(ev);
  if (net.rewarded && state !== 'over') { net.rewarded = false; run.paid = (run.paid || 0) + run.earned; } // the host carried on into Endless
  if (state === 'over' && !net.rewarded) { // guests earn shards too
    net.rewarded = true;
    run.earned = Math.max(0, runShards() - (run.paid || 0));
    meta.shards += run.earned; saveMeta();
  }
}
function replayEvent(ev) {
  switch (ev[0]) {
    case 'b': burst(ev[1], ev[2], ev[3], ev[4], ev[5]); break;
    case 'r': fxRing(ev[1], ev[2], ev[3], ev[4], ev[5], ev[6], ev[7], ev[8]); break;
    case 't': fxText(ev[1], ev[2], ev[3], ev[4], ev[5], ev[6]); break;
    case 'g': bossFx.ghosts.push({ x: ev[1], y: ev[2], rot: ev[3], sides: ev[4], r: ev[5], color: ev[6], life: ev[7], max: ev[7] }); break;
    case 'z': bossFx.zaps.push({ x1: ev[1], y1: ev[2], x2: ev[3], y2: ev[4], life: 0.2, max: 0.2 }); break;
    case 's': beep(ev[1], ev[2], ev[3], ev[4], ev[5]); break;
    case 'o': showToast(ev[1]); break;
    case 'h': if (ev[1] === net.myId) hurtFlash = Math.max(hurtFlash, ev[2]); break;
    case 'd': shatterFx(ev[1], ev[2], ev[3], ev[4], ev[5], ev[6]); break;
  }
}
// a guest's frame: move my own ship, glide everything else along until the next snapshot, run local effects
function guestFrame(dt) {
  updateBackground(dt); updateAchBanner(dt); updateMusicFilter();
  if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
  for (const s of stars) { s.y += s.z * dt * (state === 'play' && !paused ? 0.25 : 0.08); if (s.y > 1) { s.y = 0; s.x = Math.random(); } }
  if (net.soff !== undefined) {
    // "now" and "a moment ago" on the host's clock
    const hostNow = performance.now() - net.soff, rt = hostNow - INTERP_DELAY;
    // enemies, bosses and other players glide between updates
    for (const e of enemies) { const v = trackAt(net.etr.get(e.id), rt); if (v) { e.x = v[0]; e.y = v[1]; } }
    for (const b of bosses) { const v = trackAt(net.btr.get(b.name), rt); if (v) { b.x = v[0]; b.y = v[1]; } }
    players.forEach((p, i) => {
      if (i === net.myId || !p.alive) return;
      const v = trackAt(net.ptr[i], rt); if (v) [p.x, p.y, p.tilt, p.thrust] = v;
    });
    // bullets move in straight lines: draw them where they are right now (fair dodging), capped if updates stall
    const since = t0 => Math.min(0.25, Math.max(0, (hostNow - t0) / 1000));
    for (const b of bullets) { const k = since(b.t0); b.x = b.x0 + b.vx * k; b.y = b.y0 + b.vy * k; }
    for (const b of eBullets) { const k = since(b.t0); b.x = b.x0 + b.vx * k; b.y = b.y0 + b.vy * k; }
    for (const k of pickups) k.y = k.y0 + 90 * since(k.t0);
  }
  if (state === 'play' && !paused) {
    time += dt;
    for (const e of enemies) { e.t += dt; e.spin += dt * 2; }
    for (const b of bosses) b.t += dt;
    for (const pp of popups) { pp.life -= dt; pp.y -= 45 * dt; }
    if (hint) hint.life -= dt;
    hurtFlash = Math.max(0, hurtFlash - dt * 1.8);
    guestMove(dt);
  }
  updateParticles(dt);
  if ((net.sendT -= dt) <= 0 && net.host?.open) {
    net.sendT = INPUT_RATE;
    const p = players[net.myId];
    if (p && p.alive && state === 'play') net.host.send({ in: [Math.round(p.x), Math.round(p.y), r2(p.tilt || 0), r2(p.thrust || 0), Math.round(performance.now())] });
  }
}
function guestMove(dt) {
  const p = players[net.myId];
  if (!p || !p.alive) return;
  const pad = readPad(0), m = p.ship.mod, speed = run.s.speed * (m.speed || 1), ox = p.x, oy = p.y;
  let dx = 0, dy = 0;
  if (keys.KeyA || keys.ArrowLeft) dx--; if (keys.KeyD || keys.ArrowRight) dx++;
  if (keys.KeyW || keys.ArrowUp) dy--; if (keys.KeyS || keys.ArrowDown) dy++;
  if (pad && (pad.x || pad.y)) { dx = pad.x; dy = pad.y; }
  if (dx || dy) { const l = Math.max(1, Math.hypot(dx, dy)); p.x += dx / l * speed * dt; p.y += dy / l * speed * dt; }
  else if (pointer) {
    const k = 1 - Math.exp(-dt * 22), ty = pointer.y - (pointer.touch ? 50 : 0);
    p.x += (pointer.x - p.x) * k; p.y += (ty - p.y) * k;
  }
  p.x = Math.max(p.r, Math.min(W - p.r, p.x)); p.y = Math.max(p.r, Math.min(H - p.r, p.y));
  const kk = Math.min(1, dt * 12);
  p.tilt = (p.tilt || 0) + (Math.max(-1, Math.min(1, (p.x - ox) / dt / 500)) * 0.45 - (p.tilt || 0)) * kk;
  p.thrust = (p.thrust || 0) + (Math.max(0, Math.min(1, -(p.y - oy) / dt / 400)) - (p.thrust || 0)) * kk;
}

// ----- lobby: pick ships -----
// quick-cycle through every ship you can fly (A/D in the lobby); CHANGE SHIP opens the full picker
function cycleShip(d) {
  const list = flyableShips(), me = net.role === 'host' ? 0 : net.myId, slot = net.slots[me];
  if (!slot) return;
  const i = list.findIndex(s => s.id === slot.ship);
  setMyOnlineShip(list[(i + d + list.length) % list.length].id);
  beep(520, 0.08, 'triangle', 0.05);
}
function setMyOnlineShip(id) {
  const slot = net.slots[net.role === 'host' ? 0 : net.myId];
  if (!slot) return;
  slot.ship = id; lastShips[0] = id;
  try { localStorage.setItem('neonDriftShips', JSON.stringify(lastShips)); } catch (e) {}
  if (net.role === 'host') broadcastLobby(); else net.host?.send({ ship: id });
}

// ----- keys for the online screens -----
function onlineKey(e) {
  if (state === 'joinCode') {
    if (e.code === 'Escape') { go('online'); return true; }
    if (e.code === 'Backspace') { net.typed = net.typed.slice(0, -1); return true; }
    if (e.code === 'Enter') { if (net.typed.length === CODE_LEN) joinGame(net.typed); return true; }
    if (/^[0-9]$/.test(e.key)) typeCodeDigit(e.key); // number row or numpad
    return true;
  }
  if (state === 'online') {
    if (e.code === 'Escape') { go('menu'); return true; }
    return false; // arrows/Enter work the buttons as usual
  }
  if (state === 'lobby') {
    if (e.code === 'Escape') { leaveOnline(); return true; }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { cycleShip(-1); return true; }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { cycleShip(1); return true; }
    if (e.code === 'KeyC') { openShipSelect(1, true); return true; }
    if (net.role === 'host' && e.code === 'KeyE') { toggleRunType(); broadcastLobby(); return true; }
    if (net.role === 'host' && e.code === 'Enter') { startOnline(); return true; }
    return true;
  }
  if (net.role === 'guest' && net.playing) {
    if (e.code === 'Escape') { // press twice to leave
      if (performance.now() < net.leaveArm) leaveOnline('You left the game');
      else { net.leaveArm = performance.now() + 2000; showToast('Press Esc again to leave the game'); }
      return true;
    }
    if (e.code === 'KeyP') return true; // only the host can pause
    if (state === 'over') return true;  // the host decides what happens next
  }
  return false;
}

// ----- online screens -----
function drawOnline() {
  const cy = Math.max(170, H / 2 - 110), bw = Math.min(300, W - 32), bx = (W - bw) / 2;
  title('ONLINE CO-OP', cy - 80, '#9dff5d', 48);
  fitText('Play with up to 3 friends over the internet', cy - 34, 15, '#9ab');
  button('HOST A GAME', bx, cy, bw, 46, '#9dff5d', hostGame);
  button('JOIN A GAME', bx, cy + 56, bw, 46, '#7df9ff', () => { net.typed = ''; go('joinCode'); });
  button('BACK  [Esc]', bx, cy + 112, bw, 40, '#9ab', () => go('menu'));
  ctx.font = '13px system-ui';
  wrap('Everyone needs an internet connection and this same version of the game. The host runs the game; friends join with a 4-digit room code. Some strict networks (like school or work) can block the connection.', Math.min(460, W - 40))
    .forEach((l, i) => fitText(l, cy + 180 + i * 18, 13, '#789'));
}
// typing the last digit joins straight away
function typeCodeDigit(d) {
  if (net.typed.length >= CODE_LEN) return;
  net.typed += d; beep(700 + net.typed.length * 60, 0.05, 'triangle', 0.04);
  if (net.typed.length === CODE_LEN) joinGame(net.typed);
}
function drawJoin() {
  const top = Math.max(120, H / 2 - 230), bw = Math.min(300, W - 32), bx = (W - bw) / 2;
  title('JOIN A GAME', top, '#7df9ff', 44);
  fitText('Type the 4-digit room code — it joins as soon as you finish', top + 40, 14, '#9ab');
  const boxW = Math.min(300, W - 32), boxX = (W - boxW) / 2, cy = top + 64;
  panel(boxX, cy, boxW, 64, '#7df9ff', true);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.font = '900 38px system-ui';
  const blink = Math.floor(performance.now() / 500) % 2 ? '_' : ' ';
  ctx.fillText((net.typed + (net.typed.length < CODE_LEN ? blink : '')).padEnd(CODE_LEN, ' ').split('').join('  '), W / 2, cy + 34);
  // on-screen number pad (for mouse or touchscreen)
  const kw = Math.min(90, (bw - 16) / 3), kh = 46, kx = (W - (kw * 3 + 16)) / 2, ky = cy + 80;
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', 'C'].forEach((k, i) => {
    const x = kx + (i % 3) * (kw + 8), y = ky + Math.floor(i / 3) * (kh + 8);
    const act = k === '⌫' ? () => { net.typed = net.typed.slice(0, -1); } : k === 'C' ? () => { net.typed = ''; } : () => typeCodeDigit(k);
    button(k, x, y, kw, kh, /\d/.test(k) ? '#7df9ff' : '#9ab', act);
  });
  button('BACK  [Esc]', bx, ky + 4 * (kh + 8) + 6, bw, 40, '#9ab', () => go('online'));
}
function drawLobby() {
  const host = net.role === 'host', me = host ? 0 : net.myId;
  title('ONLINE LOBBY', 56, '#9dff5d', 44);
  fitText(net.status + (net.peer ? (relayOn ? '  ·  relay ON' : '  ·  direct only') : ''), 96, 14, '#9ab');
  if (host && net.code) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    fitText('ROOM CODE', 128, 13, '#9dff5d', 'bold');
    glow('#9dff5d', 20); fitText(net.code.split('').join(' '), 166, 44, '#ffffff', '900'); ctx.shadowBlur = 0;
  }
  // 8 slots in two columns of 4
  const gap = 10, full = Math.min(760, W - 32), cw = (full - gap) / 2, x0 = (W - full) / 2, top = host ? 204 : 128, rh = 48;
  for (let i = 0; i < MAX_ONLINE; i++) {
    const s = net.slots[i], c = P_COLORS[i];
    const rx = x0 + Math.floor(i / 4) * (cw + gap), y = top + (i % 4) * (rh + 8);
    panel(rx, y, cw, rh, s ? c : '#334', i === me);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = s ? c : '#556'; ctx.font = 'bold 14px system-ui';
    ctx.fillText(`P${i + 1}${i === 0 ? ' (host)' : ''}${i === me ? ' — you' : ''}`, rx + 50, y + 16);
    ctx.fillStyle = s ? '#dfe8ff' : '#556'; ctx.font = '12px system-ui';
    ctx.fillText(s ? shipById(s.ship).name + (i === me ? '  · click to change' : '') : 'open slot…', rx + 50, y + 33);
    if (s) { ctx.save(); ctx.translate(rx + 25, y + 24); ctx.scale(0.65, 0.65); drawHull(shipById(s.ship).shape, c, 0, shipById(s.ship).mk2 === true); ctx.restore(); }
    if (i === me && s) buttons.push({ x: rx, y, w: cw, h: rh, action: () => openShipSelect(1, true) }); // click your own slot to pick a ship
  }
  const by = top + 4 * (rh + 8) + 10, bw = Math.min(300, W - 32), bx = (W - bw) / 2;
  fitText(`Run: ${runType === 'endless' ? 'ENDLESS ∞' : 'STANDARD'}${host ? '  [E] to change' : ''}`, by + 4, 13, runType === 'endless' ? '#ff9a3d' : '#9ab', 'bold');
  button('CHANGE MY SHIP  [C]', bx, by + 20, bw, 40, P_COLORS[me], () => openShipSelect(1, true));
  if (host) {
    const n = net.slots.length;
    button(n > 1 ? `START  ·  ${n} PLAYERS  [Enter]` : 'WAITING FOR FRIENDS…', bx, by + 68, bw, 44, n > 1 ? '#9dff5d' : '#667', startOnline);
  }
  button('LEAVE  [Esc]', bx, by + (host ? 120 : 68), bw, 40, '#ff5a70', () => leaveOnline());
}

let last = performance.now();
function loop(now) {
  // cap big hitches (tab switches) without slowing the game down on 30-50fps machines
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (net.role === 'guest' && net.playing) guestFrame(dt);
  else {
    if (net.role === 'host' && net.playing && run) smoothRemotePlayers();
    update(dt);
    if (net.role === 'host' && net.playing && run) hostTick(dt);
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
