      for (const [col, f] of [['rgba(255,200,40,0.45)', 1], ['rgba(255,250,200,0.5)', 0.55]]) {
        ctx.fillStyle = col; ctx.beginPath();
        for (let i = 0; i < 14; i++) {
          const a = i / 14 * TAU, L = r * f * k * (0.45 + 0.25 * Math.sin(b.t * 10 + i * 2.3));
          ctx.moveTo(Math.cos(a - 0.2) * r * 0.85, Math.sin(a - 0.2) * r * 0.85);
          ctx.lineTo(Math.cos(a) * (r + L), Math.sin(a) * (r + L) - L * 0.6);
          ctx.lineTo(Math.cos(a + 0.2) * r * 0.85, Math.sin(a + 0.2) * r * 0.85);
        }
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      rageEmbers(b, r, 14, ['#fff7c0', '#ffd23d', '#ffffff']);
    },
    fill: (b, k, r) => litFill(r, '#ffd23d', k),
  },
  doki: { // POSSESSED: her heart breaks in two (see BOSS_SHAPES.doki), dark red inside; a red haze, a glow along the crack, and
    // drops of red falling from the break
    back(b, k, tr, r) {
      rageHaze(r, r * 2.1, '150,0,30', 0.4 * k);
      for (let i = 0; i < 3; i++) { const ph = (b.t * 0.7 + i * 0.33) % 1; ctx.globalAlpha = k * (1 - ph); drip(Math.sin(i * 5.1) * r * 0.12, r * 0.85 + ph * r * 1.3, r * 0.06, '#ff1f3d'); }
    },
    shell(b, k, tr, r) { // a red glow running down the crack between the halves
      const s = r * 0.95, y = r * 0.05;
      ctx.strokeStyle = '#ff1f3d'; glow('#ff1f3d', 22); ctx.lineWidth = 2 + k * 2; ctx.globalAlpha = 0.5 + Math.sin(b.t * 9) * 0.25;
      ctx.beginPath(); DOKI_CRACK.forEach(([cy, cx], i) => ctx[i ? 'lineTo' : 'moveTo'](cx * s, y + cy * s)); ctx.stroke();
    },
    fill: () => 'rgba(64,0,16,0.9)',
  },
  nemesis: { // PLAYER ZERO: it glitches into copies of itself in every player's color, and its hull burns a deep red
    back(b, k, tr, r) {
      ctx.rotate(bossRot(b)); ctx.lineWidth = 2; ctx.shadowBlur = 0;
      P_COLORS.slice(0, Math.max(2, players.length)).forEach((c, i) => {
        const j = (5 + Math.random() * 7) * k * (2 - tr), a = i * 2.4 + b.t * 3;
        ctx.save(); ctx.translate(Math.cos(a) * j, Math.sin(a) * j); ctx.strokeStyle = hexA(c, 0.55 * k);
        BOSS_SHAPES.nemesis.path(r, b); ctx.stroke(); ctx.restore();
      });
    },
    fill: () => 'rgba(48,0,10,0.88)',
  },
  lancer: { // BERSERK: it spins itself into a frenzy (see drawBoss), grows saw teeth, and a jet of fire roars out its back
    shell(b, k, tr, r) {
      ctx.fillStyle = '#ff3a2a'; glow('#ff2a1a', 12);
      for (const s of [-1, 1]) for (let i = 1; i <= 4; i++) { // teeth along both front edges
        const f = i / 5, x = 1.4 - f * 1.25, y = s * f * 0.72;
        ctx.beginPath(); ctx.moveTo(x * r, y * r); ctx.lineTo((x - 0.14) * r, (y + s * 0.03) * r); ctx.lineTo((x - 0.02) * r, (y + s * 0.2 * k) * r); ctx.closePath(); ctx.fill();
      }
      const L = r * (0.7 + Math.random() * 0.5) * k; // the jet
      ctx.globalCompositeOperation = 'lighter'; ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,80,30,0.75)'; ctx.beginPath(); ctx.moveTo(-0.62 * r, -0.24 * r); ctx.lineTo(-0.62 * r - L, 0); ctx.lineTo(-0.62 * r, 0.24 * r); ctx.fill();
      ctx.fillStyle = 'rgba(255,220,120,0.85)'; ctx.beginPath(); ctx.moveTo(-0.62 * r, -0.1 * r); ctx.lineTo(-0.62 * r - L * 0.55, 0); ctx.lineTo(-0.62 * r, 0.1 * r); ctx.fill();
    } },

  storm: { // TEMPEST: a black thunderhead lit from inside, rain pouring out beneath it, and bolts slamming into it as it transforms
    fill(b, k) { return Math.random() < 0.07 * k ? 'rgba(190,215,255,0.6)' : `rgba(3,5,16,${0.75 + 0.22 * k})`; },
    back(b, k, tr, r) {
      const A = ctx.globalAlpha;
      ctx.strokeStyle = '#9db8ff'; ctx.lineWidth = 1.5; ctx.globalAlpha = A * 0.55 * k; ctx.beginPath();
      for (let i = 0; i < 16; i++) { const x = Math.sin(i * 12.9) * 1.1 * r, ph = (b.t * 1.7 + i * 0.137) % 1, y = 0.45 * r + ph * 1.7 * r; ctx.moveTo(x, y); ctx.lineTo(x - 0.06 * r, y + 0.22 * r); }
      ctx.stroke(); ctx.globalAlpha = A;
      if (tr < 1 && Math.random() < 0.55) { // a bolt from the sky
        ctx.strokeStyle = '#ffffff'; glow('#7df9ff', 30); ctx.lineWidth = 4;
        let x = (Math.random() - 0.5) * r * 3, y = -r * 9; ctx.beginPath(); ctx.moveTo(x, y);
        for (let i = 1; i <= 10; i++) { x += -x / (11 - i) + (Math.random() - 0.5) * r * 0.6; y += (-0.4 * r - y) / (11 - i); ctx.lineTo(x, y); }
        ctx.stroke();
      }
    } },

  hive: { // QUEEN'S WRATH: a furious swarm that bursts out of it and buzzes around, honey dripping, and a golden crown
    back(b, k, tr, r) {
      const A = ctx.globalAlpha, out = tr < 1 ? Math.sin(tr * Math.PI) * 2.2 : 0;
      for (let i = 0; i < 16; i++) {
        const a = b.t * (1.5 + (i % 5) * 0.3) * (i % 2 ? 1 : -1) + i * 1.7, R = r * ((1.35 + (i % 4) * 0.18 + Math.sin(b.t * 7 + i) * 0.08) * k + out);
        const x = Math.cos(a) * R, y = Math.sin(a) * R * 0.8;
        ctx.globalAlpha = A * k; ctx.fillStyle = '#ffe93d'; ctx.beginPath(); ctx.ellipse(x, y, 3.5, 2.2, a, 0, TAU); ctx.fill();
        if (Math.floor(b.t * 30 + i) % 2) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(x - 1, y - 3.5, 2, 2); } // (beating wings)
      }
      if (b.super) { // THE QUEEN's two pairs of wings, a blur of beating
        ctx.globalAlpha = A; ctx.strokeStyle = '#fff3b0'; ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1.5; glow('#ffe93d', 10);
        const beat = 0.75 + Math.abs(Math.sin(b.t * 32)) * 0.25;
        for (const s of [-1, 1]) for (const [ang, len] of [[-0.45, 1.15], [0.2, 0.85]]) { // (a big pair angled up, a small pair below)
          ctx.save(); ctx.translate(s * 0.25 * r, -0.36 * r); ctx.rotate(s > 0 ? ang : Math.PI - ang); ctx.scale(1, beat);
          ctx.beginPath(); ctx.ellipse(len * r * 0.5, 0, len * r * 0.5, 0.2 * r, 0, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore();
        }
        return;
      }
      for (let i = 0; i < 2; i++) { const ph = (b.t * 0.6 + i * 0.5) % 1; ctx.globalAlpha = A * k * (1 - ph); drip((i - 0.5) * 0.2 * r, 0.88 * r + ph * 0.9 * r, 0.06 * r, '#ffc23d'); }
    },
    front(b, k, tr, r) {
      if (b.super) { // THE QUEEN's antennae, curling out from under her crown
        ctx.strokeStyle = '#ffe93d'; ctx.fillStyle = '#ffe93d'; ctx.lineWidth = 2; glow('#ffd23d', 10);
        for (const s of [-1, 1]) {
          const tx = s * 0.55 * r, ty = -1.36 * r + Math.sin(b.t * 4 + s) * 0.04 * r;
          ctx.beginPath(); ctx.moveTo(s * 0.12 * r, -0.98 * r); ctx.quadraticCurveTo(s * 0.2 * r, -1.35 * r, tx, ty); ctx.stroke();
          ctx.beginPath(); ctx.arc(tx, ty, 0.06 * r, 0, TAU); ctx.fill();
        }
      }
      const y = -1.12 * r - 0.05 * r * Math.sin(b.t * 3), w = 0.42 * r, h = 0.34 * r * k;
      ctx.fillStyle = '#ffd23d'; ctx.strokeStyle = '#fff3b0'; glow('#ffd23d', 16); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-w, y); ctx.lineTo(-w, y - h * 0.6); ctx.lineTo(-w * 0.5, y - h * 0.25); ctx.lineTo(0, y - h); ctx.lineTo(w * 0.5, y - h * 0.25); ctx.lineTo(w, y - h * 0.6); ctx.lineTo(w, y); ctx.closePath(); ctx.fill(); ctx.stroke();
    } },

  phantom: { noEye: true, // POSSESSED: it strobes as it's taken over (see drawBoss), then hollow sockets burn where its eye was, and soul-fire streams off it
    back(b, k, tr, r) {
      ctx.globalCompositeOperation = 'lighter'; ctx.shadowBlur = 0;
      for (let i = 0; i < 6; i++) {
        const ph = (b.t * 1.2 + i * 0.19) % 1, x = (i - 2.5) * 0.28 * r + Math.sin(b.t * 4 + i) * 6, y = -0.85 * r - ph * r;
        ctx.fillStyle = `rgba(190,90,255,${(1 - ph) * 0.55 * k})`; ctx.beginPath(); ctx.arc(x, y, (1 - ph) * 0.2 * r, 0, TAU); ctx.fill();
      }
    },
    front(b, k, tr, r, coreR, ex, ey) {
      for (const s of [-1, 1]) {
        const x = ex + s * 0.32 * r, y = ey;
        ctx.shadowBlur = 0; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(x, y, 0.17 * r * k, 0.25 * r * k, s * 0.3, 0, TAU); ctx.fill();
        glow('#ff2a2a', 14); ctx.fillStyle = '#ff3a3a'; ctx.beginPath(); ctx.arc(x + b.look.x * 0.06 * r, y + b.look.y * 0.08 * r, 0.055 * r * k * (0.8 + Math.random() * 0.4), 0, TAU); ctx.fill();
      }
    } },

  echo: { // FEEDBACK: its outline turns to a jagged sawtooth (see its shape), a red audio meter thrashes around it, and it blasts out sound rings as it transforms
    back(b, k, tr, r) {
      ctx.fillStyle = '#ff3a4a'; glow('#ff2a3a', 10);
      for (let i = 0; i < 28; i++) {
        const a = i / 28 * TAU, h = r * (0.15 + Math.abs(Math.sin(b.t * 9 + i * 1.7) * Math.sin(b.t * 3.3 + i)) * 0.7) * k;
        ctx.save(); ctx.rotate(a); ctx.fillRect(r * 1.12, -0.05 * r, h, 0.1 * r); ctx.restore();
      }
      if (tr < 1) {
        const A = ctx.globalAlpha; ctx.lineWidth = 4;
        for (let j = 0; j < 4; j++) { const p = (tr * 2 + j * 0.25) % 1; ctx.strokeStyle = j % 2 ? '#ffffff' : '#ff3a4a'; ctx.globalAlpha = A * (1 - p); ctx.beginPath(); ctx.arc(0, 0, r * (1 + p * 4), 0, TAU); ctx.stroke(); }
      }
    } },

  chronos: { // TIME UNBOUND: its hands spin wildly, then run backwards (see its decor), its glass cracks, and cogs tear loose to orbit it
    back(b, k, tr, r) {
      ctx.strokeStyle = b.color; ctx.lineWidth = 2; glow(b.color, 12);
      for (let i = 0; i < 2; i++) {
        const a = -b.t * 0.9 + i * Math.PI, R = r * 1.6 * k;
        ctx.save(); ctx.translate(Math.cos(a) * R, Math.sin(a) * R * 0.85); ctx.rotate(b.t * 3 * (i ? -1 : 1));
        ctx.beginPath(); for (let j = 0; j < 20; j++) { const aa = j / 20 * TAU, rr = r * (j % 2 ? 0.22 : 0.3); ctx.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr); } ctx.closePath(); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, r * 0.08, 0, TAU); ctx.stroke(); ctx.restore();
      }
    },
    shell(b, k, tr, r) { // cracks spreading across its glass
      const g = Math.min(1, tr * 1.3);
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5; glow('#ffffff', 8); ctx.beginPath();
      for (const [a, l, bend] of [[0.6, 0.9, 0.4], [2.4, 0.8, -0.5], [4.1, 0.85, 0.3], [5.3, 0.6, -0.4]]) {
        ctx.moveTo(Math.cos(a) * r * 0.12, Math.sin(a) * r * 0.12);
        ctx.lineTo(Math.cos(a + bend * 0.3) * r * l * 0.55 * g, Math.sin(a + bend * 0.3) * r * l * 0.55 * g);
        ctx.lineTo(Math.cos(a + bend) * r * l * g, Math.sin(a + bend) * r * l * g);
      }
      ctx.stroke();
    } },

  wyrm: { // INFERNO: a mane of fire streams back off its head, and its whole body catches fire, head to tail (see drawWyrmBody)
    shell(b, k, tr, r) {
      ctx.globalCompositeOperation = 'lighter'; ctx.shadowBlur = 0;
      for (let i = 0; i < 6; i++) {
        const y = (i - 2.5) * 0.3 * r, L = r * (0.8 + Math.sin(b.t * 14 + i * 2) * 0.3) * k;
        ctx.fillStyle = b.super ? (i % 2 ? 'rgba(170,255,120,0.55)' : 'rgba(60,220,110,0.6)') : i % 2 ? 'rgba(255,200,60,0.6)' : 'rgba(255,70,20,0.65)';
        ctx.beginPath(); ctx.moveTo(-0.45 * r, y - 0.13 * r);
        ctx.quadraticCurveTo(-0.9 * r - L * 0.5, y + Math.sin(b.t * 9 + i) * 0.25 * r, -0.95 * r - L, y + Math.sin(b.t * 6 + i) * 0.2 * r);
        ctx.quadraticCurveTo(-0.9 * r - L * 0.4, y, -0.45 * r, y + 0.13 * r); ctx.fill();
      }
      ctx.fillStyle = b.super ? 'rgba(140,255,110,0.7)' : 'rgba(255,150,40,0.7)'; // smoke and sparks from its nostrils (ghost fire, as the BONE WYRM)
      for (let i = 0; i < 3; i++) { const ph = (b.t * 2 + i / 3) % 1; ctx.beginPath(); ctx.arc((1.2 + ph * 0.6) * r, (i - 1) * 0.12 * r * (1 + ph), (1 - ph) * 0.1 * r, 0, TAU); ctx.fill(); }
    } },

  architect: { // DEMOLITION: its tiers fly apart and slam back together, then hover apart (see its shape), with hazard stripes and a warning beacon
    shell(b, k, tr, r) {
      ctx.save(); ctx.beginPath(); ctx.rect(-r, 0.35 * r, 2 * r, 0.45 * r); ctx.clip(); ctx.shadowBlur = 0; ctx.fillStyle = `rgba(255,210,40,${0.55 * k})`;
      for (let x = -1.5; x < 1.2; x += 0.3) { ctx.beginPath(); ctx.moveTo(x * r, 0.8 * r); ctx.lineTo((x + 0.15) * r, 0.8 * r); ctx.lineTo((x + 0.4) * r, 0.35 * r); ctx.lineTo((x + 0.25) * r, 0.35 * r); ctx.fill(); }
      ctx.restore();
    },
    front(b, k, tr, r) { // a warning beacon spinning on top
      const y = (-0.65 - 2 * archGap(b, k)) * r, a = b.t * 6, on = Math.cos(a) > 0;
      ctx.fillStyle = on ? '#ff3a2a' : '#7a1010'; glow('#ff2a1a', on ? 25 : 5);
      ctx.beginPath(); ctx.arc(0, y, 0.12 * r, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.globalCompositeOperation = 'lighter'; ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,60,40,0.25)';
      for (const s of [-1, 1]) { const d = s * Math.cos(a); if (d <= 0) continue; ctx.beginPath(); ctx.moveTo(0, y - 0.06 * r); ctx.lineTo(s * r * 1.6 * d, y - 0.35 * r); ctx.lineTo(s * r * 1.6 * d, y + 0.2 * r); ctx.fill(); }
    } },

  oracle: { // ALL-SEEING: its eyelids snap wide open (see oracleOpen), it turns bloodshot, a third eye opens above it, and its little eyes swell up red (see its decor)
    back(b, k, tr, r) { // THE HUNDRED EYES: rings of little eyes all around it, opening one after another, each blinking on its own and watching you
      if (!b.super) return;
      const eyes = oracleEyes(b), open = Math.min(1, tr * 1.2), A = ctx.globalAlpha;
      ctx.shadowBlur = 0;
      eyes.forEach(([x, y], i) => {
        if (i / eyes.length > open) return;
        const blink = ((b.t + i * 0.37) % (2.5 + (i % 5) * 0.4)) < 0.12 ? 0.15 : 1, w = 5 + (i % 3), h = (2.8 + (i % 2)) * blink;
        ctx.globalAlpha = A * 0.85; ctx.fillStyle = '#ffe8ff'; ctx.strokeStyle = '#ff8dff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(x, y, w, h, 0, 0, TAU); ctx.fill(); ctx.stroke();
        if (blink < 1) return;
        ctx.fillStyle = '#ff2a8a'; ctx.beginPath(); ctx.arc(x + b.look.x * w * 0.35, y + b.look.y * h * 0.35, h * 0.75, 0, TAU); ctx.fill();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x + b.look.x * w * 0.35, y + b.look.y * h * 0.35, h * 0.35, 0, TAU); ctx.fill();
      });
      ctx.globalAlpha = A;
    },
    shell(b, k, tr, r) {
      ctx.save(); BOSS_SHAPES.oracle.path(r, b); ctx.clip();
      ctx.strokeStyle = '#ff2a3a'; ctx.lineWidth = 1.5; ctx.shadowBlur = 0; ctx.globalAlpha *= 0.8 * k; ctx.beginPath();
      for (let i = 0; i < 9; i++) { // veins creeping in from the corners
        const s = i % 2 ? 1 : -1, y0 = (Math.sin(i * 3.1) * 0.4) * r;
        ctx.moveTo(s * 1.3 * r, y0 * 0.2); ctx.quadraticCurveTo(s * 0.95 * r, y0 + Math.sin(b.t + i) * 4, s * (0.55 + (i % 3) * 0.06) * r, y0 * 0.7);
        ctx.lineTo(s * (0.48 + (i % 3) * 0.05) * r, y0 * 0.7 + (i % 2 ? 6 : -6));
      }
      ctx.stroke(); ctx.restore();
    },
    front(b, k, tr, r) { // the third eye
      const y = -1.25 * r, w = 0.38 * r, h = 0.2 * r * k * (((b.t + 1.3) % 3.1) < 0.12 ? 0.1 : 1);
      ctx.fillStyle = '#ffe0f0'; ctx.strokeStyle = b.color; ctx.lineWidth = 2; glow(b.color, 14);
      ctx.beginPath(); ctx.moveTo(-w, y); ctx.quadraticCurveTo(0, y - h * 2, w, y); ctx.quadraticCurveTo(0, y + h * 2, -w, y); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.save(); ctx.clip(); ctx.fillStyle = '#ff2a3a'; ctx.beginPath(); ctx.arc(b.look.x * w * 0.3, y + b.look.y * h * 0.3, w * 0.42, 0, TAU); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(b.look.x * w * 0.3, y + b.look.y * h * 0.3, w * 0.1, w * 0.3, 0, 0, TAU); ctx.fill(); ctx.restore();
    } },

  singularity: { // COLLAPSE: it shrinks to a pinpoint and bursts back (see scale), its disk burns red (see its decor), jets blast from its poles, and a photon ring blazes around it
    scale: (b, k, tr) => tr >= 1 ? 1 : tr < 0.625 ? 1 - Math.sin(tr / 0.625 * Math.PI) * 0.6 : 1 + Math.sin((tr - 0.625) / 0.375 * Math.PI) * 0.25,
    back(b, k, tr, r) {
      ctx.globalCompositeOperation = 'lighter'; ctx.shadowBlur = 0;
      for (const s of [-1, 1]) {
        const L = r * (2.6 + Math.sin(b.t * 13) * 0.25) * k, g = ctx.createLinearGradient(0, 0, 0, s * L);
        g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.3, 'rgba(255,120,60,0.6)'); g.addColorStop(1, 'rgba(255,60,30,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-0.12 * r, 0); ctx.lineTo(-0.04 * r, s * L); ctx.lineTo(0.04 * r, s * L); ctx.lineTo(0.12 * r, 0); ctx.fill();
      }
    },
    front(b, k, tr, r) {
      ctx.strokeStyle = '#ffd2a0'; glow('#ff7a3d', 22); ctx.lineWidth = 2 + Math.sin(b.t * 20) * 0.8; ctx.globalAlpha *= k;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.56, 0, TAU); ctx.stroke();
    } },

  leech: { // BLOODLUST: swollen with blood and throbbing like a heart, dark veins over its skin, blood dripping from its tendrils
    scale(b, k) { const ph = (b.t * 1.3) % 1; return 1 + k * (0.06 + 0.1 * Math.exp(-ph * 16) + (ph > 0.2 ? 0.06 * Math.exp(-(ph - 0.2) * 16) : 0)); }, // (lub-dub)
    fill(b, k, r) {
      const g = ctx.createRadialGradient(0, 0.2 * r, 0, 0, 0.2 * r, r * 1.2);
      g.addColorStop(0, `rgba(170,0,30,${0.85 * k})`); g.addColorStop(1, `rgba(40,0,8,${0.75 + 0.2 * k})`);
      return g;
    },
    shell(b, k, tr, r) {
      ctx.save(); BOSS_SHAPES.leech.path(r); ctx.clip();
      ctx.strokeStyle = '#3a0008'; ctx.lineWidth = 2.5; ctx.shadowBlur = 0; ctx.globalAlpha *= k; ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU + 0.3, x0 = Math.cos(a) * 0.9 * r, y0 = 0.3 * r + Math.sin(a) * 0.9 * r;
        ctx.moveTo(x0, y0); ctx.quadraticCurveTo(x0 * 0.5 + 6, y0 * 0.6, x0 * 0.25, y0 * 0.35 + 0.15 * r); ctx.moveTo(x0 * 0.55, y0 * 0.6); ctx.lineTo(x0 * 0.55 + (i % 2 ? 9 : -9), y0 * 0.6 - 7);
      }
      ctx.stroke(); ctx.restore();
    },
    back(b, k, tr, r) {
      const A = ctx.globalAlpha;
      for (let i = 0; i < 6; i++) { // blood dripping off the ends of its tendrils
        const base = Math.PI * (0.15 + i * 0.14), ph = (b.t * 0.8 + i * 0.37) % 1, x = Math.cos(base) * r * 0.8 + Math.cos(base) * r * 0.3;
        ctx.globalAlpha = A * k * (1 - ph); drip(x, Math.sin(base) * r * 0.8 + r * (1.6 + (i % 2) * 0.4) + ph * r * 1.2, 0.06 * r, '#ff2d55');
      }
      if (tr < 1) { // blood spraying out as it swells
        ctx.globalAlpha = A * (1 - tr); ctx.fillStyle = '#ff2d55';
        for (let i = 0; i < 14; i++) { const a = i / 14 * TAU + i, d = r * (1 + tr * 2.2 * (0.6 + (i % 3) * 0.2)); ctx.beginPath(); ctx.arc(Math.cos(a) * d, Math.sin(a) * d, 0.06 * r, 0, TAU); ctx.fill(); }
      }
    } },

  dawnny: {
    scale: b => 1 + Math.sin(b.t * 40) * 0.015,
    back(b, k, tr, r) {

        ctx.fillStyle = '#5a6878'; ctx.fillRect(x - 4, y + 10, 8, 6); ctx.fillRect(x - 12, y + 15, 24, 3);
        ctx.shadowBlur = 0; ctx.fillStyle = done ? '#5dff7a' : '#3dd8ff';
        if (done) { ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('✓', x, y - 3); }
        else for (let i = 0; i < 4; i++) ctx.fillRect(x - 14, y - 12 + i * 5, (6 + ((i * 7 + Math.floor(t * 6)) % 18)) * Math.max(0.3, p), 2); // (lines of code scrolling)
        ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(x - 22, y + 22, 44, 5); ctx.fillStyle = done ? '#5dff7a' : '#3dd8ff'; ctx.fillRect(x - 22, y + 22, 44 * p, 5);
        ctx.restore();
      }
      break;
    case 'zero':
      if (b.grid) { // the beam grid: flickering guides, then solid white beams
        const g = b.grid, live = g.t >= GRID_WARN, k = Math.min(1, g.t / GRID_WARN);
        ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff';
        if (!live) { ctx.globalAlpha = 0.25 + k * 0.4 + (Math.floor(t * 16) % 2) * 0.15; ctx.lineWidth = 1.5; ctx.setLineDash([4, 6]); }
        else { glow('#7df9ff', 30); ctx.globalAlpha = 0.9; }
        for (const x of g.v) live ? ctx.fillRect(x - GRID_W / 2, 0, GRID_W, H) : (ctx.beginPath(), ctx.moveTo(x, 0), ctx.lineTo(x, H), ctx.stroke());
        for (const y of g.h) live ? ctx.fillRect(0, y - GRID_W / 2, W, GRID_W) : (ctx.beginPath(), ctx.moveTo(0, y), ctx.lineTo(W, y), ctx.stroke());
        if (!live) { ctx.globalAlpha = 0.06 + k * 0.08; for (const x of g.v) ctx.fillRect(x - GRID_W / 2, 0, GRID_W, H); for (const y of g.h) ctx.fillRect(0, y - GRID_W / 2, W, GRID_W); }
      }
      if (b.invW > 0 && Math.random() < 0.5) label('ERROR', '#ff3df2', b.y + b.r * 1.7);
      break;
    case 'storm':
      for (const s of b.strikes || []) {
        const [x, y, age, quick] = s;
        if (age < 0) continue; // (TEMPEST's strikes waiting their turn)
        if (quick && age >= STRIKE_WARN + STRIKE_BOLT) continue;
        if (age < STRIKE_WARN) { // target circle closing in
          const k = age / STRIKE_WARN;
          ctx.globalAlpha = 0.35 + k * 0.5; ctx.strokeStyle = '#d8f4ff'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
          ctx.beginPath(); ctx.arc(x, y, STRIKE_R * (1.6 - k * 0.6), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
          ctx.globalAlpha = 0.08 + k * 0.15; ctx.fillStyle = '#7da8ff'; ctx.beginPath(); ctx.arc(x, y, STRIKE_R, 0, Math.PI * 2); ctx.fill();
        } else if (age < STRIKE_WARN + STRIKE_BOLT) { // the bolt from the sky
          ctx.globalAlpha = 1; glow('#7df9ff', 40); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5;
          ctx.beginPath(); ctx.moveTo(x + (Math.random() - 0.5) * 40, 0);
          for (let i = 1; i < 12; i++) ctx.lineTo(x + (Math.random() - 0.5) * 50 * (1 - i / 12), y * i / 12);
          ctx.lineTo(x, y); ctx.stroke();
          ctx.globalAlpha = 0.5; ctx.fillStyle = '#d8f4ff'; ctx.beginPath(); ctx.arc(x, y, STRIKE_R, 0, Math.PI * 2); ctx.fill();
        } else { // crackling static left behind
          const fade = Math.min(1, (STRIKE_END - age) * 2);
          ctx.globalAlpha = 0.15 * fade; ctx.fillStyle = '#5d8dff'; ctx.beginPath(); ctx.arc(x, y, STATIC_R, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 0.8 * fade; ctx.strokeStyle = '#d8f4ff'; ctx.lineWidth = 1.5; glow('#7df9ff', 10);
          for (let i = 0; i < 3; i++) {
            const a = Math.random() * Math.PI * 2; ctx.beginPath(); ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(a + 0.4) * STATIC_R * 0.5, y + Math.sin(a + 0.4) * STATIC_R * 0.5);
            ctx.lineTo(x + Math.cos(a) * STATIC_R, y + Math.sin(a) * STATIC_R); ctx.stroke();
          }
        }
      }
      break;
  }
  ctx.restore();
}

function drawBossFx(layer) {
  if (layer === 'under') {
    for (const g of bossFx.ghosts) {
      const p = g.life / g.max;
      ctx.save(); ctx.translate(g.x, g.y); ctx.scale(1 + (1 - p) * 0.25, 1 + (1 - p) * 0.25);
      ctx.globalAlpha = p * 0.45; ctx.strokeStyle = g.color; ctx.lineWidth = 2; glow(g.color, 15);
      bossPath({ shape: g.shape, sides: g.sides, t: g.t, super: g.super }, g.r, g.rot); ctx.stroke();
      ctx.restore();
    }
    return;
  }
  for (const r of bossFx.rings) {
    if (r.delay > 0) continue;
    const p = 1 - r.life / r.max;
    ctx.save(); ctx.globalAlpha = 1 - p; ctx.strokeStyle = r.color; ctx.lineWidth = r.w * (1 - p * 0.6); glow(r.color, 20);
    ctx.beginPath(); ctx.arc(r.x, r.y, Math.max(1, r.from + (r.to - r.from) * easeOut(p)), 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  for (const s of bossFx.shards) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.globalAlpha = Math.min(1, s.life / s.max * 1.5); ctx.strokeStyle = s.color; ctx.lineWidth = 3; glow(s.color, 15);
    ctx.beginPath(); ctx.moveTo(-s.len / 2, 0); ctx.lineTo(s.len / 2, 0); ctx.stroke();
    ctx.restore();
  }
  for (const z of bossFx.zaps) { // chain lightning arcs
    ctx.save(); ctx.globalAlpha = z.life / z.max; ctx.strokeStyle = '#d8f4ff'; ctx.lineWidth = 2.5; glow('#7df9ff', 15);
    ctx.beginPath(); ctx.moveTo(z.x1, z.y1);
    for (let i = 1; i < 6; i++) {
      const t = i / 6;
      ctx.lineTo(z.x1 + (z.x2 - z.x1) * t + (Math.random() - 0.5) * 16, z.y1 + (z.y2 - z.y1) * t + (Math.random() - 0.5) * 16);
    }
    ctx.lineTo(z.x2, z.y2); ctx.stroke();
    ctx.restore();
  }
  for (const tx of bossFx.texts) {
    const age = tx.max - tx.life;
    const pop = age < 0.15 ? age / 0.15 * 1.3 : Math.max(1, 1.3 - (age - 0.15) * 2);
    ctx.font = `900 ${Math.min(tx.size, W / 12)}px system-ui`;
    const half = Math.min(W / 2, ctx.measureText(tx.text).width * pop / 2 + 8); // keep it on screen near the edges
    ctx.save(); ctx.translate(Math.max(half, Math.min(W - half, tx.x)), Math.max(20, tx.y)); ctx.scale(pop, pop);
    ctx.globalAlpha = Math.min(1, tx.life / 0.4);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    glow(tx.color, 25); ctx.fillStyle = '#fff'; ctx.fillText(tx.text, 0, 0);
    ctx.restore();
  }
}

// all player bullets in a few batched strokes: a soft additive glow pass, then bright cores
function drawPlayerBullets() {
  if (!bullets.length) return;
  const size = run.s.bulletSize;
  const trace = (list, len) => {
    ctx.beginPath();
    for (const b of list) {
      const sp = Math.hypot(b.vx, b.vy) || 1, l = b.crit ? len * 1.5 : len;
      ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx / sp * l, b.y - b.vy / sp * l);
    }
  };
  const normal = [], crits = [], rails = [], missiles = [], bombs = [];
  for (const b of bullets) (b.bomb ? bombs : b.missile ? missiles : b.rail ? rails : b.crit ? crits : normal).push(b);
  if (bombs.length) drawBombs(bombs);
  const byColor = {};
  for (const b of normal) (byColor[b.color] ||= []).push(b);
  if (crits.length) byColor['#ffffff'] = crits;
  ctx.save();
  ctx.shadowBlur = 0; ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'lighter';
  for (const col in byColor) { ctx.strokeStyle = hexA(col, 0.3); ctx.lineWidth = 9 + size; trace(byColor[col], 13); ctx.stroke(); }
  if (rails.length) { ctx.strokeStyle = 'rgba(160,240,255,0.35)'; ctx.lineWidth = 20; trace(rails, 60); ctx.stroke(); }
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = '#fff6b0'; ctx.lineWidth = 3 + size * 0.5; trace(normal, 13); ctx.stroke();
  if (crits.length) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4.5 + size * 0.5; trace(crits, 13); ctx.stroke(); }
  if (rails.length) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; trace(rails, 60); ctx.stroke(); }
  ctx.restore();
  if (missiles.length) drawGlowDots(missiles.map(b => ({ x: b.x, y: b.y, r: 4, color: '#ff9a3d' })));
}

const PICK = { power: ['#ffe93d', 'P'], shield: ['#7df9ff', 'S'], life: ['#ff6fb5', '+'], pink: ['#ff4fa3', '♥'] };
// a golden shard: a faint, twinkling crystal (easy to miss if you aren't looking)
function drawGoldShard(k) {
  const tw = 0.5 + 0.5 * Math.sin(k.t * 5);
  ctx.save(); ctx.translate(k.x, k.y); ctx.rotate(Math.sin(k.t * 1.5) * 0.4);
  ctx.globalAlpha = 0.4 + tw * 0.5; glow('#ffd23d', 10 + tw * 14); ctx.fillStyle = '#ffd23d'; ctx.strokeStyle = '#fff6c8'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(6, 0); ctx.lineTo(0, 11); ctx.lineTo(-6, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.globalAlpha = tw; ctx.fillStyle = '#ffffff'; ctx.fillRect(-0.75, -16, 1.5, 6); ctx.fillRect(-9, -0.75, 4, 1.5); // (a glint)
  ctx.restore(); ctx.shadowBlur = 0;
}

function drawWorld() {
  drawTide();
  for (const l of lasers) {
    if (l.flare) { drawFlare(l); continue; }
    ctx.save();
    if (l.warn > 0) { // blinking telegraph line
      ctx.globalAlpha = Math.floor(l.warn * 10) % 2 ? 0.7 : 0.25;
      ctx.strokeStyle = l.color; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.moveTo(l.x, 0); ctx.lineTo(l.x, H); ctx.stroke();
      ctx.globalAlpha = 0.08; ctx.fillStyle = l.color; ctx.fillRect(l.x - l.w / 2, 0, l.w, H);
    } else {
      const w = l.w * (0.7 + Math.random() * 0.3);
      glow(l.color, 40); ctx.fillStyle = l.color; ctx.globalAlpha = 0.85; ctx.fillRect(l.x - w / 2, 0, w, H);
      ctx.fillStyle = '#fff'; ctx.fillRect(l.x - w / 6, 0, w / 3, H);
    }
    ctx.restore();
  }
  drawBossFx('under');
  drawEncounterFx();
  for (const bo of bosses) drawBoss(bo);
  for (const bo of bosses) { drawGimmick(bo); drawRageMove(bo); }
  const shots = [], ink = [], hearts = [], goldRings = [], pages = [], speech = [], blades = [];
  for (const b of eBullets) {
    const c = b.color || '#ff4d4d';
    if (b.fuse !== undefined) { // mine: pulsing ring that blinks faster as it's about to burst
      glow(c, 20); ctx.strokeStyle = c; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = Math.floor(b.fuse * (b.fuse < 0.5 ? 20 : 6)) % 2 ? '#fff' : c;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2); ctx.fill();
      continue;
    }
    if (c === ABYSS_INK) { ink.push(b); continue; }
    if (DOKI_HEARTS.includes(c)) { hearts.push(b); continue; }
    if (c === RING_COLOR) { goldRings.push(b); continue; }
    if (c === PAGE_COLOR) { pages.push(b); continue; }
    if (c === BUBBLE_COLOR) { speech.push(b); continue; }
    if (c === KNIFE_COLOR) { blades.push(b); continue; }
    shots.push({ x: b.x, y: b.y, r: b.r || 5, color: c });
  }
  drawGlowDots(shots);
  if (pages.length || speech.length || blades.length) { // DAWNNY's manga pages, speech bubbles and knives
    const t = performance.now() / 1000;
    ctx.save(); ctx.lineWidth = 1.5;
    for (const b of pages) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.sin(t * 3 + b.x * 0.05) * 0.6); glow('#ff9ccf', 8);
      ctx.fillStyle = '#fff6e8'; ctx.strokeStyle = '#ff9ccf'; ctx.fillRect(-6, -8, 12, 16); ctx.strokeRect(-6, -8, 12, 16);
      ctx.shadowBlur = 0; ctx.fillStyle = '#c8a0b4'; ctx.fillRect(-4, -5, 8, 1.5); ctx.fillRect(-4, -1, 8, 1.5); ctx.fillRect(-4, 3, 5, 1.5); ctx.restore();
    }
    ctx.font = 'bold 9px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const b of speech) {
      const r = b.r || 13; glow('#ff4fa3', 10); ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ff4fa3';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, r * 1.3, r * 0.9, 0, 0, TAU); ctx.moveTo(b.x - r * 0.3, b.y + r * 0.8); ctx.lineTo(b.x - r * 0.6, b.y + r * 1.35); ctx.lineTo(b.x + r * 0.05, b.y + r * 0.85); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = '#ff2a7a'; ctx.fillText(BUBBLE_TEXTS[r] || '!!', b.x, b.y + 1);
    }
    for (const b of blades) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx)); glow('#ff2a3a', 10);
      ctx.fillStyle = '#e8eef8'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-2, -3.5); ctx.lineTo(-2, 3.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#7a1a2a'; ctx.fillRect(-9, -2.5, 7, 5); ctx.restore();
    }
    ctx.restore();
  }
  if (goldRings.length) { // SONNET's gold rings: spinning (seen edge-on now and then), with a glint
    ctx.save(); glow('#ffd23d', 14); ctx.strokeStyle = '#ffd23d'; ctx.lineWidth = 3;
    const t = performance.now() / 1000;
    for (const b of goldRings) { const r = b.r || 8, sq = Math.abs(Math.cos(t * 6 + b.x * 0.05)); ctx.beginPath(); ctx.ellipse(b.x, b.y, r * Math.max(0.15, sq), r, 0, 0, TAU); ctx.stroke(); }
    ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff';
    for (const b of goldRings) { ctx.fillRect(b.x - 1, b.y - (b.r || 8) - 1, 2, 2); }
    ctx.restore();
  }
  if (hearts.length) { // DOKI DOLL's hearts, with a little shine on each
    ctx.save(); glow('#ff4fa3', 14);
    for (const col of DOKI_HEARTS) { ctx.fillStyle = col; ctx.beginPath(); for (const b of hearts) if (b.color === col) heartPath(b.x, b.y, (b.r || 6) * 1.15); ctx.fill(); }
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath();
    for (const b of hearts) { const r = b.r || 6; ctx.moveTo(b.x - r * 0.35 + r * 0.22, b.y - r * 0.4); ctx.arc(b.x - r * 0.35, b.y - r * 0.4, r * 0.22, 0, TAU); }
    ctx.fill(); ctx.restore();
  }
  if (ink.length) { // THE ABYSS's ink: black drops with a red rim
    ctx.save(); glow('#ff1f3d', 12); ctx.fillStyle = '#000'; ctx.strokeStyle = '#ff1f3d'; ctx.lineWidth = 2; ctx.beginPath();
    for (const b of ink) { const r = b.r || 5; ctx.moveTo(b.x + r, b.y); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); }
    ctx.fill(); ctx.stroke(); ctx.restore();
  }
  drawPlayerBullets();
  drawAbFx();
  for (const e of enemies) drawEnemyTelegraph(e);
  for (const e of enemies) drawEnemy(e);
  for (const k of pickups) {
    if (k.kind === 'gold') { drawGoldShard(k); continue; }
    if (!PICK[k.kind]) continue;
    const [c, l] = PICK[k.kind];
    glow(c, 20); ctx.strokeStyle = c; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(k.x, k.y, 13 + Math.sin(k.t * 6) * 2, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = c; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(l, k.x, k.y + 1);
  }
  for (const p of players) if (!p.alive && p.wreck) drawWreck(p);
  drawLinks();
  for (const p of players) drawTrail(p);
  for (const p of players) if (p.alive && (p.inv <= 0 || Math.floor(p.inv * 12) % 2 === 0)) drawShip(p);
  for (const p of players) drawPet(p);
  drawTeamUi();
  drawBossFx('over');
  // floating score from kills
  ctx.shadowBlur = 0; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const pp of popups) {
    if (pp.dn && !settings.dmgNums) continue;
    ctx.globalAlpha = Math.min(1, pp.life / 0.4);
    ctx.font = `bold ${pp.dn ? (pp.dn === 2 ? 14 : 11) : pp.hot || pp.color ? 15 : 12}px system-ui`;
    ctx.fillStyle = pp.dn ? (pp.dn === 2 ? '#ffe9a0' : '#ffffff') : pp.color || (pp.hot ? '#ffe93d' : '#dfe8ff');
    ctx.fillText(pp.text, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
}

// the BLACKOUT curse: pitch dark, except a pool of light around each ship (and a glimpse of bosses and beams).
// Drawn on a half-size canvas (soft edges, and cheap), then laid over the world; enemy bullets still glow through.
let blackCv = null;
function drawBlackout() {
  const s = 0.5, w = Math.ceil(W * s), h = Math.ceil(H * s);
  if (!blackCv) blackCv = document.createElement('canvas');
  if (blackCv.width !== w || blackCv.height !== h) { blackCv.width = w; blackCv.height = h; }
  const d = blackCv.getContext('2d');
  d.globalCompositeOperation = 'source-over'; d.clearRect(0, 0, w, h); d.fillStyle = 'rgba(0,0,0,0.95)'; d.fillRect(0, 0, w, h);
  d.globalCompositeOperation = 'destination-out';
  const light = (x, y, r, a = 1) => {
    const g = d.createRadialGradient(x * s, y * s, r * s * 0.35, x * s, y * s, r * s);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)'); d.fillStyle = g;
    d.beginPath(); d.arc(x * s, y * s, r * s, 0, TAU); d.fill();
  };
  for (const p of players) { if (p.alive) light(p.x, p.y, 170); else if (p.wreck) light(p.wreck.x, p.wreck.y, 80, 0.7); }
  for (const b of bosses) light(b.x, b.y, b.r * 1.8, 0.6);
  d.fillStyle = 'rgba(0,0,0,0.6)'; for (const l of lasers) d.fillRect((l.x - l.w) * s, 0, l.w * 2 * s, h); // (beam warnings show)
  ctx.save(); ctx.shadowBlur = 0; ctx.drawImage(blackCv, 0, 0, W, H);
  // enemy bullets still glow in the dark (smaller than in the light)
  drawGlowDots(eBullets.map(b => ({ x: b.x, y: b.y, r: (b.r || 5) * 0.7, color: b.color === ABYSS_INK ? '#ff1f3d' : b.color || '#ff4d4d' })), false);
  ctx.restore();
}

// RAILSHOT beams and DASH trails
function drawAbFx() {
  for (const f of abFx) {
    const k = f.life / f.max, [kind, ...a] = f.a;
    ctx.save(); ctx.globalAlpha = k; ctx.lineCap = 'round';
    if (kind === 'beam' || kind === 'beamx') {
      const [x, y, w, c] = a, ww = w * (kind === 'beamx' ? 0.8 + Math.random() * 0.3 : 0.6 + k * 0.6);
      if (kind === 'beamx') ctx.globalAlpha = Math.min(1, k * 3); // (Overcharged: it holds, crackling, then fades)
      glow(c, 40); ctx.fillStyle = c; ctx.fillRect(x - ww / 2, 0, ww, y);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x - ww / 6, 0, ww / 3, y);
    } else if (kind === 'burn') { // Afterburner: a line of flickering flames along the dash
      const [x0, y0, x1, y1] = a, L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(2, Math.floor(L / 14));
      ctx.globalAlpha = Math.min(1, k * 2.5); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i <= n; i++) {
        const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n, h = 10 + Math.random() * 14;
        ctx.fillStyle = 'rgba(255,90,30,0.7)'; ctx.beginPath(); ctx.moveTo(x - 7, y + 4); ctx.lineTo(x, y - h); ctx.lineTo(x + 7, y + 4); ctx.fill();
        ctx.fillStyle = 'rgba(255,230,140,0.8)'; ctx.beginPath(); ctx.moveTo(x - 3, y + 3); ctx.lineTo(x, y - h * 0.5); ctx.lineTo(x + 3, y + 3); ctx.fill();
      }
    } else if (kind === 'dash') {
      const [x0, y0, x1, y1, c] = a;
      glow(c, 20); ctx.strokeStyle = c; ctx.lineWidth = 14 * k; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4 * k; ctx.stroke();
    }
    ctx.restore();
  }
}
// co-op links: a tether that brightens as it charges, then two streams that meet above the pair and one great beam
function drawLinks() {
  const t = performance.now() / 1000;
  for (const [ia, ib, c, fire] of linkList()) {
    const a = players[ia], b = players[ib];
    if (!a?.alive || !b?.alive) continue;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, col = mixHex(a.color, b.color, 0.5);
    ctx.save(); ctx.lineCap = 'round';
    if (fire > 0) {
      const k = Math.min(1, fire / 0.3), fy = my - 30, w = LINK_W * (0.85 + Math.random() * 0.25) * k;
      glow(col, 40);
      for (const p of [a, b]) { ctx.strokeStyle = p.color; ctx.lineWidth = 6 * k; ctx.beginPath(); ctx.moveTo(p.x, p.y - 10); ctx.lineTo(mx, fy); ctx.stroke(); }
      const g = ctx.createLinearGradient(mx - w / 2, 0, mx + w / 2, 0);
      g.addColorStop(0, a.color); g.addColorStop(0.5, '#ffffff'); g.addColorStop(1, b.color);
      ctx.globalAlpha = 0.9; ctx.fillStyle = g; ctx.fillRect(mx - w / 2, 0, w, fy);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(mx - w / 8, 0, w / 4, fy);
      ctx.beginPath(); ctx.arc(mx, fy, w * 0.55, 0, TAU); ctx.fill(); // (the focus where the streams meet)
    } else {
      const full = c >= 0.99;
      ctx.globalAlpha = 0.2 + c * 0.6; ctx.strokeStyle = full ? '#ffffff' : col; ctx.lineWidth = 1 + c * 3;
      glow(col, 8 + c * 20); ctx.setLineDash(full ? [] : [6, 6]); ctx.lineDashOffset = -t * 40;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = 0.5 + c * 0.5; ctx.fillStyle = full ? '#ffffff' : col;
      ctx.beginPath(); ctx.arc(mx, my, 3 + c * 7 + (full ? Math.sin(t * 12) * 2 : 0), 0, TAU); ctx.fill();
      if (c > 0.15) { ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.fillStyle = col; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center'; ctx.fillText(full ? 'LINK READY' : `LINK ${Math.round(c * 100)}%`, mx, my - 16); }
    }
    ctx.restore();
  }
}

// DOKI DOLL's meter, big on the right side of the screen: a tall bar that fills with pink, topped with a beating heart
function drawDokiMeter(b) {
  const k = b.doki || 0, t = performance.now() / 1000, poss = !!b.possessed;
  const top = Math.max(14 + players.length * hudRowH() + 40, H * 0.28), h = Math.min(H * 0.4, H - top - 90), w = 16, x = W - 30 - w / 2;
  if (h < 60) return;
  ctx.save();
  ctx.fillStyle = 'rgba(10,12,28,0.75)'; ctx.strokeStyle = poss ? '#ff3d6d' : '#ff6fd8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x, top, w, h, 8); ctx.fill(); ctx.stroke();
  const fh = (h - 4) * k, g = ctx.createLinearGradient(0, top + h, 0, top);
  g.addColorStop(0, poss ? '#8a0020' : '#ff4fa3'); g.addColorStop(1, poss ? '#ff3d6d' : '#ffd6ec');
  glow('#ff4fa3', 14); ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x + 2, top + h - 2 - fh, w - 4, fh, 6); ctx.fill();
  const beat = 1 + Math.max(0, Math.sin(t * (6 + k * 6))) * 0.18; // (it beats faster as she gets flustered)
  ctx.fillStyle = poss ? '#ff3d6d' : '#ff4fa3'; ctx.beginPath(); heartPath(x + w / 2, top - 16, 11 * beat); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('DOKI', x + w / 2, top + h + 6); ctx.fillText(`${Math.floor(k * 100)}%`, x + w / 2, top + h + 18);
  ctx.restore();
}

// ---------- draw: HUD & screens ----------
function drawHUD() {
  if (net.role === 'guest' && net.rtt) { ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.font = 'bold 11px system-ui'; ctx.fillStyle = net.rtt < 120 ? '#5dff7a' : net.rtt < 250 ? '#ffe93d' : '#ff5a70'; ctx.fillText('PING ' + Math.round(net.rtt) + ' ms', 16, H - 8); }
  ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 22px system-ui';
  ctx.fillText(score.toLocaleString(), 16, 14);
  ctx.font = '13px system-ui'; ctx.fillStyle = '#9ab';
  ctx.fillText(`${mode > 1 ? `${mode}P CO-OP   ` : ''}${run.endless ? `ENDLESS C${run.cycle}   ` : ''}${run.rush ? `BOSS RUSH ${bossCount}/${run.bossOrder.length}` : `SECTOR ${level}`} · ${curZone().name}   BEST ${bestOf(mode, runKind()).toLocaleString()}   ● ${run.coins || 0}${run.pinkCoins && !run.dokiMet ? `   ♥ ${run.pinkCoins}/${PINK_NEED}` : ''}`, 16, 42);
  if (combo > 1) { ctx.fillStyle = '#ffe93d'; ctx.font = 'bold 16px system-ui'; ctx.fillText(`x${combo} COMBO`, 16, 62); }
  // active endless mutators
  const muts = MUTATORS.filter(m => mut(m.id)).map(m => m.name + (mut(m.id) > 1 ? ` ×${mut(m.id)}` : ''));
  if (muts.length) { ctx.fillStyle = '#ff9a3d'; ctx.font = 'bold 11px system-ui'; ctx.fillText(muts.join(' · '), 16, combo > 1 ? 84 : 64); }
  const curses = CURSES.filter(c => curse(c.id)).map(c => c.name); // (and the run's curses)
  if (curses.length) { ctx.fillStyle = '#ff5a70'; ctx.font = 'bold 11px system-ui'; ctx.fillText('🌀 ' + curses.join(' · '), 16, (combo > 1 ? 84 : 64) + (muts.length ? 16 : 0)); }

  ctx.textAlign = 'right';
  const compactHud = players.length > 4; // online 5-8 players: one short line each
  players.forEach((p, i) => {
    const y = 14 + i * hudRowH();
    ctx.font = compactHud ? (players.length > 8 ? '11px system-ui' : '15px system-ui') : '20px system-ui'; ctx.fillStyle = p.alive ? p.color : '#556';
    const label = mode > 1 ? `P${p.id + 1} ` : '';
    ctx.fillText(p.alive ? label + '♥'.repeat(p.lives) + '♡'.repeat(Math.max(0, maxLivesOf(p) - p.lives)) : label + (p.gone ? 'LEFT' : 'DOWN'), W - 16, y);
    if (compactHud) return;
    ctx.font = 'bold 12px system-ui';
    if (p.alive && p.power > 0) { ctx.fillStyle = '#ffe93d'; ctx.fillText(`SPREAD ${p.power.toFixed(1)}s`, W - 16, y + 26); }
    else if (!p.alive) { ctx.fillStyle = '#889'; ctx.fillText(p.gone ? 'left the game' : 'fly to the wreck to revive', W - 16, y + 26); }
    else if (curse('powerless')) { ctx.fillStyle = hexA(p.color, 0.55); ctx.fillText(p.ship.name, W - 16, y + 26); }
    else { // the ship's ability, and when it's ready
      const ab = abilityOf(p), ready = p.abCd <= 0;
      if (W >= 480) ctx.fillStyle = hexA(p.color, 0.55), ctx.fillText(p.ship.name + '  ·  ', W - 16 - ctx.measureText(`${ab.name} ${ready ? 'READY' : Math.ceil(p.abCd) + 's'}`).width, y + 26);
      ctx.fillStyle = ready ? p.color : '#778'; ctx.fillText(`${ab.name} ${ready ? 'READY' : Math.ceil(p.abCd) + 's'}`, W - 16, y + 26);
    }
  });
  // touch screens: the ability button for the player steering with their finger
  if (touchMode && state === 'play' && !paused && !menuOpen) { // the pause button (online: your own menu)
    const { x, y, r } = touchPause();
    ctx.save(); ctx.globalAlpha = 0.75; ctx.fillStyle = 'rgba(10,12,28,0.7)'; ctx.strokeStyle = '#9ab'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#dfe8ff'; ctx.fillRect(x - 6, y - 7, 4, 14); ctx.fillRect(x + 2, y - 7, 4, 14); ctx.restore();
  }
  if (touchMode && state === 'play' && !paused && !menuOpen && !curse('powerless')) {
    const mk = mouseOwner(), p = players[net.role ? net.mine[mk] : mk];
    if (p?.alive) {
      const { x, y, r } = touchAb(), ready = p.abCd <= 0;
      ctx.save(); ctx.globalAlpha = ready ? 0.85 : 0.4; glow(p.color, ready ? 20 : 0);
      ctx.fillStyle = 'rgba(10,12,28,0.7)'; ctx.strokeStyle = p.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
      if (!ready) { ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, r - 6, -Math.PI / 2, -Math.PI / 2 + (1 - p.abCd / abCdOf(p)) * TAU); ctx.stroke(); }
      ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ready ? abilityOf(p).name.split(' ')[0] : Math.ceil(p.abCd) + 's', x, y);
      ctx.restore();
    }
  }

  // sector progress bar along the bottom edge
  if (!bosses.length && bossWarn <= 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, H - 4, W, 4);
    ctx.fillStyle = level % BOSS_EVERY === BOSS_EVERY - 1 ? '#ff5a70' : '#7df9ff';
    ctx.fillRect(0, H - 4, W * levelT / SECTOR_TIME, 4);
  }

  // owned upgrades, bottom-left
  ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let x = 16, y = H - 14;
  for (const u of UPGRADES) {
    const n = run.owned[u.id]; if (!n) continue;
    const t = n > 1 ? `${u.name} ×${n}` : u.name, w = ctx.measureText(t).width + 14;
    if (x + w > W - 16) { x = 16; y -= 20; }
    ctx.fillStyle = 'rgba(10,12,28,0.7)'; ctx.fillRect(x, y - 12, w, 17);
    ctx.fillStyle = RARITY[u.r].color; ctx.fillText(t, x + 7, y);
    x += w + 6;
  }

  // one health bar per boss, stacked; status tags explain team mechanics
  // (with 3+ bosses, the bars go into a compact 2-column grid so they don't cover the fight)
  const narrow = W < 640, compact = bosses.length >= 3;
  const full = narrow ? W - 32 : Math.min(compact ? 560 : 460, W - 360), bw = compact ? (full - 10) / 2 : full;
  const top = narrow ? 14 + players.length * hudRowH() + 8 : 18;
  bosses.filter(bo => !(bo.cine < CINE_LEN)).forEach((bo, i) => { // (THE ABYSS's bar appears once its entrance is over)
    const bx = compact ? (W - full) / 2 + (i % 2) * (bw + 10) : (W - bw) / 2;
    const by = compact ? top + Math.floor(i / 2) * 28 : top + i * 34, cx = bx + bw / 2;
    let status = '', statusColor = bo.color;
    const fill = bo.doki !== undefined ? bo.doki : Math.max(0, bo.hp / bo.max); // (DOKI DOLL's bar is her DOKI meter, filling up)
    if (bo.doki !== undefined) { status = bo.possessed ? 'POSSESSED · DOKI ♥' : 'DOKI ♥'; statusColor = bo.possessed ? '#ff3d6d' : '#ff9ccf'; }
    else if (bo.downed) { status = `REVIVING IN ${Math.ceil(bo.reviveT)}s`; statusColor = '#ff5a70'; }
    else if (bo.shielded) { status = 'SHIELDED'; statusColor = '#5dff7a'; }
    else if (bo.regen) { status = 'REGENERATING'; statusColor = '#5dff7a'; }
    else if (bo.healT > 0) { status = 'HEALING'; statusColor = '#ff2d55'; }
    else if (bo.beast) { status = 'THE BEAST · CAN\'T BE HURT · HACK THE COMPUTERS!'; statusColor = '#ff3d3d'; }
    else if (bo.sus) { status = 'WHO DUNNIT? · FIND THE MURDERER'; statusColor = '#ff9ccf'; }
    else if (bo.tired > 0) { status = 'DIZZY · ×2 DAMAGE'; statusColor = '#ffffff'; }
    else if (bo.xf >= 0) { status = 'TRANSFORMING — CAN\'T BE HURT'; statusColor = bo.ghostColor || '#ffd23d'; } // (SONNET turning golden; a second life)
    else if (bo.super) { status = ascendOf(bo) ? 'SECOND LIFE' : 'GOLDEN'; statusColor = bo.ghostColor || '#ffd23d'; }
    else if (isEnraged(bo) && bo.dying <= 0) status = 'ENRAGED';
    else if (bo.bond !== undefined) { status = `P${bo.bond + 1}'S TARGET`; statusColor = P_COLORS[bo.bond]; }
    // "NAME  ·  STATUS", centered as a whole, with the status in its own color
    ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.font = `bold ${compact ? 10 : 13}px system-ui`;
    const head = (bo.title || bo.name) + (status ? (compact ? ' · ' : '  ·  ') : ''), x0 = cx - ctx.measureText(head + status).width / 2;
    ctx.fillStyle = bo.color; ctx.fillText(head, x0, by);
    if (status) { ctx.fillStyle = statusColor; ctx.fillText(status, x0 + ctx.measureText(head).width, by); }
    if (!compact && !bo.downed) { ctx.textAlign = 'right'; ctx.fillStyle = '#cde'; ctx.font = 'bold 11px system-ui'; ctx.fillText(`${Math.ceil(fill * 100)}%`, bx + bw, by + 1); } // HP left (or DOKI)
    const barY = by + (compact ? 14 : 19), barH = compact ? 5 : 7;
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(bx, barY, bw, barH);
    if (bo.downed) { // the revive timer drains across the empty bar
      ctx.fillStyle = hexA('#ff5a70', 0.5); ctx.fillRect(bx, barY, bw * bo.reviveT / TWIN_REVIVE(), barH);
    } else {
      glow(bo.color, 12); ctx.fillStyle = bo.color;
      ctx.fillRect(bx, barY, bw * fill, barH);
      ctx.shadowBlur = 0;
      if (bo.shielded) { ctx.strokeStyle = '#5dff7a'; ctx.lineWidth = 1.5; ctx.strokeRect(bx - 2, barY - 2, bw + 4, barH + 4); }
    }
  });
  if (state === 'play') drawZoneCard();
  const db = bosses.find(o => o.doki !== undefined);
  if (db) drawDokiMeter(db);
  const warnInfo = bossWarn > 0 ? (net.role === 'guest' ? net.warnInfo || { name: '???' } : encounterInfo(bossCount)) : null;
  if (warnInfo?.doki && !run.warp) { // the pink door: a softer, sparklier warning
    const k = Math.min(1, (3.4 - bossWarn) / 0.5);
    ctx.fillStyle = `rgba(255,111,216,${0.1 * k})`; ctx.fillRect(0, H / 2 - 60, W, 120);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; glow('#ff6fd8', 30); ctx.fillStyle = '#ffd6ec';
    ctx.font = `900 ${Math.min(50, W / 10)}px system-ui`; ctx.fillText('♥  SOMEONE WANTS TO PLAY  ♥', W / 2, H / 2 - 14, W - 32);
    ctx.shadowBlur = 0; fitText('A PINK DOOR HAS OPENED', H / 2 + 30, 16, '#ff9ccf');
  } else if (bossWarn > 0 && !run.warp && Math.floor(bossWarn * 4) % 2 === 0) {
    const info = warnInfo;
    ctx.fillStyle = 'rgba(255,40,60,0.12)'; ctx.fillRect(0, H / 2 - 60, W, 120);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    glow('#ff3050', 30); ctx.fillStyle = '#ff5a70';
    ctx.font = `900 ${Math.min(56, W / 9)}px system-ui`; ctx.fillText(info.team ? 'TEAM BOSS' : 'WARNING', W / 2, H / 2 - 14);
    ctx.shadowBlur = 0; fitText(`${info.name} APPROACHING${info.final ? ' — FINAL BOSS' : ''}`, H / 2 + 30, 16, '#ffb0bb');
  }
  if (hint && !paused && !menuOpen) {
    ctx.save(); ctx.globalAlpha = Math.min(1, hint.life);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '15px system-ui'; ctx.fillStyle = '#cde';
    wrap(hint.text, Math.min(620, W - 40)).forEach((l, i) => ctx.fillText(l, W / 2, H * 0.62 + i * 20));
    ctx.restore();
  }
  if (paused || (menuOpen && state === 'play')) drawPause();
}

const SETTING_LIST = [['music', 'MUSIC  [M]'], ['sfx', 'SOUND EFFECTS'], ['shake', 'SCREEN SHAKE'], ['dmgNums', 'DAMAGE NUMBERS'],
  ['calm', 'REDUCED FLASHING'], ['fps', 'SHOW FPS'], ['lowfx', 'PERFORMANCE MODE']];
function toggleFullscreen() {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) {}
}
// all the settings toggles (two columns on wide screens); returns the y just below them
function settingsButtons(y) {
  const cols = W >= 640 ? 2 : 1, gap = 8, bh = cols > 1 ? 42 : 38, bw = Math.min(cols > 1 ? 250 : 300, (W - 32 - gap) / cols);
  const x0 = (W - (bw * cols + gap * (cols - 1))) / 2;
  const items = [...SETTING_LIST.map(([k, label]) => [`${label}:  ${settings[k] ? 'ON' : 'OFF'}`, settings[k] ? '#5dff7a' : '#778', () => toggleSetting(k)]),
    [`FULLSCREEN  [F]:  ${document.fullscreenElement ? 'ON' : 'OFF'}`, document.fullscreenElement ? '#5dff7a' : '#778', toggleFullscreen]];
  items.forEach(([label, color, act], i) => button(label, x0 + (i % cols) * (bw + gap), y + Math.floor(i / cols) * (bh + gap), bw, bh, color, act));
  return y + Math.ceil(items.length / cols) * (bh + gap);
}

let pauseView = 'main'; // 'main' or 'settings'
function restartRun() {
  if (net.role === 'guest' || !run) return;
  paused = false; pauseView = 'main';
  if (run.practice) startPractice(run.practice.i, run.practice.hard);
  else if (net.role === 'host') startOnline(); else start(mode, run.ships);
}
// the pause screen (playing alone or on one computer), and online, your own menu: the game keeps going for everyone
// while it's open, unless the host pauses everyone
function drawPause() {
  const online = net.playing, guest = net.role === 'guest';
  ctx.fillStyle = paused ? 'rgba(3,3,12,0.78)' : 'rgba(3,3,12,0.55)'; ctx.fillRect(0, 0, W, H);
  if (guest && !menuOpen) { // (the host paused everyone)
    title('PAUSED BY HOST', 90, '#7df9ff', 40); fitText('Esc: your menu', 122, 13, '#9ab');
    drawBuildPanel((W - Math.min(520, W - 32)) / 2, 140, Math.min(520, W - 32)); return;
  }
  if (pauseView === 'settings') {
    title('SETTINGS', 70, '#7df9ff', 44);
    const y = settingsButtons(110), bw = Math.min(260, W - 32);
    button('BACK  [Esc]', (W - bw) / 2, y + 6, bw, 42, '#9ab', () => { pauseView = 'main'; });
    return;
  }
  title(!online ? 'PAUSED' : paused ? (guest ? 'PAUSED BY HOST' : 'PAUSED FOR EVERYONE') : 'MENU', 64, '#7df9ff', 48);
  if (online && !paused) fitText('The game keeps going for everyone — your ship is still out there!', 98, 13, '#ffb13d', 'bold');
  // buttons on the left (or on top on phones), your build on the right (or below)
  const items = [];
  if (!online) items.push(['RESUME  [P]', '#7df9ff', () => { paused = false; }]);
  else if (guest || !paused) items.push(['BACK TO THE GAME  [Esc]', '#7df9ff', toggleMenu]);
  else items.push(['RESUME FOR EVERYONE  [P]', '#7df9ff', () => forcePause(false)]);
  if (online && !guest && !paused) items.push(['⏸  PAUSE FOR EVERYONE  [P]', '#ffe93d', () => forcePause(true)]);
  items.push(['SETTINGS', '#9ab', () => { pauseView = 'settings'; }]);
  if (!guest) { items.push(['RESTART  [R]', '#ffe93d', restartRun]); items.push(['END RUN  (keeps shards)', '#ff5a70', () => endRun()]); }
  if (online) items.push([guest ? 'LEAVE GAME' : 'CLOSE ROOM', '#ff5a70', () => leaveOnline(guest ? 'You left the game' : undefined)]);
  const wide = W >= 760, bw = wide ? 250 : Math.min(300, W - 32), bh = wide ? 42 : 38, gap = wide ? 50 : 44;
  const bx = wide ? W / 2 - 290 : (W - bw) / 2, by = 116;
  items.forEach(([label, color, act], i) => button(label, bx, by + gap * i, bw, bh, color, act));
  if (wide) drawBuildPanel(W / 2 - 20, by, Math.min(320, W / 2 - 40));
  else drawBuildPanel((W - Math.min(420, W - 32)) / 2, by + gap * items.length + 6, Math.min(420, W - 32));
}
// your stats, your upgrades and how close you are to each evolution
function drawBuildPanel(x, y, w) {
  const s = run.s, lines = [];
  const pct = v => Math.round(v * 100) + '%';
  const stats = [['Damage', '×' + s.dmg.toFixed(2)], ['Fire rate', (1 / s.fireDelay).toFixed(1) + '/s'], ['Shots', s.shots], ['Pierce', s.pierce],
    ['Crit', pct(s.crit)], ['Boss dmg', '×' + s.bossDmg.toFixed(2)], ['Speed', Math.round(s.speed)], ['Max lives', s.maxLives]];
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#7df9ff'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'left'; ctx.fillText('YOUR BUILD', x, y);
  y += 20;
  ctx.font = '12px system-ui';
  stats.forEach(([k, v], i) => {
    const cx = x + (i % 2) * (w / 2), cy = y + Math.floor(i / 2) * 17;
    ctx.textAlign = 'left'; ctx.fillStyle = '#9ab'; ctx.fillText(k, cx, cy);
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.fillText(String(v), cx + w / 2 - 12, cy);
  });
  y += Math.ceil(stats.length / 2) * 17 + 8;
  const owned = UPGRADES.filter(u => run.owned[u.id]);
  ctx.textAlign = 'left'; ctx.fillStyle = '#7df9ff'; ctx.font = 'bold 13px system-ui'; ctx.fillText(`UPGRADES (${owned.length})`, x, y); y += 18;
  ctx.font = '12px system-ui'; ctx.fillStyle = '#cde';
  const text = owned.map(u => (u.r === 'evo' ? '★ ' : '') + u.name + (run.owned[u.id] > 1 ? ` ×${run.owned[u.id]}` : '')).join(' · ') || 'None yet';
  for (const l of wrap(text, w).slice(0, 5)) { ctx.fillText(l, x, y); y += 15; }
  // evolutions you've started on (and ones you've finished)
  const evo = EVOLUTIONS.filter(e => run.owned[e.id] || e.needs.some(([id]) => run.owned[id]));
  if (evo.length && y < H - 40) {
    y += 6; ctx.fillStyle = RARITY.evo.color; ctx.font = 'bold 13px system-ui'; ctx.fillText('EVOLUTIONS', x, y); y += 18;
    ctx.font = '11px system-ui';
    for (const e of evo) {
      if (y > H - 20) break;
      const done = run.owned[e.id], ready = !done && e.needs.every(([id, lv]) => (run.owned[id] || 0) >= lv);
      const need = e.needs.map(([id, lv]) => `${UPGRADES.find(u => u.id === id).name} ${Math.min(lv, run.owned[id] || 0)}/${lv}`).join(' + ');
      ctx.fillStyle = done ? '#5dff7a' : ready ? RARITY.evo.color : '#9ab';
      ctx.fillText(done ? `✓ ${e.name}` : ready ? `★ ${e.name} — ready! Next boss reward` : `${e.name}: ${need}`, x, y, w);
      y += 15;
    }
  }
}

// the Music Room: listen to any song in the game (and its battle version)
function drawJukebox() {
  title('MUSIC ROOM', 46, '#c08dff', 42);

// ---------- THE ABYSS leaves its mark: lose to it, and the main menu stays haunted until you finally beat it ----------
// Eyes open in the dark around the menu and follow your mouse, ink drips down from the top, a heartbeat thumps, the title
// glitches (sometimes into something else), and the subtitle whispers. It gets worse the more times you lose to it.
const markLv = () => meta.abyssMark ? Math.min(1, 0.45 + 0.15 * Math.max(0, (meta.abyssLosses | 0) - 1)) : 0;
const MENU_WHISPERS = ['it\'s still waiting', 'come back', 'you left me in the dark', 'we remember you', 'it sees you', 'why did you run'];
const marks = { eyes: [], eyeT: 2.5, word: null, wordT: 5, glitch: 0, glitchT: 3, glitchWord: false, beat: 0, beatT: 4, drips: [] };
function markAbyss() {
  meta.abyssMark = true; meta.abyssLosses = (meta.abyssLosses | 0) + 1; saveMeta();
  if (run) run.abyssLoss = true;
  Object.assign(marks, { eyeT: 2, wordT: 4, drips: [] });
}
function clearAbyssMark() { if (meta.abyssMark) { meta.abyssMark = false; saveMeta(); } }
function updateMenuMarks(dt) {
  const lv = markLv(); if (!lv) return;
  for (const e of marks.eyes) e.t += dt;
  marks.eyes = marks.eyes.filter(e => e.t < e.life);
  if ((marks.eyeT -= dt) <= 0) { // one eye opens somewhere off to the side (later on, a few at once)
    marks.eyeT = (7 + Math.random() * 8) * (1.5 - lv);
    const n = lv > 0.7 && Math.random() < 0.5 ? 3 : 1;
    for (let i = 0; i < n; i++) {
      const side = Math.random() < 0.5 ? -1 : 1;
      marks.eyes.push({ x: W / 2 + side * W * (0.3 + Math.random() * 0.16), y: H * (0.12 + Math.random() * 0.76), r: (i ? 12 + Math.random() * 12 : 28 + Math.random() * 26) * (0.8 + lv * 0.4),
        t: -i * 0.5, life: 3.4 + Math.random() * 2, blink: 1.3 + Math.random() * 1.5 });
    }
    beep(300, 0.6, 'sine', 0.015, -220);
  }
  if (marks.word) { if ((marks.word.t += dt) > 2.4) marks.word = null; }
  else if ((marks.wordT -= dt) <= 0) { marks.wordT = 8 + Math.random() * 9; marks.word = { text: MENU_WHISPERS[Math.floor(Math.random() * MENU_WHISPERS.length)], t: 0 }; }
  if (marks.glitch > 0) marks.glitch -= dt;
  else if ((marks.glitchT -= dt) <= 0) { marks.glitchT = 2.5 + Math.random() * 5 * (1.4 - lv); marks.glitch = 0.1 + Math.random() * 0.15; marks.glitchWord = Math.random() < 0.25; }
  marks.beat = Math.max(0, marks.beat - dt * 2.5);
  if ((marks.beatT -= dt) <= 0) { marks.beatT = 5 + Math.random() * 4; marks.beat = 1; beep(52, 0.18, 'sine', 0.06, -10); setTimeout(() => beep(46, 0.2, 'sine', 0.045, -10), 160); }
  const want = Math.round(3 + lv * 7);
  while (marks.drips.length < want) marks.drips.push({ x: Math.random() * W, len: 0, sp: 5 + Math.random() * 12, max: 24 + Math.random() * H * 0.22, w: 2 + Math.random() * 4, drop: null });
  for (const d of marks.drips) {
    if (d.len < d.max) d.len += d.sp * dt;
    else { d.drop = (d.drop ?? d.len) + 170 * dt; if (d.drop > H + 20) Object.assign(d, { x: Math.random() * W, len: 0, drop: null }); } // (a drop falls, and it starts again)
  }
}
function drawMenuMarks() {
  const lv = markLv(); if (!lv) return;
  ctx.save();
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75); // a dark red edge, pulsing with the heartbeat
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(70,0,10,${0.35 * lv + marks.beat * 0.18})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#050003'; ctx.strokeStyle = 'rgba(255,31,61,0.55)'; ctx.lineWidth = 1; glow('#ff1f3d', 6);
  for (const d of marks.drips) { // ink running down from the top

    if (d.drop !== null) { ctx.beginPath(); ctx.ellipse(d.x, d.drop, d.w * 0.6, d.w * 1.1, 0, 0, TAU); ctx.fill(); ctx.stroke(); }

}

// callouts, name tags (online) and arrows pointing to downed teammates
function drawTeamUi() {
  const now = performance.now(), online = !!net.role;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of players) {
    const at = p.alive ? p : p.wreck; if (!at) continue;

    }
    if (p.emote && now < p.emote.until) { // speech bubble
      const [text, color] = EMOTES[p.emote.k], pop = Math.min(1, (p.emote.until - now) / 200, (now - p.emote.until + 2200) / 120);
      ctx.font = 'bold 13px system-ui';
      const w = ctx.measureText(text).width + 18, x = Math.max(w / 2 + 4, Math.min(W - w / 2 - 4, at.x)), y = Math.max(20, at.y - 44);
      ctx.globalAlpha = Math.max(0, pop); ctx.fillStyle = 'rgba(5,5,16,0.85)'; ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(x - w / 2, y - 12, w, 24, 8); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(at.x - 5, y + 12); ctx.lineTo(at.x, y + 19); ctx.lineTo(at.x + 5, y + 12); ctx.fill();
      ctx.fillStyle = color; ctx.fillText(text, x, y + 1); ctx.globalAlpha = 1;
    }
  }
  // arrows from your ship (online) or every ship (local) toward downed teammates
  const mine = online ? living().filter(p => isMine(p.id)) : living();
  for (const p of mine) for (const d of players) {
    if (d.alive || !d.wreck) continue;
    const dx = d.wreck.x - p.x, dy = d.wreck.y - p.y, dist = Math.hypot(dx, dy);
    if (dist < 140) continue;
    const a = Math.atan2(dy, dx), x = p.x + Math.cos(a) * 44, y = p.y + Math.sin(a) * 44, pulse = 1 + Math.sin(now / 150) * 0.15;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(pulse, pulse);

  }
  ctx.restore();
}

// ---------- Boss Rush medals: clear it fast enough for silver or gold (gold unlocks the Champion skin) ----------
const RUSH_MEDALS = [null, { name: 'BRONZE', icon: '🥉', color: '#e0955a' }, { name: 'SILVER', icon: '🥈', color: '#dfe8f2', under: 22 * 60 },
  { name: 'GOLD', icon: '🥇', color: '#ffd23d', under: 16 * 60 }];
const RUSH_ZERO_TIME = 75; // (extra time when ZERO joins the end of the rush)
const rushLimit = lv => RUSH_MEDALS[lv].under + (run?.rushZero ? RUSH_ZERO_TIME : 0);
const rushMedal = () => time <= rushLimit(3) ? 3 : time <= rushLimit(2) ? 2 : 1;
const curZone = () => zoneDef(run?.zone && (inRun() || state === 'over') ? run.zone : ZONE_FIRST); // (menus are in DEEP SPACE)

// the solo fights of the zone you just entered are drawn from its own boss list (ones you haven't fought
// this cycle); whoever they replace takes their place later in the order, so nobody shows up twice
function assignZoneBosses(z) {
  const cycleStart = Math.floor(bossCount / BOSS_CYCLE) * BOSS_CYCLE + 1, cycleEnd = cycleStart + BOSS_CYCLE - 1;
  encounterDef(cycleEnd); // (Endless builds each cycle's order as it goes)
  const at = n => run.bossOrder[(n - 1) % run.bossOrder.length];
  for (let n = bossCount + 1; n <= Math.min(cycleEnd, bossCount + BOSSES_PER_ZONE); n++) {
    const e = at(n);
    if (e.single === undefined || BOSSES[e.single].final) continue;
    const fought = new Set();
    for (let k = cycleStart; k < n; k++) if (at(k).single !== undefined) fought.add(at(k).single);
    const pool = z.bosses.map(name => BOSSES.findIndex(b => b.name === name)).filter(i => i >= 0 && !fought.has(i));
    if (!pool.length) continue;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    for (let k = n + 1; k <= cycleEnd; k++) if (at(k).single === pick) at(k).single = e.single;
    e.single = pick;
  }
}

// ---------- the route map: after a zone is cleared, choose where to go next ----------
function routeOptions() {
  if (run.route.length >= ZONES_PER_CYCLE - 1) return [ZONE_LAST]; // every route ends at the EVENT HORIZON
  return shuffle(middleZones().filter(id => !run.route.includes(id))).slice(0, ROUTE_CHOICES);
}
const ROUTE_CHOICES = 3; // zones offered at each fork
function openRoute() {

  const cycleStart = Math.floor(bossCount / BOSS_CYCLE) * BOSS_CYCLE + 1, fought = new Set();
  for (let k = cycleStart; k <= bossCount; k++) { const e = encounterDef(k); if (e.single !== undefined) fought.add(BOSSES[e.single].name); }
  run.routeOpts = routeOptions().map(id => ({ id, bosses: [...zoneDef(id).bosses.filter(n => !fought.has(n)), ...(id === 'glitch' && !run.rush ? ['ZERO'] : [])] })); // (ZERO waits at the end of the GLITCH SECTOR)
  go('route');
  [392, 523, 659].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.05), i * 90));
}
function pickRoute(i) {

// Boss Rush has no route map: the zone changes by itself every few fights, and the last fight is at the EVENT HORIZON
const RUSH_ZONE_EVERY = 4;
function rushNextZone() {

  if (bossCount % RUSH_ZONE_EVERY) return null;
  const order = [ZONE_FIRST, ...run.rushZones];
  return order[(order.indexOf(run.zone) + 1) % order.length];
}

// ---------- warping to the next zone: hyperspace streaks, a flash, then the new zone's title card ----------
const WARP_TIME = 2.6, WARP_SWAP = 1.15; // seconds in hyperspace; when the new zone appears
function beginWarp(to) {

}
function updateWarp(dt) {

function warpK() {

// ---------- the zone title card: a big name across the screen when you arrive ----------
let zoneCard = null;
const ZONE_CARD = 3.6;
function showZoneCard(id, n) { zoneCard = { id, n, at: performance.now() }; }

// ---------- zone hazards ----------
function updateHazards(dt) {
  const id = run.zone;

  if ((run.hazardT = (run.hazardT ?? 4) - dt) > 0) return;

    run.hazardT = (boss ? 12 : 7) + Math.random() * 4;
    const side = Math.random() < 0.5 ? 1 : -1, y = H * (0.3 + Math.random() * 0.55), n = level >= 9 && Math.random() < 0.4 ? 2 : 1;

  } else if (id === 'corona') { // solar flares: a column glows, then fire blasts down it (one aimed near someone)
    run.hazardT = (boss ? 11 : 6.5) + Math.random() * 3;
    const alive = living(), p = alive[Math.floor(Math.random() * alive.length)], xs = [];
    if (p) xs.push(Math.max(FLARE_W / 2, Math.min(W - FLARE_W / 2, p.x + (Math.random() - 0.5) * 60)));
    if (level >= 8 || !p) { // (a second column, with plenty of room to stand between them)
      const s = spreadSpot(xs.map(x => [x, 0]), FLARE_W * 2.8, () => [FLARE_W / 2 + Math.random() * (W - FLARE_W), 0]);
      if (s) xs.push(s[0]);

  } else if (id === 'prism') { // a prism drifts in: every shot through it splits in three (not during boss fights)

    run.lastGlitch = k;

      beep(90, 0.3, 'square', 0.05, 900);

      const pool = enemies.filter(e => !e.dead && !TYPES[e.type].ghost && !(e.blinkT > 0));

    for (let i = 0; i < 25 && !ok; i++) await new Promise(r => setTimeout(r, 200));
    pc.close();
    netCheck = ok ? 'ok' : 'blocked';
  } catch (e) { netCheck = 'blocked'; } // (no WebRTC at all)
}
// typing the last digit joins straight away
function typeCodeDigit(d) {
  if (net.typed.length >= CODE_LEN) return;
  net.typed += d; beep(700 + net.typed.length * 60, 0.05, 'triangle', 0.04);
  if (net.typed.length === CODE_LEN) joinGame(net.typed);
}
function drawJoin() {
  const top = Math.max(120, H / 2 - 230), bw = Math.min(300, W - 32), bx = (W - bw) / 2;
  title('JOIN A GAME', top, '#7df9ff', 44);
  fitText('Type the 4-digit room code — it joins as soon as you finish', top + 40, 14, '#9ab');
  const boxW = Math.min(300, W - 32), boxX = (W - boxW) / 2, cy = top + 64;
  panel(boxX, cy, boxW, 64, '#7df9ff', true);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.font = '900 38px system-ui';
  const blink = Math.floor(performance.now() / 500) % 2 ? '_' : ' ';
  ctx.fillText((net.typed + (net.typed.length < CODE_LEN ? blink : '')).padEnd(CODE_LEN, ' ').split('').join('  '), W / 2, cy + 34);
  // on-screen number pad (for mouse or touchscreen)
  const kw = Math.min(90, (bw - 16) / 3), kh = 46, kx = (W - (kw * 3 + 16)) / 2, ky = cy + 80;
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', 'C'].forEach((k, i) => {
    const x = kx + (i % 3) * (kw + 8), y = ky + Math.floor(i / 3) * (kh + 8);
    const act = k === '⌫' ? () => { net.typed = net.typed.slice(0, -1); } : k === 'C' ? () => { net.typed = ''; } : () => typeCodeDigit(k);
    button(k, x, y, kw, kh, /\d/.test(k) ? '#7df9ff' : '#9ab', act);
  });
  button('BACK  [Esc]', bx, ky + 4 * (kh + 8) + 6, bw, 40, '#9ab', () => go('online'));
}
// the public game list (see the directory code)
function drawBrowse() {
  title('PUBLIC GAMES', 60, '#ffe93d', 44);
  const rooms = sortedRooms().slice(0, 8);
  const searching = !dir.serving && !dir.conn?.open;
  fitText(dir.status || (searching ? 'Looking for public games…' : rooms.length ? `${rooms.length} game${rooms.length > 1 ? 's' : ''} found — click one to join` : 'No public games right now — host one!'), 100, 14, '#9ab');
  const rw = Math.min(560, W - 32), rx = (W - rw) / 2, rh = 54, top = 124;
  rooms.forEach((r, i) => {
    const y = top + i * (rh + 8), open = roomOpen(r);
    if (open) buttons.push({ x: rx, y, w: rw, h: rh, action: () => joinGame(r.code) });
    panel(rx, y, rw, rh, open ? '#ffe93d' : '#445', sel === i);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = open ? '#fff' : '#778'; ctx.font = 'bold 16px system-ui'; ctx.fillText(`${i + 1}.  ${r.name}`, rx + 14, y + 19);
    ctx.fillStyle = RUN_COLOR[r.run] || '#9ab'; ctx.font = '12px system-ui'; ctx.fillText(`${RUN_LABEL[r.run] || r.run}  ·  code ${r.code}`, rx + 14, y + 38);
    ctx.textAlign = 'right'; ctx.font = 'bold 15px system-ui';
    ctx.fillStyle = open ? '#9dff5d' : '#c88'; ctx.fillText(!open ? 'FULL' : r.playing ? 'JOIN GAME ▶' : 'JOIN', rx + rw - 14, y + 19);
    ctx.fillStyle = r.playing ? '#ffb13d' : '#9ab'; ctx.font = '12px system-ui'; ctx.fillText(`${r.playing ? 'in progress · ' : 'in lobby · '}${r.n} / ${MAX_ONLINE}`, rx + rw - 14, y + 38);
  });
  if (searching || !rooms.length) { // a little radar sweep while waiting
    const t = performance.now() / 1000, cy = top + 60;
    ctx.save(); ctx.strokeStyle = '#ffe93d'; ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) { const p = (t * 0.6 + k / 3) % 1; ctx.globalAlpha = 1 - p; ctx.beginPath(); ctx.arc(W / 2, cy, 8 + p * 40, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
  }
  const by = top + Math.max(2, rooms.length) * (rh + 8) + 10, bw = Math.min(300, W - 32), bx = (W - bw) / 2;
  button('HOST A PUBLIC GAME', bx, by, bw, 44, '#9dff5d', () => { net.wantPublic = true; hostGame(); });
  button('BACK  [Esc]', bx, by + 52, bw, 40, '#9ab', () => go('online'));
  ctx.font = '12px system-ui';
  wrap('The list updates by itself. Public games can be joined even after they start — you drop in with your last-used ship. Strict networks (school/work) may hide some games — use a room code then.', Math.min(460, W - 40))
    .forEach((l, i) => fitText(l, by + 112 + i * 17, 12, '#789'));
}
// host: show or hide this room on the public list
function togglePublic() {
  net.public = net.wantPublic = !net.public;
  if (net.public) dirBeat(); else dirUnlist();
  beep(net.public ? 660 : 440, 0.12, 'triangle', 0.05);
}
function drawLobby() {
  const host = net.role === 'host', me = net.mine[0] ?? 0;
  const ctrlOf = i => (CONTROLS[net.localN]?.[net.mine.indexOf(i)] || []).map(c => CONTROL_NAMES[c]).join(' / '); // (players sharing this computer)
  title('ONLINE LOBBY', 56, '#9dff5d', 44);
  fitText(net.status + (net.peer ? (relayOn ? '  ·  relay ON' : '  ·  direct only') : ''), 96, 14, '#9ab');
  if (host && net.code) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    fitText('ROOM CODE', 128, 13, '#9dff5d', 'bold');
    glow('#9dff5d', 20); fitText(net.code.split('').join(' '), 166, 44, '#ffffff', '900'); ctx.shadowBlur = 0;
  }
  // 16 slots: four columns of 4 on wide screens, two shorter columns of 8 otherwise
  const cols = W >= 1000 ? 4 : 2, per = MAX_ONLINE / cols, gap = 10, top = host ? 204 : 128;
  const full = Math.min(cols === 4 ? 1100 : 760, W - 32), cw = (full - gap * (cols - 1)) / cols, x0 = (W - full) / 2;
  const rh = cols === 4 ? 48 : Math.max(30, Math.min(48, (H - top - 190) / per - 6)), sc = rh / 48;
  for (let i = 0; i < MAX_ONLINE; i++) {
    const s = net.slots[i], c = P_COLORS[i];
    const rx = x0 + Math.floor(i / per) * (cw + gap), y = top + (i % per) * (rh + 6);
    panel(rx, y, cw, rh, s ? c : '#334', isMine(i));
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = s ? c : '#556'; ctx.font = `bold ${Math.round(14 * Math.max(0.8, sc))}px system-ui`;
    ctx.fillText(`P${i + 1}${i === 0 ? ' (host)' : ''}${isMine(i) ? (net.mine.length > 1 ? ` — you · ${ctrlOf(i)}` : ' — you') : ''}`, rx + 50 * sc + 4, y + rh * 0.33, cw - 56);
    ctx.fillStyle = s ? '#dfe8ff' : '#556'; ctx.font = `${Math.round(12 * Math.max(0.8, sc))}px system-ui`;
    ctx.fillText(s ? shipById(s.ship).name + (isMine(i) ? '  · click to change' : '') : 'open slot…', rx + 50 * sc + 4, y + rh * 0.7, cw - 56);
    if (s) { ctx.save(); ctx.translate(rx + 25 * sc, y + rh / 2); ctx.scale(0.65 * sc, 0.65 * sc); drawHull(shipById(s.ship).shape, c, 0, hullTier(shipById(s.ship)), s.cos?.skin); ctx.restore(); }
    if (isMine(i) && s) buttons.push({ x: rx, y, w: cw, h: rh, action: () => openShipSelect(1, true, net.mine.indexOf(i)) }); // click your own slot to pick a ship
  }
  const by = top + per * (rh + 6) + 10, bw = Math.min(300, W - 32), bx = (W - bw) / 2;
  const lobbyCurses = host ? cleanCurses(meta.curseSel) : net.hostCurses || [];
  fitText(`Run: ${RUN_LABEL[runType]}${host ? ' [E]' : ''}${lobbyCurses.length ? `  ·  🌀 ${lobbyCurses.length} TURBULENCE (+${Math.round(curseBonus(lobbyCurses) * 100)}%)` : ''}${host ? '  ·  turbulence [X]' : ''}${host ? `   ·   ${net.public ? `PUBLIC as "${net.roomName}"${dir.serving || dir.conn?.open ? '' : ' (getting listed…)'}` : 'PRIVATE (code only)'}  [P]` : ''}`, by + 4, 13, RUN_COLOR[runType], 'bold');
  if (!host && net.joinFail) button('TRY AGAIN  [Enter]', bx, by + 20, bw, 40, '#7df9ff', () => joinGame(net.joinFail)); // (joining didn't work)
  else button('CHANGE MY SHIP  [C]', bx, by + 20, bw, 40, P_COLORS[me], () => openShipSelect(1, true));
  if (host) {
    const n = net.slots.length;
    const ready = net.conns.length > 0; // (needs at least one friend from another computer)
    button(ready ? `START  ·  ${n} PLAYERS  [Enter]` : 'WAITING FOR FRIENDS…', bx, by + 68, bw, 44, ready ? '#9dff5d' : '#667', startOnline);
  }
  button('LEAVE  [Esc]', bx, by + (host ? 120 : 68), bw, 40, '#ff5a70', () => leaveOnline());
  if (host) button(net.public ? 'PUBLIC: anyone can join, even mid-game  [P]' : 'PRIVATE: code only  [P]', bx, by + 168, bw, 36, net.public ? '#ffe93d' : '#9ab', togglePublic);
}

let last = performance.now(), fps = 60, beatT = 0, slowT = 0;
// if the game keeps running slowly, turn PERFORMANCE MODE on by itself (only once: it can be switched back off in Settings)
function autoPerf(raw) {
  if (settings.lowfx || settings.autoPerfDone || state !== 'play' || paused || document.hidden) { slowT = 0; return; }
  slowT = fps < 45 ? slowT + raw : Math.max(0, slowT - raw * 2);
  if (slowT < 4) return;
  settings.autoPerfDone = true; toggleSetting('lowfx');
  showToast('Running slowly: PERFORMANCE MODE is now ON (Settings to change)', 4);
}
// on your last life: a heartbeat you can hear (the red screen edges are in drawVignette)
function heartbeat(dt) {
  if (state !== 'play' || paused || !run) return;
  const mine = net.role ? players.filter(p => isMine(p.id)) : players;
  if (!mine.some(p => p?.alive && p.lives === 1 && maxLivesOf(p) > 1)) { beatT = 0; return; }
  if ((beatT -= dt) <= 0) { beatT = 0.9; beep(58, 0.12, 'sine', 0.09, -8); setTimeout(() => beep(50, 0.14, 'sine', 0.07, -8), 150); }
}
let loopErrors = 0;
function loop(now) {
  requestAnimationFrame(loop); // (asked for first, so one bad frame can never stop the game for good)
  // cap big hitches (tab switches) without slowing the game down on 30-50fps machines
  const raw = (now - last) / 1000, dt = Math.min(0.05, raw); last = now;
  try {
    if (raw > 0) fps += (1 / raw - fps) * 0.05; // (smoothed, for SHOW FPS)
    if (raw < 1) autoPerf(raw); // (ignore the huge gap after switching tabs)
    heartbeat(dt);
    dirTick(dt); // public lobby list
    if (net.role === 'guest' && net.playing) guestFrame(dt);
    else {
      if (net.role === 'host' && net.playing && run) smoothRemotePlayers();
      update(dt);
      if (net.role === 'host' && net.playing && run) hostTick(dt);
    }
    draw();
  } catch (e) {
    if (loopErrors++ < 5) console.error(e); // (don't flood the console if it keeps happening)
    // a crash halfway through drawing can leave the canvas clipped or moved: start the next frame clean
    if (ctx.reset) ctx.reset(); else cv.width = cv.width;
    ctx.setTransform(DPR * net.vs, 0, 0, DPR * net.vs, DPR * net.vx, DPR * net.vy);
  }
}
requestAnimationFrame(loop);
</script>
