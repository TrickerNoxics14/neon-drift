const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR;

// ---------- online co-op state (see the "online co-op" section for how it works) ----------
const net = {
  role: null,        // null (offline) | 'host' | 'guest'
  peer: null, conns: [], host: null,
  code: '', typed: '', status: '',
  playing: false,    // a run is in progress (host simulates, guests mirror)
  myId: 0,           // the first player slot this computer controls (see mine)
  localN: 1,         // players sharing this computer in online play (1-4, chosen on the ONLINE screen)
  mine: [0],         // every player slot this computer controls
  slots: [],         // lobby: [{ ship }] per player
  sendT: 0, events: [], rewarded: false, leaveArm: 0,
  hostW: 0, hostH: 0, vs: 1, vx: 0, vy: 0, // guests draw the host's world scaled to fit their screen
  soff: undefined, lastTs: 0, ptr: [], etr: new Map(), btr: new Map(), // guests: smoothing timelines
  snapN: 0, bossSent: new WeakSet(), bossStatic: new Map(), // bosses' fixed details: host sends them rarely, guests remember them
};
// host: record a visual/sound event so guests can replay it
function netRec(ev) { if (net.role === 'host' && net.playing) net.events.push(ev); }
const isMine = i => net.mine.includes(i); // online: is this player slot controlled from this computer?
const guestView = () => net.role === 'guest' && net.playing && net.hostW > 0;

function resize() {
  let low = false; try { low = settings.lowfx; } catch (e) {} // (the very first resize runs before settings are loaded)
  DPR = Math.min(window.devicePixelRatio || 1, low ? 1 : 2); // PERFORMANCE MODE: no extra pixels on sharp screens
  const rw = window.innerWidth, rh = window.innerHeight;
  cv.width = rw * DPR; cv.height = rh * DPR;
  if (guestView()) {
    // online guest: the world is the host's size, scaled (and letterboxed) to fit this window
    W = net.hostW; H = net.hostH;
    net.vs = Math.min(rw / W, rh / H); net.vx = (rw - W * net.vs) / 2; net.vy = (rh - H * net.vs) / 2;
  } else { W = rw; H = rh; net.vs = 1; net.vx = net.vy = 0; }
  ctx.setTransform(DPR * net.vs, 0, 0, DPR * net.vs, DPR * net.vx, DPR * net.vy);
}
// screen (client) coordinates -> world coordinates
const toWorld = (cx, cy) => ({ x: (cx - net.vx) / net.vs, y: (cy - net.vy) / net.vs });
window.addEventListener('resize', resize); resize();

// ---------- settings (persist between sessions) ----------
const settings = { music: true, sfx: true, shake: true, dmgNums: true, calm: false, fps: false, lowfx: false }; // (calm = fewer flashes; lowfx = PERFORMANCE MODE)
try { Object.assign(settings, JSON.parse(localStorage.getItem('neonDriftSettings')) || {}); } catch (e) {}
resize(); // (again, now that PERFORMANCE MODE's setting is known)
function toggleSetting(key) {
  settings[key] = !settings[key];
  try { localStorage.setItem('neonDriftSettings', JSON.stringify(settings)); } catch (e) {}
  applyVolumes();
  if (key === 'lowfx') resize(); // (performance mode renders at a lower resolution)
  beep(600, 0.08, 'triangle', 0.05);
}

// ---------- audio ----------
// sound effects and music have separate buses so each can be muted; music also runs through a
// low-pass filter that muffles it while the game is paused or on the upgrade screen
let ac = null, master, sfxBus, musicBus, musicFilter, noiseBuf;
const MUSIC_LEVEL = 0.4; // the music's volume (the band is a lot fuller than the sound effects)
function ensureAudio() {
  if (ac) { if (ac.state === 'suspended' && !document.hidden) ac.resume(); return true; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.connect(master);
    musicFilter = ac.createBiquadFilter(); musicFilter.type = 'lowpass'; musicFilter.frequency.value = 18000;
    musicBus = ac.createGain(); musicBus.connect(musicFilter); musicFilter.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyVolumes();
    startMusic();
    return true;
  } catch (e) { ac = null; return false; }
}
function applyVolumes() {
  if (!ac) return;
  sfxBus.gain.value = settings.sfx ? 1 : 0;
  musicBus.gain.value = settings.music ? MUSIC_LEVEL : 0;
}

const beepLast = {};
function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  try {
    netRec(['s', freq, dur, type, vol, slide]); // guests hear the host's sounds
    if (!ensureAudio()) return;
    // skip near-duplicate sounds fired within a few ms (e.g. 4 players' guns) to avoid audio stutter
    const key = type + (freq / 40 | 0), now = ac.currentTime;
    if (now - (beepLast[key] || 0) < 0.035) return;
    beepLast[key] = now;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(sfxBus);
    o.start(now); o.stop(now + dur);
  } catch (e) {}
}

// engine trails: each screen keeps its own short history of every ship's position (nothing goes over the network)
function drawTrail(p) {
  let style = cosOf(p).trail;
  if (style === 'trail_none' || !p.alive) { p.trailPts = null; return; }
  const pts = p.trailPts ||= [];
  pts.push([p.x, p.y + 12]); if (pts.length > 20) pts.shift();
  const t = performance.now() / 1000;
  if (style === 'trail_signature') { // a mastered ship's own trail: a ribbon in its colors, with ghost copies of the ship in it
    const sig = SIGNATURE[shipBase(p)];
    if (sig && (p.remote || masteryLv(shipBase(p)) >= MASTERY_MAX)) { drawSignatureTrail(p, pts, sig, t); return; }
    style = 'trail_comet';
  }
  ctx.save(); ctx.lineCap = 'round';
  for (let i = 1; i < pts.length; i++) {
    const k = i / pts.length, [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    ctx.globalAlpha = k * 0.85;
    if (style === 'trail_comet') { ctx.strokeStyle = p.color; ctx.lineWidth = 2 + k * 7; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
    else if (style === 'trail_rainbow') { ctx.strokeStyle = RAINBOW[(i + Math.floor(t * 12)) % RAINBOW.length]; ctx.lineWidth = 3 + k * 6; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
    else if (style === 'trail_void') {
      ctx.strokeStyle = '#ff1f3d'; ctx.lineWidth = 4 + k * 10; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2 + k * 7; ctx.stroke();
    } else if (style === 'trail_hearts') { // little hearts, bobbing as they drift off
      if (i % 3) continue;
      ctx.fillStyle = ['#ffd6ec', '#ff9ccf', '#ff4fa3'][Math.min(2, Math.floor(k * 3))];
      ctx.beginPath(); heartPath(x1 + Math.sin(i * 1.7 + t * 5) * 4, y1 + (1 - k) * 6, 1.5 + k * 3.5); ctx.fill();
    } else { // particle-style trails: fire, ice, gold
      const cols = style === 'trail_fire' ? ['#ff3d3d', '#ff9a3d', '#ffe93d'] : style === 'trail_ice' ? ['#5dc8ff', '#bfefff', '#ffffff'] : ['#c9a227', '#ffd23d', '#fff3b0'];
      ctx.fillStyle = cols[Math.min(2, Math.floor(k * 3))];
      const jx = style === 'trail_gold' ? Math.sin(i * 7.3 + t * 9) * 6 : (Math.random() - 0.5) * 4, r = style === 'trail_fire' ? 1.5 + k * 5 : 1 + k * 3;

    }

}

// ---------- ship mastery: every ship levels up (1-5) as you fly it; level 5 earns its Signature trail ----------
const MASTERY_XP = [0, 150, 400, 800, 1400], MASTERY_MAX = 5, MASTERY_SHARDS = [0, 0, 50, 100, 150, 250]; // (shards for reaching each level)
const masteryXp = id => meta.mastery?.[id] | 0;
const masteryLv = id => MASTERY_XP.filter(x => masteryXp(id) >= x).length;
// colors of each ship's Signature trail
const SIGNATURE = { striker: ['#7df9ff', '#ffffff'], interceptor: ['#5dffc8', '#3d9dff'], juggernaut: ['#ffb13d', '#ff6a2d'], scatter: ['#ff5dc8', '#ffe93d'],
  piercer: ['#bff8ff', '#5d8dff'], medic: ['#5dff7a', '#ffffff'], wraith: ['#c08dff', '#6a3dff'], carrier: ['#ffe93d', '#9db4c8'], berserker: ['#ff3050', '#ff9a3d'], gunslinger: ['#ffb86b', '#fff3d0'], bomber: ['#ff6a2d', '#ffe93d'], summoner: ['#c08dff', '#7df9ff'] };
function drawSignatureTrail(p, pts, [c1, c2], t) {
  ctx.save(); ctx.lineCap = 'round'; glow(c1, 12);
  for (let i = 1; i < pts.length; i++) { // two twisting ribbons
    const k = i / pts.length, [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    for (const [c, s] of [[c1, 1], [c2, -1]]) {
      const w0 = Math.sin(t * 8 + (i - 1) * 0.6) * 6 * s * k, w1 = Math.sin(t * 8 + i * 0.6) * 6 * s * k;
      ctx.globalAlpha = k * 0.8; ctx.strokeStyle = c; ctx.lineWidth = 1.5 + k * 3.5;
      ctx.beginPath(); ctx.moveTo(x0 + w0, y0); ctx.lineTo(x1 + w1, y1); ctx.stroke();
    }
  }
  ctx.shadowBlur = 0; ctx.lineWidth = 1.2;
  const h = HULLS[p.ship.shape] || HULLS.striker;
  for (let i = 3; i < pts.length; i += 5) { // fading ghosts of the ship itself
    const k = i / pts.length, [x, y] = pts[i];
    ctx.save(); ctx.translate(x, y - 12); ctx.scale(0.55, 0.55); ctx.globalAlpha = k * 0.45; ctx.strokeStyle = i % 2 ? c1 : c2;
    ctx.beginPath(); for (const [hx, hy] of h.pts) ctx.lineTo(hx, hy); ctx.closePath(); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
}
// after a run: XP for every ship this computer flew (the shards the run paid); returns the level-ups to show
function gainMastery(ships, xp) {

  for (const id of new Set(ships)) {
    if (!SIGNATURE[id] || xp <= 0) continue;
    const before = masteryLv(id);
    meta.mastery[id] = masteryXp(id) + Math.round(xp);
    for (let lv = before + 1; lv <= masteryLv(id); lv++) {
      meta.shards += MASTERY_SHARDS[lv]; ups.push({ id, lv });
      if (lv >= MASTERY_MAX) unlockAch('master');
    }
  }
  saveMeta();
  return ups;
}

const abCardOk = u => !(u.ab || u.ship) || (!curse('powerless') && (!u.ship || players.some(p => !p.gone && shipBase(p) === u.ship)));

// how likely a card is to be offered (Loaded Deck makes rare and epic cards more common)
const cardWeight = u => RARITY[u.r].w * (u.r === 'common' ? 1 : 1 + 0.35 * metaLv('cards'));
// evolutions whose ingredients you own (at the needed levels) and haven't taken yet
const EVOLUTIONS = UPGRADES.filter(u => u.r === 'evo');
const evoReady = () => EVOLUTIONS.filter(u => !run.owned[u.id] && u.needs.every(([id, lv]) => (run.owned[id] || 0) >= lv));
// the evolutions a card leads to: [[evolution, the other ingredient], ...] (for the hint on upgrade cards)
const evoHints = u => EVOLUTIONS.filter(e => !run.owned[e.id] && e.needs.some(([id]) => id === u.id))
  .map(e => [e, UPGRADES.find(x => x.id === e.needs.find(([id]) => id !== u.id)[0])]);
function rollCards(n, bossReward, noEvo) {
  const pool = UPGRADES.filter(u => u.r !== 'evo' && (run.owned[u.id] || 0) < u.max && (!u.when || u.when()) && abCardOk(u) && (!bossReward || u.r !== 'common'));
  const out = noEvo ? [] : evoReady().slice(0, 1); // a ready evolution always takes the first slot
  while (out.length < n && pool.length) {
    const total = pool.reduce((t, u) => t + cardWeight(u), 0);
    let roll = Math.random() * total, i = 0;
    while ((roll -= cardWeight(pool[i])) > 0) i++;
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}

function buildBossOrder() {

function buildRushOrder() {

function updateLinks(dt) {

}

// where "NEW ENEMY" callouts go (lower down while a zone's title card is showing)
const introY = () => zoneCard ? H * 0.5 : H * 0.32;
function spawnEnemy() {
  const pool = SPAWN_TABLE.filter(s => level >= s.from), bias = curZone().bias || {};
  // the tougher types (anything unlocked after sector 2) get more common the deeper you go; each zone has its regulars
  const weight = s => s.w * (s.from >= 3 ? 1 + (level - s.from) * 0.15 : 1) * (bias[s.type] || 1);
  let roll = Math.random() * pool.reduce((t, s) => t + weight(s), 0), type = pool[0].type;
  for (const s of pool) if ((roll -= weight(s)) <= 0) { type = s.type; break; }

  // introduce each new enemy the first time it shows up in a run
  const key = type === 'swarm' ? 'swarmer' : type;
  if (!run.seenEnemies[key]) {
    run.seenEnemies[key] = true;
    fxText(`NEW ENEMY: ${TYPES[key].label}`, W / 2, introY(), TYPES[key].color, 20, 2.2);
  }

  if (type === 'swarm') {
    const cx = 80 + Math.random() * (W - 160);
    for (let i = -2; i <= 2; i++) makeEnemy('swarmer', cx + i * 26, -20 - Math.abs(i) * 22);
  } else if (type === 'bomber') {
    const left = Math.random() < 0.5;
    makeEnemy('bomber', left ? -30 : W + 30, 70 + Math.random() * H * 0.3);
  } else if (type === 'serpent') {
    const x = 80 + Math.random() * (W - 160), head = makeEnemy('serpent', x, -20);
    for (let i = 1; i <= 7; i++) { const s = makeEnemy('segment', x, -20 - i * 12); s.head = head; s.idx = i; s.vx = s.vy = 0; }
  } else if (type === 'linker') { // two drones joined by a beam that sweeps down the screen
    const gap = Math.min(W - 80, 160 + Math.random() * 140), cx = gap / 2 + 40 + Math.random() * (W - gap - 80);
    const [a, b] = [-1, 1].map(side => { const e = makeEnemy('linker', cx + side * gap / 2, -20); e.side = side; e.t = 0; return e; });
    a.mate = b; b.mate = a;
  } else {
    const r = TYPES[type].r;
    // (not right on top of the last few that came in: they spread out across the top)
    const recent = run.spawnXs ||= [], s = spreadSpot(recent.map(x => [x, 0]), Math.min(110, W / 6), () => [r + Math.random() * (W - r * 2), 0]);
    const x = s ? s[0] : r + Math.random() * (W - r * 2);
    recent.unshift(x); if (recent.length > 3) recent.pop();
    const e = makeEnemy(type, x, -r * 2);
    if (level >= 3 && Math.random() < eliteChance()) makeElite(e);
  }
}

// ---------- elite enemies: rare, tougher versions with a special power; they always drop loot ----------
const ELITES = {
  armored:  { name: 'ARMORED',  color: '#ffd23d', desc: 'four times the health' },

const ELITE_LIST = Object.keys(ELITES);
const eliteChance = () => Math.min(0.2, 0.025 + (level - 3) * 0.012);
function makeElite(e) {
  const pool = ELITE_LIST.filter(k => k !== 'splitting' || e.r < 22); // (no splitting tanks or carriers)
  const k = pool[Math.floor(Math.random() * pool.length)];
  e.elite = k; e.r = Math.round(e.r * 1.25); e.pts *= 3;
  e.hp = e.maxHp = Math.max(4, Math.ceil(e.maxHp * (k === 'armored' ? 4 : 2.5)));
  if (!run.seenElite) { run.seenElite = true; fxText('ELITE ENEMY — IT DROPS LOOT!', W / 2, introY(), ELITES[k].color, 20, 2.4); }
}
// what happens when an elite dies (called from killEnemy)
function eliteDeath(e) {
  const k = e.elite;
  run.coins = (run.coins || 0) + 10;
  popups.push({ x: e.x, y: e.y - 22, text: '+10 ●', life: 1, color: '#ffd23d' });
  pickups.push({ x: e.x, y: e.y, kind: ['power', 'shield', 'life'][Math.floor(Math.random() * 3)], t: 0 });
  fxRing(e.x, e.y, e.r, e.r * 3, 0.4, ELITES[k].color, 4);
  if (k === 'volatile') for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, r: 5, color: ELITES[k].color }); }
  if (k === 'splitting') for (const side of [-1, 1]) {
    const m = makeEnemy(e.type, e.x + side * e.r, e.y);
    m.vx = side * 90; m.hp = m.maxHp = Math.max(1, Math.ceil(e.maxHp / 5));
  }
}
let enemyIdSeq = 0; // online guests match enemies between snapshots by id
function makeEnemy(type, x, y) {

  // enemies toughen each sector to keep pace with your upgrades; a bit more in co-op
  const hp = Math.ceil(t.hp * (1 + (level - 1) * 0.3) * (1 + 0.5 * mut('armored'))) + (t.hp > 1 ? mode - 1 : 0);
  const e = { type, x, y, r: t.r, hp, maxHp: hp, color: t.color, pts: t.pts, vx: 0, vy: speed,
    t: Math.random() * 10, spin: 0, fire: 1 + Math.random() * 2, flash: 0, state: 'enter', timer: 0, aimA: Math.PI / 2, id: ++enemyIdSeq };
  switch (type) {

    case 'orbiter':  e.vy = speed * 0.45; break;
    case 'warper':   e.vy = 140; e.fire = 1.2; e.life = 13; break;
    case 'serpent':  e.vy = speed * 0.55; e.trail = []; break;
    case 'guardian': e.vy = 110; e.stopY = 50 + Math.random() * H * 0.2; e.stay = 15; break;
    case 'carrier':  e.vy = speed * 0.22; e.fire = 1.5; break;
    case 'kamikaze': e.vy = 150; e.life = 7; break;
    case 'spinner':  e.vy = speed * 0.35; e.fire = 0.6; break;
    case 'layer':    e.vy = speed * 0.3; e.fire = 1.2; break;
    case 'mine':     e.vx = e.vy = 0; e.timer = 0.8; e.life = 9; break; // arms after 0.8s
    case 'piker':    e.vy = 140; e.stopY = 60 + Math.random() * H * 0.2; e.stay = 12; break;

    case 'bouncer':  e.vx = (Math.random() < 0.5 ? -1 : 1) * 190; e.vy = 170; e.life = 12; break;
    case 'shade':    e.vy = 60; e.life = 16; break;
    case 'vortex':   e.vy = 38; break;
    case 'mortar':   e.vy = 120; e.stopY = 40 + Math.random() * 90; e.stay = 14; e.fire = 1.5; break;
    case 'shell':    e.vx = e.vy = 0; e.timer = 1.3; break; // seconds until it lands
    case 'mimic':    e.vy = 0; e.x = 40 + Math.random() * (W - 80); e.y = H * (0.25 + Math.random() * 0.3); e.state = 'disguise'; e.life = 14; break;
    case 'sapper':   e.vy = 160; e.life = 14; break;
    case 'sentry':   e.side = Math.random() < 0.5 ? -1 : 1; e.x = e.side < 0 ? -20 : W + 20; e.y = 70 + Math.random() * H * 0.45; e.vx = -e.side * 110; e.vy = 0; e.stay = 14; e.fire = 1.2; break;
    case 'launcher': e.vy = speed * 0.35; e.fire = 2; break;
    case 'rocket':   e.life = 5; break;
    case 'mirror':   e.vy = 120; e.stopY = 50 + Math.random() * 60; e.stay = 12; e.fire = 1; break;
    case 'firework': e.x = 40 + Math.random() * (W - 80); e.y = H + 30; e.vy = 0; e.state = 'warn'; e.timer = 0.9; e.stopY = H * (0.2 + Math.random() * 0.3); break;
    case 'magnet':   e.vy = speed * 0.3; e.loot = []; break;

// enemy guns reload faster as sectors go on (down to 60% of the base delay by sector 14)
const enemyFireScale = () => Math.max(0.6, 1 - (level - 1) * 0.03);

const GUARD_RANGE = 140;
const orbiterBall = (e, k) => { const a = e.t * 3 + k * Math.PI * 2 / 3; return { x: e.x + Math.cos(a) * 36, y: e.y + Math.sin(a) * 36 }; };

// height of each player's line in the HUD's top-right list (compact for 5-8 online players)
const hudRowH = () => players.length > 8 ? 13 : players.length > 4 ? 20 : 48;

const turnToward = (a, want, max) => {
  const d = ((want - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  return a + Math.max(-max, Math.min(max, d));
};

const LINK_WARM = 1, BULWARK_ARC = 1; // linkers' beam warm-up (s); half-width of a bulwark's shield (radians)
// kamikazes and mines: blow up into a ring of bullets (this isn't a kill, so no score)
function enemyBoom(e, n, speed) {
  e.dead = true;
  const off = Math.random() * Math.PI;
  for (let i = 0; i < n; i++) { const a = off + i / n * Math.PI * 2; eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5, color: e.color }); }
  burst(e.x, e.y, e.color, 25, 260); if (bossFx.rings.length < 40) fxRing(e.x, e.y, 4, 60, 0.3, e.color, 3);
  beep(160, 0.2, 'square', 0.05, -100); shake = Math.max(shake, 5);
}
const SHADE_REVEAL = 170, SHELL_R = 48, SAP_TIME = 5, BOUNCER_MAX = 400, VORTEX_R = 120;
const MAGNET_R = 260, PUDDLE_LIFE = 3.2, METEOR_WARN = 1.5, METEOR_SPEED = 540, BOLT_WARN = 1.4, BOLT_R = 58, BOLT_FLASH = 0.25;
const puddleR = e => e.r * (0.45 + 0.55 * Math.max(0, e.timer) / PUDDLE_LIFE); // (puddles shrink as they dry up)
const angleDiff = (a, b) => ((a - b) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
// per-type behavior, run every frame after the enemy moves by its velocity
const ENEMY_AI = {
  drifter(e, dt) { e.x += Math.sin(e.t) * 40 * dt; },
  zigzag(e, dt) { e.x += Math.sin(e.t * 4) * 220 * dt; },
  swarmer(e, dt) { e.x += Math.sin(e.t * 3) * 60 * dt; },
  shooter(e, dt) {
    if (e.y > H * 0.3) e.vy = Math.max(20, e.vy - 200 * dt);
    e.fire -= dt;
    const tgt = nearestPlayer(e.x, e.y);
    if (e.fire <= 0 && e.y > 0 && tgt) {
      e.fire = 1.6 * enemyFireScale(); // gunners fire faster in later sectors
      const a = Math.atan2(tgt.y - e.y, tgt.x - e.x);
      eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260 });
      beep(220, 0.08, 'triangle', 0.03);
    }
  },
  dasher(e, dt) { // stops, locks on, then rockets toward where you were
    if (e.state === 'enter') {
      if (e.y >= e.stopY) { e.state = 'aim'; e.vy = 0; e.timer = 0.9; }
    } else if (e.state === 'aim') {
      const tgt = nearestPlayer(e.x, e.y);
      if (tgt && e.timer > 0.25) e.aimA = Math.atan2(tgt.y - e.y, tgt.x - e.x);
      e.timer -= dt;
      if (e.timer <= 0) {
        e.state = 'dash'; e.vx = Math.cos(e.aimA) * 650; e.vy = Math.sin(e.aimA) * 650;
        beep(500, 0.15, 'sawtooth', 0.03, -300);
      }
    } else if (Math.random() < dt * 40) {
      particles.push({ x: e.x, y: e.y, vx: -e.vx * 0.1, vy: -e.vy * 0.1, life: 0.3, max: 0.3, color: e.color, size: 3 });
    }
  },
  seeker(e, dt) { // steers toward the nearest player, then gives up and flies off
    e.life -= dt;
    let a = Math.atan2(e.vy, e.vx);
    const tgt = nearestPlayer(e.x, e.y);
    if (tgt && e.life > 0) a = turnToward(a, Math.atan2(tgt.y - e.y, tgt.x - e.x), 2.2 * dt);
    const sp = 140 + Math.min(level, 10) * 6;
    e.vx = Math.cos(a) * sp; e.vy = Math.sin(a) * sp; e.aimA = a;
    if (Math.random() < dt * 20) particles.push({ x: e.x - e.vx * 0.08, y: e.y - e.vy * 0.08, vx: 0, vy: 0, life: 0.25, max: 0.25, color: e.color, size: 2 });
  },
  splitter(e, dt) { e.x += Math.sin(e.t * 1.5) * 30 * dt; },
  mini(e, dt) { e.vx *= 0.97; e.vy = Math.min(e.vy + 200 * dt, 220); },
  bomber(e, dt) { // crosses the screen sideways dropping mines
    e.y += Math.sin(e.t * 2) * 12 * dt;
    e.fire -= dt;
    if (e.fire <= 0 && e.x > 20 && e.x < W - 20) {
      e.fire = 1.3;
      eBullets.push({ x: e.x, y: e.y + e.r * 0.5, vx: 0, vy: 70, r: 9, color: e.color, fuse: 1.6 });
      beep(140, 0.1, 'triangle', 0.03);
    }
  },
  sniper(e, dt) { // parks near the top, tracks you with a laser sight, then fires a fast shot
    if (e.state === 'enter') { if (e.y >= e.stopY) { e.state = 'hover'; e.vy = 0; } return; }
    if (e.state === 'leave') return;
    e.x += Math.sin(e.t * 0.8) * 50 * dt;
    e.stay -= dt;
    if (e.stay <= 0) { e.state = 'leave'; e.vy = 140; e.aiming = false; return; }
    const tgt = nearestPlayer(e.x, e.y);
    e.fire -= dt;
    e.aiming = e.fire < 1.2;
    if (e.aiming && tgt && e.fire > 0.3) e.aimA = Math.atan2(tgt.y - e.y, tgt.x - e.x); // locks for the last 0.3s
    if (e.fire <= 0) {
      e.fire = 3.2 * enemyFireScale(); e.aiming = false;
      eBullets.push({ x: e.x + Math.cos(e.aimA) * e.r, y: e.y + Math.sin(e.aimA) * e.r, vx: Math.cos(e.aimA) * 480, vy: Math.sin(e.aimA) * 480, r: 4, color: e.color });
      beep(900, 0.12, 'square', 0.03, -600);
    }
  },
  bloodorb(e, dt) { // drifts out, then homes back to its Leech and heals it on arrival
    const b = e.owner;
    if (!b || !bosses.includes(b) || !bossAlive(b)) { e.dead = true; burst(e.x, e.y, e.color, 4, 60); return; }
    const d = Math.hypot(b.x - e.x, b.y - e.y) || 1, sp = Math.min(230, 40 + e.t * 110);

// ---------- shooting ----------
// kind: undefined (normal shot), 'missile' (homing, explodes) or 'rail' (huge piercing slug)
// p (optional): the ship that fired, whose class modifies damage, pierce and bullet speed
function fire(x, y, a, color, kind, p) {
  color = bulletColorOf(p, color); // (cosmetic bullet colors)
  const s = run.s, m = p ? p.ship.mod : {}, crit = Math.random() < s.crit;
  const speed = kind === 'rail' ? 1500 : kind === 'missile' ? 420 : s.bulletSpeed * (m.bulletSpeed || 1) * (kind === 'bomb' ? BOMB_SPEED : 1);
  const rage = p && m.rage ? 1 + m.rage * Math.max(0, maxLivesOf(p) - p.lives) : 1; // Berserker: stronger when hurt
  const mult = (kind === 'rail' ? 8 : kind === 'missile' ? 2 : 1) * (crit ? (s.vampire ? 5 : 3) : 1) * (m.dmg || 1) * rage // (Vampire Rounds: 5x crits)
    * (p && abActive(p, 'berserker') ? 2 : 1) * (curse('glass') ? 1.5 : 1) * (1 + EVO_DMG * evoTier()); // (RAMPAGE, the GLASS CANNON curse, evolved ships)

    pierce: kind === 'rail' ? 999 : kind === 'missile' || kind === 'bomb' ? 0 : s.pierce + (m.pierce || 0) + (m.noGuns && abm('summoner') ? 1 : 0),

    missile: kind === 'missile', rail: kind === 'rail', owner: p ? p.id : -1,
    ...(kind === 'bomb' ? { bomb: true, fuse: BOMB_FUSE, blast: (m.blast || 70) * (abm('bomber') ? 1.35 : 1) + s.explosive * 12 } : {}) });
}

// ---------- dealing damage ----------

// lightning jumps from enemy to enemy

    let best = null, bd = 170;

    if (!best) break;

    netRec(['z', Math.round(x), Math.round(y), Math.round(best.x), Math.round(best.y)]);
    x = best.x; y = best.y;
    damageEnemy(best, dmg, 'chain');
  }
  if (hit.size) beep(1400, 0.08, 'sawtooth', 0.025, -900);
}

  for (const o of enemies) if (o !== except && !o.dead && Math.hypot(o.x - x, o.y - y) < radius + o.r) damageEnemy(o, dmg, 'splash');

// BOMBER: its bombs fly slowly, then blow up on whatever they touch (or when their fuse runs out), hitting everything around

// Orbital Blades: damage what they touch (with a short per-target cooldown) and delete enemy bullets

// distance from point (px,py) to the segment a-b (for the Sol & Luna tether)
function distToSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;

}

// team mechanics that involve both bosses at once
function updateEncounter(dt) {

  if (b.style === 'abyss') return { x: W / 2 + Math.sin(b.t * 0.25) * W * 0.18, y: hoverY + 30 + Math.sin(b.t * 0.7) * 14 }; // a slow, looming drift
  if (b.style === 'wyrm') return { x: W / 2 + Math.sin(b.t * 0.55) * (W / 2 - 60), y: H * 0.28 + Math.sin(b.t * 0.9) * H * 0.13 }; // slithers across the top half

    return { x: W / 2 + Math.cos(a) * R, y: cy + Math.sin(a) * R * 0.55 };

// ----- THE ABYSS: tentacles, eruptions -----
const ABYSS_INK = '#0b0006'; // its bullets: black, with a red rim (see drawWorld)
const TENT_N = 10, TENT_SEG = 12;
const LASH_WARN = 0.75, LASH_OUT = 0.16, LASH_HOLD = 0.3, LASH_BACK = 0.55;
const ERUPT_WARN = 1.0, ERUPT_END = 1.9, ERUPT_W = 30;

const GRASP_LOCK = 0.25, GRASP_CLOSE = 1.15, GRASP_END = 1.9, GRASP_R = 62;                    // the hands
const DELUGE_T = 2.4, DELUGE_GAP = 150, WHISPER_T = 3.2;

  1: ['lash', 'ink', 'stare', 'eruption', 'grasp', 'lash', 'deluge'],
  2: ['lash', 'ink', 'eruption', 'maw', 'stare', 'grasp', 'brood', 'deluge', 'spiral'],

  const ps = living(), byId = id => ps.find(p => p.id === id) || ps[0];
  for (const E of b.voidEyes) { // eyes: [x, y, age, aim, target]: open, track you, lock on (a red line), fire a beam, close
    E[2] = r2(E[2] + dt);
    const p = byId(E[4]);
    if (E[2] < STARE_LOCK && p) E[3] = r2(Math.atan2(p.y - E[1], p.x - E[0]));
    if (E[2] >= STARE_FIRE && E[2] - dt < STARE_FIRE) { beep(180, 0.3, 'sawtooth', 0.05, 300); shake = Math.max(shake, 4); }
    if (E[2] >= STARE_FIRE && E[2] < STARE_FIRE + STARE_BEAM) {

      for (const q of ps) if (distToSeg(q.x, q.y, E[0], E[1], ex, ey) < STARE_W / 2 + q.r * 0.4) hurt(q);
    }
  }
  b.voidEyes = b.voidEyes.filter(E => E[2] < STARE_END);
  for (const Hd of b.hands) { // hands: [x, y, side, age, target]: follow you a moment, lock on, close with a crunch, pull back
    Hd[3] = r2(Hd[3] + dt);
    const p = byId(Hd[4]);
    if (Hd[3] < GRASP_LOCK && p) { Hd[0] = Math.round(p.x); Hd[1] = Math.round(p.y); }
    if (Hd[3] >= GRASP_CLOSE && Hd[3] - dt < GRASP_CLOSE) { shake = Math.max(shake, 14); beep(70, 0.35, 'square', 0.1, -40); burst(Hd[0], Hd[1], b.color, 18, 220); }

    const d = b.deluge, gx = d.x + d.dir * d.t * 70;
    d.t += dt; d.acc += dt;

      const x = Math.random() * W; if (Math.abs(x - gx) < DELUGE_GAP / 2) continue;
      eBullets.push({ x, y: -8, vx: 0, vy: (240 + Math.random() * 80) * BOSS_BULLET_SPEED, r: 6, color: ABYSS_INK, src: b });

        b.charge = next ? { phase: 'aim', t: 0.4, tx: next.x, ty: next.y, combo: c.combo - 1 } : null; shake = Math.max(shake, 14);
        if (c.sx !== undefined) { // Void Lancer: leaves a rift behind and knocks itself silly
          b.rifts.push([Math.round(c.sx), Math.round(c.sy), Math.round(b.x), Math.round(b.y), 0]);
          b.stun = enraged ? 1.7 : 2.3; shake = Math.max(shake, 22);
          fxText('STUNNED! ×2 DAMAGE', b.x, Math.max(40, b.y - b.r - 30), '#ffffff', 24, 1.6);
          beep(80, 0.6, 'square', 0.08, -30);
        }
        fxRing(b.x, b.y, b.r * 0.8, b.r * 3.5, 0.45, b.color, 5); burst(b.x, b.y, '#ffffff', 30, 300);
        if (enraged) for (let i = 0; i < 12; i++) bossShot(b, i / 12 * Math.PI * 2, 180);
      }
    }
  } else {
    // drift toward home (a sweep, an orbit, a mirror position...) — also recovers smoothly after charges and teleports
    const home = bossHome(b, enraged, hoverY);
    const k = Math.min(1, dt * (encounter && encounter.kind === 'binary' ? 3 : b.role === 'shielder' ? 1.2 : 2));
    b.x += (home.x - b.x) * k;
    b.y += (home.y - b.y) * k;
  }

  // cycle attack patterns (the final boss picks at random)
  b.patternT += dt;
  if (b.patternT > 4.5) {
    b.patternT = 0; b.atkT = 0.6;
    b.pattern = b.final ? Math.floor(Math.random() * b.patterns.length) : (b.pattern + 1) % b.patterns.length;
  }
  b.atkT -= dt;
  // charge-up before a big attack: energy is sucked into the core
  if (b.bigAtk && !b.charge && b.atkT > 0 && b.atkT < 0.45 && Math.random() < dt * 45) {
    const a = Math.random() * Math.PI * 2, d = b.r * (1.8 + Math.random() * 0.8);
    particles.push({ x: b.x + Math.cos(a) * d, y: b.y + Math.sin(a) * d, vx: -Math.cos(a) * d * 2.4, vy: -Math.sin(a) * d * 2.4,
      life: 0.4, max: 0.4, color: Math.random() < 0.3 ? '#ffffff' : b.color, size: 2.5 });
  }
  if (b.atkT > 0 || b.charge || gim === 'quiet' || fury === 'quiet') return;
  const atk = b.patterns[b.pattern];
  BOSS_ATTACKS[atk](b, enraged, rate, tgt);
  if (b.special?.k === 'mirror' && MIRRORED.includes(atk)) BOSS_ATTACKS[atk]({ ...b, x: W - b.x }, enraged, rate, tgt); // ECHO's mirror image fires too
  GIMMICKS[b.gimmick]?.afterAttack?.(b, enraged);
  // recoil: big attacks punch outward with a shockwave, rapid-fire ones just twitch
  b.bigAtk = b.atkT >= 0.5;
  if (b.bigAtk) { b.kick = 1; fxRing(b.x, b.y, b.r * 0.8, b.r * 2.6, 0.45, b.color, 4); }
  else b.kick = Math.max(b.kick, 0.3);
}

// returns false if the hit was blocked (shield) or didn't count
function hitBoss(b, dmg, fx, fy) {
  if (!bossAlive(b)) return false;
  if (b.shielded) { // Aegis' shield: no damage, just a flash and a ping
    if (b.shieldHit <= 0) beep(1500, 0.04, 'triangle', 0.02);
    b.shieldHit = 0.12; return false;
  }
  const g = GIMMICKS[b.gimmick];
  if (g && b.entered) {
    dmg *= g.dmg?.(b, fx, fy) ?? 1;
    if (dmg <= 0) return false;
    g.onHit?.(b, dmg);
  }
  if (ascendOf(b) && b.entered) { if (b.xf >= 0) return false; if (b.super) dmg *= ascendOf(b).armor; }
  b.hp -= dmg; b.flash = 0.06; b.lastHit = time;
  dmgNumber(b, dmg, true);
  b.hitKick = Math.min(1, b.hitKick + 0.15);
  if (b.hp > 0) return true;
  if (ascendOf(b) && !b.super && !b.nemesis && bosses.length === 1) { startAscend(b); return true; } // (its second life)
  b.hp = 0;
  const partner = bosses.find(o => o !== b);
  if (encounter.kind === 'twins' && partner && bossAlive(partner)) {
    // soul link: this twin falls, and comes back unless its twin goes down too
    b.downed = true; b.reviveT = TWIN_REVIVE(); b.charge = null;
    burst(b.x, b.y, b.color, 60, 350); fxRing(b.x, b.y, b.r, b.r * 3, 0.5, b.color, 4);
    fxText(`${b.name} DOWN!`, b.x, b.y - b.r - 30, b.color, 28, 1.6);
    showToast(`Destroy ${partner.name} before ${b.name} revives!`);
    netRec(['o', `Destroy ${partner.name} before ${b.name} revives!`]);
    bossRoar(b, false); shake = Math.max(shake, 12);
    return true;
  }
  startBossDeath(b);
  if (partner && partner.downed) { partner.downed = false; startBossDeath(partner); } // twins fall together
  if (encounter.kind === 'aegis' && b.role === 'shielder' && partner) {
    partner.shielded = false; partner.forceRage = true;
    fxRing(partner.x, partner.y, partner.r * 1.4, partner.r * 4, 0.5, '#5dff7a', 5); burst(partner.x, partner.y, '#5dff7a', 60, 400);
    fxText('SHIELD DOWN!', partner.x, partner.y - partner.r - 30, '#5dff7a', 28, 1.6);
  }
  // losing a partner enrages the rest
  if (['binary', 'triad', 'quartet'].includes(encounter.kind)) for (const o of bosses) if (o !== b && bossAlive(o)) o.forceRage = true;
  return true;
}

// achievements for winning a boss fight (called once, when its last boss is gone)
function onEncounterBeaten(enc, last) {
  unlockAch('first_boss');
  logBoss(enc.name, enc.t0 !== undefined ? time - enc.t0 : undefined);
  if (run.practice?.hard && meta.bossLog[enc.name]) { meta.bossLog[enc.name].hard = true; saveMeta(); }
  run.coins = (run.coins || 0) + (run.rush ? 60 : 30); // shop money (Boss Rush has few other kills)
  if (!enc.hitTaken) unlockAch('flawless');
  if (living().some(p => p.lives === 1 && maxLivesOf(p) > 1)) unlockAch('clutch');
  if (last.final) { unlockAch('omega'); clearAbyssMark(); if (Object.keys(run.curses || {}).length >= 3) unlockAch('cursed'); }
  if (last.secret) unlockAch('zero');
  if (last.nemesis) unlockAch('nemesis');
  if (last.gimmick === 'doki') unlockAch('doki');
  if (last.gimmick === 'sonnet') unlockAch('golden');
  if (last.gimmick === 'dawnny') unlockAch('dawnny');
  if (enc.kind === 'twins' && !enc.revived) unlockAch('twins');
  if (enc.kind === 'binary' && !enc.tetherHit) unlockAch('tether');
  if (enc.kind === 'aegis') unlockAch('aegis');
  if (enc.kind === 'triad') unlockAch('triad');
  if (enc.kind === 'quartet') unlockAch('quartet');
  if (enc.name === 'THE LEECH' && !enc.orbHealed) unlockAch('starved');
  if (enc.kind !== 'single' && mode > 1 && !enc.anyDowned) unlockAch('teamwork');
  if (run.owned.glass) unlockAch('glass');
  for (const p of living()) meta.stats.bossShips[p.ship.id] = true;
  if (Object.keys(meta.stats.bossShips).length >= 4) unlockAch('versatile');
  saveMeta();
}

function startBossDeath(b) {
  b.dying = DEATH_TIME; b.charge = null; b.drain = null;
  b.cracks = Array.from({ length: 8 }, () => ({ a: Math.random() * Math.PI * 2, len: 0.6 + Math.random() * 0.5, bend: (Math.random() - 0.5) * 0.8 }));
  if (!b.charmed) bossRoar(b, true);
  addScore(5000 * bossCount * (encounter.kind === 'single' ? 1 : 0.6)); // no combo multiplier: it made boss kills dwarf everything
  if (bosses.every(o => o.dying > 0)) { // the whole encounter is beaten: clear the screen
    for (const e of eBullets) burst(e.x, e.y, e.color || '#ff8080', 3, 80);
    eBullets = []; lasers = [];
  }
}

// ---------- players ----------
const REVIVE_TIME = 2.5, REVIVE_RANGE = 70;

// earned: true when a teammate brought them back (not the automatic rejoin at a new sector)
function revive(p, by, earned) {
  if (earned) { meta.stats.revives++; unlockAch('revive'); if (meta.stats.revives >= 10) unlockAch('revive10'); }
  p.alive = true; p.lives = 1; p.inv = 2.5; p.power = 0; p.shield = 0;
  if (p.wreck) { p.x = p.wreck.x; p.y = p.wreck.y; }
  else { p.x = by ? by.x : W / 2; p.y = by ? Math.min(H - 40, by.y + 40) : H - 100; }
  p.wreck = null; p.reviveProg = 0;
  burst(p.x, p.y, p.color, 40, 300);
  beep(520, 0.3, 'triangle', 0.08, 520);
}

// red screen edges for whoever got hit (online, each player only sees their own)
function flashHurt(p, amount) {
  if (!p.remote) { hurtFlash = Math.max(hurtFlash, amount); if (touchMode) navigator.vibrate?.(40); if (padSeen) rumble(140, 0.7); }
  netRec(['h', p.id, amount]);
}

// returns true if the hit landed (broke a shield or cost a life)
function hurt(p) {
  if (run?.god) return false; // (the mod menu's god mode)
  if (p.inv > 0 || !p.alive || p.phaseOn > 0 || abActive(p, 'juggernaut')) return false; // (Wraiths are untouchable while phased; so is a FORTRESS)
  if (encounter) encounter.hitTaken = true; // for the Flawless achievement
  const doki = dokiBoss(); if (doki) dokiAdd(doki, -DOKI_HURT); // (DOKI DOLL thinks you're no fun when you get hit)
  if (run.s.nova) nova(p);
  if (p.shield > 0) {
    p.shield = 0; p.inv = 1 + run.s.invBonus * 0.5; p.aegisT = 0; flashHurt(p, 0.4); beep(300, 0.2, 'sawtooth', 0.06, -200); burst(p.x, p.y, '#7df9ff', 30);
    if (run.s.angel) for (let i = 0; i < 18; i++) fire(p.x, p.y, i / 18 * Math.PI * 2, '#7df9ff', undefined, p); // Guardian Angel evolution
    return true;
  }
  p.lives--; p.inv = 2 + run.s.invBonus; p.power = 0; shake = 18; combo = 1; flashHurt(p, 1);
  burst(p.x, p.y, '#ffffff', 50, 400);
  beep(120, 0.4, 'sawtooth', 0.1, -80);
  if (p.lives <= 0 && run.s.phoenix > 0) { phoenixBlast(p); return true; }
  if (p.lives <= 0) {
    p.alive = false;
    if (encounter) encounter.anyDowned = true;
    // leave a wreck a teammate can fly to and revive
    p.wreck = { x: p.x, y: Math.min(p.y, H - 60) }; p.reviveProg = 0;
    burst(p.x, p.y, p.color, 80, 500);
    if (!living().length) endRun();
  }
  return true;
}

// which inputs drive each player, per mode (gamepad N always drives player N as well)
const CONTROLS = {
  1: [['wasd', 'arrows', 'mouse']],
  2: [['wasd'], ['arrows', 'mouse']],
  3: [['mouse'], ['wasd'], ['arrows']],
  4: [['mouse'], ['wasd'], ['arrows'], ['ijkl']],
};

function controlsFor(p) {
  let dx = 0, dy = 0;
  // online: remote players' ships are moved by their own computers; the local player gets every control
  if ((net.role && p.remote) || menuOpen) return { dx: 0, dy: 0, usePointer: false }; // (and your ship holds still while your menu is open)
  // (online, players sharing this computer split the keyboard like local co-op)
  const k = net.role ? net.mine.indexOf(p.id) : p.id, scheme = CONTROLS[net.role ? net.localN : mode]?.[k] || ['wasd', 'arrows', 'mouse'];
  if (scheme.includes('wasd')) { if (keys.KeyA) dx--; if (keys.KeyD) dx++; if (keys.KeyW) dy--; if (keys.KeyS) dy++; }
  if (scheme.includes('arrows')) { if (keys.ArrowLeft) dx--; if (keys.ArrowRight) dx++; if (keys.ArrowUp) dy--; if (keys.ArrowDown) dy++; }
  if (scheme.includes('ijkl')) {
    if (keys.KeyJ || keys.Numpad4) dx--; if (keys.KeyL || keys.Numpad6) dx++;
    if (keys.KeyI || keys.Numpad8) dy--; if (keys.KeyK || keys.Numpad5 || keys.Numpad2) dy++;
  }
  const usePointer = scheme.includes('mouse');
  const pad = padState[k];
  if (pad && (pad.x || pad.y)) { dx = pad.x; dy = pad.y; }
  if (glitchFlip()) dx = -dx; // (GLITCH SECTOR: INPUT ERROR)
  return { dx, dy, usePointer };
}

let padState = [null, null, null, null];

// ---------- update ----------
function update(dt) {
  padState = [readPad(0), readPad(1), readPad(2), readPad(3)];
  padState.forEach((pad, i) => {
    if (!pad) return;
    if (state === 'play' && !paused && !menuOpen && pad.pressed && skipAbyssIntro()) return;
    if (state === 'play' && pad.start) { if (!net.playing) { paused = !paused; sel = 0; } else if (paused) forcePause(false); else toggleMenu(); return; }
    if (state === 'play' && !paused && !menuOpen && pad.face >= 0 && dokiAsking()) { answerDoki(pad.face); return; } // (Y / B / X / A answer DOKI DOLL)
    if (state === 'play' && !paused && !menuOpen && pad.ab) localAbility(i); // (gamepad N is player N on this computer)
    if (state !== 'play' || paused || menuOpen) { if (pad.back) { pressKey('Escape'); return; } if (pad.nav) moveSel(pad.nav); if (pad.pressed || pad.start) activate(); }
  });
  if (state === 'menu') updateMenuMarks(dt);

  updateBackground(dt);
  updateAchBanner(dt);
  updateMusicFilter();
  if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
  updateStars(dt);
  if (state !== 'play' || paused) { updateParticles(dt); return; }
  time += dt;
  // how much boss damage the team is putting out per second, smoothed over a few seconds (see firepowerHp)
  run.dpsEst = (run.dpsEst || 0) + ((run.fireAcc || 0) / dt - (run.dpsEst || 0)) * Math.min(1, dt / 5); run.fireAcc = 0;
  const s = run.s;
  time += dt;
  if (hint) { hint.life -= dt; if (hint.life <= 0) hint = null; }
  if (run.victoryT) { run.victoryT -= dt; if (run.victoryT <= 0) { run.victoryT = 0; endRun(true); return; } }
  hurtFlash = Math.max(0, hurtFlash - dt * 1.8);
  for (const pp of popups) { pp.life -= dt; pp.y -= 45 * dt; }
  popups = popups.filter(pp => pp.life > 0);

  updateWarp(dt);
  // three pink coins: a pink door opens (once a run, between boss fights) and DOKI DOLL comes out to play
  if ((run.pinkCoins || 0) >= PINK_NEED && !run.dokiMet && !bosses.length && bossWarn <= 0 && !run.warp && !run.victoryT) {
    run.dokiMet = true; run.dokiNext = true; bossWarn = 3.4;
    fxText('A PINK DOOR OPENS…', W / 2, H * 0.4, '#ff9ccf', 30, 3);
    [1047, 1319, 1568, 2093].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'sine', 0.05), 300 + i * 120));
  }
  // sector clock — stops while a boss is incoming or alive (and during a warp to a new zone)
  const bossActive = bosses.length > 0 || bossWarn > 0 || !!run.warp;
  if (!bossActive) {
    levelT += dt;
    if (levelT >= SECTOR_TIME) {
      levelT = 0; level++;
      if (level >= 5) unlockAch('sector5');
      if (level >= 10) unlockAch('sector10');
      const alive = living();
      for (const p of players) if (!p.alive && !p.gone) revive(p, alive[0]); // downed teammates rejoin
      pendingBoss = level % BOSS_EVERY === 0;
      openUpgrade(`SECTOR ${level - 1} CLEARED`, false);
      return;
    }
  }
  if (bossWarn > 0 && !run.warp) { // (the warning waits until the warp is over)
    const before = bossWarn;
    bossWarn -= dt;
    if (Math.floor(before * 2) !== Math.floor(bossWarn * 2)) beep(110, 0.25, 'square', 0.05);
    if (bossWarn <= 0) spawnEncounter();
  }
  if (bosses.length) { updateEncounter(dt); for (const bo of [...bosses]) updateBoss(bo, dt); if (state !== 'play') return; }

  for (const p of players) {
    if (!p.alive) continue;
    const m = p.ship.mod, speed = shipSpeed(p);
    const ox = p.x, oy = p.y;
    updateAbility(p, dt);
    const { dx, dy, usePointer } = controlsFor(p);
    if (dx || dy) {
      const l = Math.max(1, Math.hypot(dx, dy)); p.x += dx / l * speed * dt; p.y += dy / l * speed * dt;
    } else if (usePointer && pointer) {
      // the ship sits right under a mouse cursor, but a little above a finger so you can see it
      const ty = pointer.y - (pointer.touch ? 50 : 0);
      const k = 1 - Math.exp(-dt * 22); // frame-rate independent, snappy follow
      p.x += ((glitchFlip() ? W - pointer.x : pointer.x) - p.x) * k; // (flipped by an INPUT ERROR in the GLITCH SECTOR)
      p.y += (ty - p.y) * k;
    }
    p.x = Math.max(p.r, Math.min(W - p.r, p.x));
    p.y = Math.max(p.r, Math.min(H - p.r, p.y));
    // bank into turns and burn brighter when climbing (purely visual)
    const kk = Math.min(1, dt * 12), vx = (p.x - ox) / dt, vy = (p.y - oy) / dt;  // (remote ships report their own bank)
    p.mvx = (p.mvx || 0) + (vx - (p.mvx || 0)) * kk; p.mvy = (p.mvy || 0) + (vy - (p.mvy || 0)) * kk; // (which way it's flying, for DASH)
    if (!p.remote) p.tilt = (p.tilt || 0) + (Math.max(-1, Math.min(1, vx / 500)) * 0.45 - (p.tilt || 0)) * kk;
    if (!p.remote) p.thrust = (p.thrust || 0) + (Math.max(0, Math.min(1, -vy / 400)) - (p.thrust || 0)) * kk;
    p.inv = Math.max(0, p.inv - dt);
    p.power = Math.max(0, p.power - dt);
    p.sapped = Math.max(0, (p.sapped || 0) - dt);

    // auto fire (held during THE ABYSS's entrance, and around DOKI DOLL: see holstered)
    p.shotT -= dt;
    if (p.reloadT > 0 && (p.reloadT -= dt) <= 0) { p.ammo = m.cylinder; beep(1600, 0.05, 'square', 0.03); } // (GUNSLINGER: reloaded, click)
    if (p.shotT <= 0 && !holstered() && !(p.reloadT > 0) && !m.noGuns) {
      const powered = p.power > 0;
      // keep leftover time so fire rate (and Overclock) isn't rounded down to whole frames
      p.shotT = Math.max(p.shotT, -0.05) + s.fireDelay * (m.fireRate || 1) * (powered ? 0.6 : 1) * (p.sapped > 0 ? 1.7 : 1) // (a Sapper slows your guns)
        * (abActive(p, 'berserker') ? 0.7 : 1); // (RAMPAGE: faster fire)
      const n = Math.max(1, s.shots + (m.shots || 0) + (powered ? 3 : 0)), step = (powered ? 0.12 : 0.06) * (m.spread || 1);
      for (let i = 0; i < n; i++) fire(p.x + (i - (n - 1) / 2) * 4, p.y - 16, -Math.PI / 2 + (i - (n - 1) / 2) * step, p.color, m.bombs ? 'bomb' : undefined, p);
      for (let i = 0; i < s.rear; i++) fire(p.x, p.y + 14, Math.PI / 2 + (i - (s.rear - 1) / 2) * 0.25, p.color, undefined, p);
      if (s.bulletHell && (p.volley = (p.volley || 0) + 1) % 5 === 0) // Bullet Hell evolution: a full ring every 5th volley
        for (let i = 0; i < 14; i++) fire(p.x, p.y, i / 14 * Math.PI * 2, p.color, undefined, p);
      if (m.cylinder) { // GUNSLINGER: one round gone; an empty cylinder means a reload (faster while powered up, or with Speed Loader)
        p.ammo = (p.ammo ?? m.cylinder) - 1;
        if (p.ammo <= 0) p.reloadT = m.reload * (powered ? 0.6 : 1) * (s.abm_gunslinger ? 0.5 : 1);
        beep(300 + p.id * 40, 0.06, 'square', 0.02, -160);
      } else
      beep(880 + p.id * 110, 0.04, 'square', 0.012);
    }
    if (dronesOf(p) && !holstered()) {
      p.droneT -= dt;
      if (p.droneT <= 0) {
        // (a SUMMONER's drones are its only guns: they fire faster with its fire rate, power-ups and LEGION, and they aim)
        const own = m.noGuns, rate = own ? s.fireDelay / 0.14 * (m.fireRate || 1) * (p.power > 0 ? 0.6 : 1) * (abActive(p, 'summoner') ? 0.5 : 1) * (p.sapped > 0 ? 1.7 : 1) : 1;
        p.droneT = Math.max(p.droneT, -0.05) + (s.swarm ? 0.125 : 0.25) * rate; // (Drone Swarm: twice as fast)
        for (let k = 0; k < dronesOf(p); k++) {
          const d = dronePos(p, k), tg = own ? nearestTarget(d.x, d.y, 520) : null;
          fire(d.x, d.y - 6, tg ? Math.atan2(tg.y - d.y, tg.x - d.x) : -Math.PI / 2, own ? p.color : '#ffffff', undefined, p);
        }
      }
    }
    if (m.heal) { // Medic: patch up whoever is most hurt (MK II: everyone who's hurt), including yourself
      p.healT += dt;
      if (p.healT >= m.heal) {
        const hurt = living().filter(o => o.lives < maxLivesOf(o)).sort((a, b) => a.lives - b.lives);
        const targets = m.healAll ? hurt : hurt.slice(0, 1);
        if (targets.length) {
          p.healT = 0;
          fxRing(p.x, p.y, 10, m.healAll ? 160 : 90, 0.5, '#5dff7a', 3);
          for (const q of targets) {
            q.lives++;
            for (let i = 0; i < 16; i++) particles.push({ x: p.x, y: p.y, vx: (q.x - p.x) * 2.2 + (Math.random() - 0.5) * 60, vy: (q.y - p.y) * 2.2 + (Math.random() - 0.5) * 60, life: 0.45, max: 0.45, color: '#5dff7a', size: 3 });
            burst(q.x, q.y, '#5dff7a', 14, 120); // (also shows the heal on online guests' screens)
            popups.push({ x: q.x, y: q.y - 34, text: '+♥', life: 1.2, color: '#5dff7a' });
          }
          beep(760, 0.25, 'triangle', 0.06, 380);
        }
      }
    }
    if (s.missiles && !holstered()) { // pairs of homing missiles peel off the wings
      p.missileT = (p.missileT ?? 1) - dt;
      if (p.missileT <= 0) {
        p.missileT = Math.max(p.missileT, -0.05) + (s.missiles >= 2 ? 0.85 : 1.15) * (s.inferno ? 0.5 : 1); // (Inferno Barrage: twice as often)
        for (let i = 0; i < 2 * s.missiles; i++) {
          const side = i % 2 ? 1 : -1;
          fire(p.x + side * 12, p.y, -Math.PI / 2 + side * (0.6 + (i >> 1) * 0.35), '#ff9a3d', 'missile', p);
        }

    }

    const aegisEvery = Math.min(s.aegis ? [0, 20, 14, 9][s.aegis] : Infinity, m.aegis || Infinity) * (s.angel ? 0.5 : 1); // (Guardian Angel: twice as fast)

    }

  }

  if (players.length > 1) updateLinks(dt); // co-op LINK BEAMs
  updateAbFx(dt); // (Afterburner fire, Overcharged Rail beams)

  // spawn (faster in co-op)
  updateHazards(dt); // (the zone's hazard, if it has one)
  updateGlitch(dt); // (GLITCH SECTOR: its glitches play out, and wind down if you warp away mid-glitch)
  if (run.goldT > 0 && !bosses.length && bossWarn <= 0 && !run.warp && (run.goldT -= dt) <= 0) spawnGoldShard();
  updateEliteHazards(dt); updateHail(dt); // (and its elite one, from Endless cycle 2)
  spawnT -= dt;
  if (run.calmT > 0) run.calmT -= dt; // (a moment to get your bearings in a new GLITCH SECTOR)
  if (spawnT <= 0 && !bossActive && !(run.calmT > 0)) {
    const seq0 = enemyIdSeq; spawnEnemy();
    if (glitchWorld()) for (const e of enemies) if (e.id > seq0) { e.glitch = true; e.born = time; } // (GLITCH variants of every enemy)
    spawnT = Math.max(0.18, 0.9 - level * 0.07) * (0.6 + Math.random() * 0.8) * [1, 1, 0.7, 0.55, 0.45, 0.4, 0.36, 0.33, 0.3][Math.min(mode, 8)] * (mode > 8 ? 8 / mode * 1.6 : 1) / (1 + 0.3 * mut('frenzy'))
      / (curse('horde') ? 1.4 : 1) // (HORDE curse)
      * (run.zone === 'glitch' ? (mode === 1 && !net.playing ? 2 : 1.6) : 1); // (the GLITCH SECTOR sends fewer enemies: its glitches are the danger)
  }

  // things that bend your shots: Vortex enemies, and THE SINGULARITY (from much further away)
  prisms = enemies.filter(e => e.type === 'prism' && !e.dead);
  const vortexes = [...enemies.filter(e => e.type === 'vortex' && !e.dead).map(e => ({ x: e.x, y: e.y, r: VORTEX_R })),
    ...bosses.filter(o => (o.gimmick === 'gravity' || o.mech?.g === 'gravity') && bossAlive(o)).map(o => ({ x: o.x, y: o.y, r: SINGULARITY_PULL }))];
  for (const b of bullets) {
    if ((s.homing && !b.rail) || b.missile) {
      const tgt = nearestTarget(b.x, b.y, b.missile ? 600 : 350);
      if (tgt) {
        const sp = Math.hypot(b.vx, b.vy);
        let cur = Math.atan2(b.vy, b.vx);
        const d = ((Math.atan2(tgt.y - b.y, tgt.x - b.x) - cur + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        cur += Math.sign(d) * Math.min(Math.abs(d), (b.missile ? 5 : s.homing * 4) * dt);

    }

      const sp = Math.hypot(b.vx, b.vy), a = turnToward(Math.atan2(b.vy, b.vx), Math.atan2(dy, dx), 6 * dt);

    b.x += b.vx * dt; b.y += b.vy * dt;
    if (prisms.length) prismSplit(b, bullets); // (PRISM REACH: the two new shots fly on from here)
    if (b.missile && Math.random() < dt * 40) particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.25, max: 0.25, color: '#ff9a3d', size: 2 });
    if (b.bomb && !b.dead && (b.fuse -= dt) <= 0) bombBlast(b); // (BOMBER: it goes off when its fuse runs out, if it hasn't hit anything)
    if (b.bounces > 0) { // Ricochet: bounce off the edges (and allow re-hitting the same enemy)
      if (b.x < 0 || b.x > W) { b.vx = -b.vx; b.x = Math.max(0, Math.min(W, b.x)); b.bounces--; b.hits = []; }
      else if (b.y < 0 || b.y > H) { b.vy = -b.vy; b.y = Math.max(0, Math.min(H, b.y)); b.bounces--; b.hits = []; }
    }
    for (const bo of bosses) {
      if (b.dead || !bossAlive(bo)) continue;
      if (bo.shielded && distToSeg(bo.x, bo.y, b.px, b.py, b.x, b.y) < bo.r * 1.45) { // bounces off Aegis' bubble
        b.dead = true; hitBoss(bo, 0);
        if (Math.random() < 0.5) burst(b.x, b.y, '#5dff7a', 3, 120);
        continue;
      }
      if (bo.haloUp > 0 && distToSeg(bo.x, bo.y, b.px, b.py, b.x, b.y) < bo.r * 1.5) { // Null Seraph's halo sends shots back
        b.dead = true;
        if ((bo.reflectCd || 0) < time) {

          const a = Math.atan2(-b.vy, -b.vx) + (Math.random() - 0.5) * 0.3;
          eBullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * HALO_REFLECT_SPEED, vy: Math.sin(a) * HALO_REFLECT_SPEED, r: 5, color: '#ffffff', src: bo });
        }
        if (Math.random() < 0.3) burst(b.x, b.y, '#ffffff', 3, 120);
        continue;
      }
      if (b.bomb) { if (hitsWyrmBody(bo, b) || distToSeg(bo.x, bo.y, b.px, b.py, b.x, b.y) < bo.r + b.size) bombBlast(b); continue; } // (BOMBER)
      if (hitsWyrmBody(bo, b)) { b.dead = true; hitBoss(bo, b.dmg * s.bossDmg * bondMult(bo, b.owner) * 0.6); if (Math.random() < 0.3) burst(b.x, b.y, '#ffd0a0', 3, 120); continue; } // body: 60%
      if (distToSeg(bo.x, bo.y, b.px, b.py, b.x, b.y) >= bo.r + b.size) continue;
      b.dead = true; hitBoss(bo, b.dmg * s.bossDmg * bondMult(bo, b.owner), b.x, b.y);
      if ((b.missile || s.explosive) && bossFx.rings.length < 40) fxRing(b.x, b.y, 4, 30, 0.2, '#ffb13d', 2);
      if (Math.random() < 0.3) burst(b.x, b.y, bo.color, 3, 120);
      if (bossAlive(bo) && Math.random() < 0.15) beep(1200, 0.02, 'square', 0.01);
    }
  }
  updateBlades();
  for (const bo of bosses) {
    if (!bossAlive(bo)) continue;
    for (const p of living()) if (Math.hypot(p.x - bo.x, p.y - bo.y) < bo.r + p.r * 0.7 && hurt(p)) leech(bo, p);
  }
  if (state !== 'play') return;

  const shrapnel = [], flow = bulletFlow(); // (Chrono Field slows enemy fire; CHRONOS can stop it; HAILSTORM speeds it up)
  const ice = enemies.filter(e => e.type === 'ice' && !e.dead); // (FROZEN RINGS: ice chunks are cover)
  const doki = dokiBoss(); // (DOKI DOLL: flying close past her bullets charms her)
  for (const b of eBullets) {
    for (const c of ice) if (!b.dead && Math.hypot(b.x - c.x, b.y - c.y) < c.r + (b.r || 5)) { b.dead = true; chipIce(c); }
    if (!b.orb) { b.x += b.vx * dt * flow; b.y += b.vy * dt * flow; } // (orbiting bullets are moved by their boss: see updateOrbiters)
    if (b.grav && flow) b.vy += b.grav * dt * flow; // (SONNET's rings arc up and fall)
    if (b.sway && flow) b.vx = Math.sin(time * b.sway[1] + b.sway[2]) * b.sway[0]; // (DAWNNY's pages flutter side to side)
    if (b.bounce > 0) { // (DOKI DOLL's yarn, and SONNET's rings, bounce off the edges of the screen)
      if ((b.x < b.r && b.vx < 0) || (b.x > W - b.r && b.vx > 0)) { b.vx = -b.vx; b.bounce--; }
      if ((b.y < b.r && b.vy < 0) || (b.y > H - b.r && b.vy > 0)) { b.vy = -b.vy; b.bounce--; }
    }
    if (b.shed && flow && (b.shedT = (b.shedT ?? b.shed) - dt) <= 0) { b.shedT = b.shed; shrapnel.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 30, vy: 50, r: 3, color: '#ffd6ec' }); } // (loose thread)
    if (b.home > 0 && flow) { // THE HIVE's stingers steer toward the nearest player for a moment
      b.home -= dt;
      const p = nearestPlayer(b.x, b.y);
      if (p) { const sp = Math.hypot(b.vx, b.vy), a = turnToward(Math.atan2(b.vy, b.vx), Math.atan2(p.y - b.y, p.x - b.x), STING_TURN * dt); b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; }
    }
    if (b.ret !== undefined && flow) { // THE LEECH's blood: slows to a hang, then rushes back into it
      const src = b.src;
      if (b.ret > 0) {

        if (b.ret <= 0 && src) { const a = Math.atan2(src.y - b.y, src.x - b.x); b.vx = Math.cos(a) * 340; b.vy = Math.sin(a) * 340; }
      } else if (src && bosses.includes(src) && Math.hypot(src.x - b.x, src.y - b.y) < src.r * 0.6) b.dead = true;
    }
    if (prisms.length) prismSplit(b, shrapnel);
    if (b.wild && !b.dead) for (const o of enemies) { // a derelict turret's shot hits enemies too
      if (o.dead || TYPES[o.type].ghost || o.type === 'turret' || Math.hypot(b.x - o.x, b.y - o.y) >= o.r + (b.r || 5)) continue;
      b.dead = true; damageEnemy(o, 3 + level * 0.4, 'turret'); burst(b.x, b.y, b.color, 4, 100); break;
    }
    if (b.fuse !== undefined) { // boss mine: slows down, then bursts into a ring

      if (b.fuse <= 0 && !b.dead) {
        b.dead = true; burst(b.x, b.y, b.color, 20, 200); beep(180, 0.15, 'square', 0.04, -100);
        for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; shrapnel.push({ x: b.x, y: b.y, vx: Math.cos(a) * 180, vy: Math.sin(a) * 180, r: 5, color: b.color }); }
      }
    }
    for (const p of living()) if (!b.dead && Math.hypot(b.x - p.x, b.y - p.y) < p.r * 0.7 + (b.r || 5)) {
      b.dead = true;
      if (abActive(p, 'juggernaut')) { fire(b.x, b.y, -Math.PI / 2 + (Math.random() - 0.5) * 0.9, p.color, undefined, p); if (Math.random() < 0.4) burst(b.x, b.y, '#ffe93d', 3, 120); } // FORTRESS: it bounces back
      else if (hurt(p) && b.src) leech(b.src, p);
    }
    if (doki && !b.dead && !b.grazed) for (const p of living()) // a graze: close, but not a hit
      if (Math.hypot(b.x - p.x, b.y - p.y) < p.r * 0.7 + (b.r || 5) + GRAZE_R) { b.grazed = true; dokiGraze(doki, p); break; }
  }
  eBullets.push(...shrapnel);
  if (state !== 'play') return;

  for (const l of lasers) {
    if (l.warn > 0) {
      l.warn -= dt;
      if (l.warn <= 0) {
        beep(150, 0.4, 'sawtooth', 0.06, -60); shake = Math.max(shake, 6);
        if (l.flare) for (const o of enemies) // a solar flare burns up whatever is in its column
          if (!o.dead && !TYPES[o.type].ghost && Math.abs(o.x - l.x) < l.w / 2 + o.r) damageEnemy(o, 99, 'flare');

  }
  lasers = lasers.filter(l => l.warn > 0 || l.fire > 0);
  if (state !== 'play') return;
  eBullets = eBullets.filter(b => !b.dead && b.y < H + 20 && b.y > -20 && b.x > -20 && b.x < W + 20);

  for (const e of enemies) {

    if (e.elite === 'regen' && e.hp < e.maxHp) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.1 * dt);

    e.healFx = Math.max(0, (e.healFx || 0) - dt); e.guardedT = Math.max(0, (e.guardedT || 0) - dt);
    e.x += e.vx * edt; e.y += e.vy * edt;
    ENEMY_AI[e.type]?.(e, edt);
    if (e.glitch) glitchEnemy(e, edt);
    for (const b of bullets) {
      if (b.dead || e.dead || TYPES[e.type].ghost || b.hits.includes(e) || distToSeg(e.x, e.y, b.px ?? b.x, b.py ?? b.y, b.x, b.y) >= e.r + 4 + b.size) continue;
      if (b.bomb) { bombBlast(b); continue; } // (BOMBER: it blows up on whatever it touches, shields and all)
      if (e.type === 'bulwark' && Math.abs(angleDiff(Math.atan2((b.py ?? b.y) - e.y, (b.px ?? b.x) - e.x), e.aimA)) < BULWARK_ARC) {
        b.dead = true; e.shieldHit = 0.1; if (Math.random() < 0.4) burst(b.x, b.y, '#dfe8ff', 3, 120); continue; // blocked by its shield
      }
      if (b.pierce > 0) { b.pierce--; b.hits.push(e); } else b.dead = true;
      if (b.crit) burst(b.x, b.y, '#ffffff', 6, 150);
      e.lastBy = b.owner; // (whose kill effect to show)
      damageEnemy(e, b.dmg, b.missile ? 'missile' : 'bullet');
      // missiles always explode; Explosive Rounds make every hit explode
      if (b.missile) splash(b.x, b.y, s.inferno ? 90 : 45, b.dmg * 0.6, e);
      else if (s.explosive) splash(b.x, b.y, 30 + s.explosive * 15, b.dmg * 0.5, e);
    }
    if (!TYPES[e.type].harmless) for (const p of living()) {
      if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r * 0.7) {
        if (abActive(p, 'berserker') || (p.phaseOn > 0 && run.s.abm_wraith)) { // RAMPAGE (and Phantom Blades): smash right through it
          if ((e.ramT || 0) < time) { e.ramT = time + 0.25; e.lastBy = p.id; damageEnemy(e, Math.max(e.maxHp * 0.6, Math.max(12, run.dpsEst || 0)), 'splash'); shake = Math.max(shake, 5); }
          continue;
        }
        if (p.inv <= 0 && !(p.phaseOn > 0)) { e.dead = true; burst(e.x, e.y, e.color, 25); }

      }
    }
    if (state !== 'play') return;
  }
  enemies = enemies.filter(e => !e.dead && e.y < H + 60 && e.y > -200 && e.x > -120 && e.x < W + 120);
  bullets = bullets.filter(b => !b.dead && b.y > -40 && b.y < H + 40 && b.x > -40 && b.x < W + 40);

  // hands-on revive: hover near a downed teammate's wreck to bring them back
  for (const p of players) {
    if (p.alive || !p.wreck) continue;
    const helper = living().find(q => Math.hypot(q.x - p.wreck.x, q.y - p.wreck.y) < REVIVE_RANGE);
    if (helper) {
      const before = p.reviveProg;
      p.reviveProg += dt * (helper.ship.mod.reviveSpeed || 1) * (1 + 0.25 * metaLv('medkit')); // Medics (and Field Medic) revive faster
      if (Math.floor(before * 4) !== Math.floor(p.reviveProg * 4)) beep(400 + p.reviveProg * 200, 0.08, 'triangle', 0.04);
      if (Math.random() < dt * 30) particles.push({ x: helper.x, y: helper.y, vx: (p.wreck.x - helper.x) * 3, vy: (p.wreck.y - helper.y) * 3, life: 0.3, max: 0.3, color: helper.color, size: 3 });
      if (p.reviveProg >= REVIVE_TIME) revive(p, helper, true);
    } else p.reviveProg = Math.max(0, p.reviveProg - dt * 0.5);
  }

  comboT -= dt; if (comboT <= 0) combo = 1;

  for (const k of pickups) {
    k.t += dt;
    if (k.kind === 'gold') { k.x += k.vx * dt; k.y += Math.sin(k.t * 2) * 14 * dt; } else k.y += 90 * dt; // (a golden shard drifts across)
    {
      const p = nearestPlayer(k.x, k.y), mag = p && k.kind !== 'gold' ? s.magnet + (p.ship.mod.magnet || 0) : 0; // Medics have a built-in magnet

      if (q.petX === undefined || !petOf(q) || Math.hypot(q.petX - k.x, q.petY - k.y) > PET_GRAB) continue;
      const d = Math.hypot(q.x - k.x, q.y - k.y) || 1; k.x += (q.x - k.x) / d * 520 * dt; k.y += (q.y - k.y) / d * 520 * dt; break;
    }

      if (k.dead || Math.hypot(k.x - p.x, k.y - p.y) >= p.r + 14) continue;
      k.dead = true; beep(660, 0.25, 'triangle', 0.08, 660);
      burst(k.x, k.y, '#ffffff', 15, 150);
      if (k.kind === 'power') p.power = s.powerDur;
      if (k.kind === 'gold') findGoldShard(k.zone || run.zone, k.x, k.y);
      if (k.kind === 'pink') {
        run.pinkCoins = (run.pinkCoins || 0) + 1;
        fxText(run.pinkCoins >= PINK_NEED ? '♥ ♥ ♥' : `PINK COIN ${run.pinkCoins}/${PINK_NEED}`, k.x, k.y - 24, '#ff9ccf', 18, 1.3);
        [1568, 2093].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'sine', 0.05), i * 90));
      }
      if (k.kind === 'shield') p.shield = 1;
      if (k.kind === 'life') {
        // a life pickup revives a downed teammate first
        const down = players.find(q => !q.alive);
        if (down) revive(down, p, true);
        else if (p.lives < maxLivesOf(p)) p.lives++;
        else addScore(500 * combo);
      }
    }
  }
  pickups = pickups.filter(k => !k.dead && k.y < H + 30 && k.x > -60 && k.x < W + 60);

  updateParticles(dt);
}

function updateParticles(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const f of abFx) f.life -= dt;
  abFx = abFx.filter(f => f.life > 0);
  shake = Math.max(0, shake - dt * 40);
  updateBossFx(dt);
}

// ---------- draw helpers ----------
// soft neon glow (the most expensive thing to draw: PERFORMANCE MODE turns it off)
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = settings.lowfx ? 0 : blur; }

// Canvas shadowBlur is slow when used on hundreds of things per frame, so bullets and particles

function hexA(hex, a) {
  if (hex.length === 4) hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];

}

}
function circlePath(list, k) {
  ctx.beginPath();

}
// items: [{ x, y, r, color }] — r is the solid core radius
function drawGlowDots(items, whiteCore = true) {
  if (!items.length) return;
  const byColor = new Map();
  for (const it of items) { let l = byColor.get(it.color); if (!l) byColor.set(it.color, l = []); l.push(it); }
  ctx.save();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;

    case 'mine': // spiky ball
      ctx.rotate(e.spin);
      for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, rr = i % 2 ? r * 0.6 : r * 1.25 * (e.timer <= 0 ? 1 + Math.sin(now * 14) * 0.08 : 1); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } // (its spikes throb once it's armed)

      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }

  switch (e.type) {

    case 'magnet': // its field, rippling out between the poles

    case 'bomber': // blinking bomb-bay light
      ctx.fillStyle = e.fire < 0.3 || Math.floor(e.t * 4) % 2 ? '#fff' : c;
      ctx.beginPath(); ctx.arc(0, r * 0.15, r * 0.22, 0, Math.PI * 2); ctx.fill();
      break;
    case 'sniper': // crosshair and a barrel toward its aim
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-r * 0.6, 0); ctx.lineTo(r * 0.6, 0); ctx.moveTo(0, -r * 0.6); ctx.lineTo(0, r * 0.6); ctx.stroke();
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(Math.cos(e.aimA) * r * 0.7, Math.sin(e.aimA) * r * 0.7);

      break;
    case 'healer': ctx.fillStyle = c; ctx.globalAlpha = 0.35 + e.pulse * 0.5; ctx.fill(); break;
    case 'bloodorb': ctx.fillStyle = c; ctx.globalAlpha = 0.6 + Math.sin(e.t * 12) * 0.3; ctx.fill(); break;
    case 'orbiter': ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2); ctx.fill(); break;
    case 'kamikaze': ctx.fillStyle = Math.floor(time * 12) % 2 ? '#fff' : c; ctx.beginPath(); ctx.arc(0, r * 0.2, r * 0.3, 0, Math.PI * 2); ctx.fill(); break; // blinking warhead
    case 'spinner': ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0, 0, r * 0.25, 0, Math.PI * 2); ctx.fill(); break;
    case 'bouncer': ctx.fillStyle = c; ctx.fillRect(-r * 0.3, -r * 0.3, r * 0.6, r * 0.6); break;
    case 'sentry': ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(e.aimA) * r * 1.5, Math.sin(e.aimA) * r * 1.5); ctx.stroke(); break; // barrel
    case 'launcher': ctx.fillStyle = e.fire < 0.5 && Math.floor(e.t * 10) % 2 ? '#fff' : '#000'; for (const k of [-1, 1]) { ctx.beginPath(); ctx.arc(k * r * 0.5, r * 0.2, r * 0.22, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); } break;
    case 'rocket': ctx.fillStyle = '#ffe93d'; ctx.beginPath(); ctx.moveTo(-r * 0.3, -r * 0.5); ctx.lineTo(0, -r * (1.2 + Math.random() * 0.6)); ctx.lineTo(r * 0.3, -r * 0.5); ctx.fill(); break; // flame
    case 'firework': ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, r * 0.4); ctx.lineTo(0, r * 1.8); ctx.stroke(); break; // stick
    case 'slimer': { // eyes that blink now and then, and goo dripping off it

      ctx.beginPath(); ctx.arc(r * 0.2, r * (0.85 + ph * 0.9), 2 + (1 - ph) * 1.5, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;

    }
    case 'block': ctx.lineWidth = 1; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(-19, 0); ctx.lineTo(19, 0); ctx.moveTo(-6, -13); ctx.lineTo(-6, 0); ctx.moveTo(8, 0); ctx.lineTo(8, 13); ctx.stroke(); break;
    case 'shade': ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.1, 2, 0, Math.PI * 2); ctx.arc(r * 0.25, -r * 0.1, 2, 0, Math.PI * 2); ctx.fill(); break; // eyes
    case 'vortex': // three swirling arms around the eye

    case 'mimic': ctx.fillStyle = '#fff'; for (let k = -1; k <= 1; k += 2) { ctx.beginPath(); ctx.moveTo(r * 0.4, k * r * 0.25); ctx.lineTo(r * 0.8, k * r * 0.05); ctx.lineTo(r * 0.6, k * r * 0.45); ctx.fill(); } break; // fangs
    case 'sapper': ctx.fillStyle = e.state === 'latch' && Math.floor(time * (6 + (SAP_TIME - e.timer) * 3)) % 2 ? '#fff' : c; ctx.beginPath(); ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2); ctx.fill(); break;
    case 'layer': ctx.fillStyle = e.fire < 0.4 ? '#fff' : c; ctx.fillRect(-r * 0.3, r * 0.35, r * 0.6, r * 0.3); break;
    case 'mine': ctx.fillStyle = e.timer <= 0 && Math.floor(e.t * 8) % 2 ? '#fff' : c; ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2); ctx.fill(); break;

    case 'pylon': ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.5 + Math.sin(e.t * 8) * 0.4; ctx.beginPath(); ctx.arc(0, 0, r * 0.25, 0, Math.PI * 2); ctx.fill(); break;

      break;
    }
    case 'serpent': ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.2, 2.5, 0, Math.PI * 2); ctx.arc(-r * 0.35, -r * 0.2, 2.5, 0, Math.PI * 2); ctx.fill(); break;
    case 'guardian': ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, -r * 0.5); ctx.lineTo(0, r * 0.6); ctx.moveTo(-r * 0.45, -r * 0.1); ctx.lineTo(r * 0.45, -r * 0.1); ctx.stroke(); break;
    case 'carrier': // bay lights that blink faster just before a launch
      ctx.fillStyle = e.fire < 0.6 && Math.floor(e.t * 10) % 2 ? '#fff' : c;
      for (let k = -1; k <= 1; k++) ctx.fillRect(k * r * 0.5 - 3, r * 0.3, 6, 5);

      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -r * 0.45, 2.5 + Math.random() * 1.5, 0, Math.PI * 2); ctx.fill();
      break;
  }
  ctx.restore();

  if (e.maxHp >= 3 && e.hp < e.maxHp && e.hp > 0) {

    const el = ELITES[e.elite];
    ctx.save(); ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = el.color;
    ctx.fillText('★ ' + el.name, e.x, e.y - e.r * 1.45 - 6); ctx.restore();

}

// warnings drawn beneath enemies: aim lines and heal pulses
function drawEnemyTelegraph(e) {
  if (e.type === 'puddle') { // a toxic puddle (dashed while it's still settling)
    const pr = puddleR(e), settled = PUDDLE_LIFE - e.timer > 0.35;
    ctx.save(); ctx.fillStyle = hexA(e.color, settled ? 0.3 : 0.12); ctx.strokeStyle = hexA(e.color, 0.7); ctx.lineWidth = 1.5;

  }

    const blink = Math.floor(time * 10) % 2, hw = e.r + 4, c = e.color;
    ctx.save(); ctx.fillStyle = hexA(c, 0.06 + (1 - e.timer / METEOR_WARN) * 0.12); ctx.fillRect(0, e.y - hw, W, hw * 2);
    ctx.strokeStyle = c; ctx.globalAlpha = 0.55; ctx.setLineDash([12, 10]); ctx.lineDashOffset = -time * 80 * e.side; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, e.y - hw); ctx.lineTo(W, e.y - hw); ctx.moveTo(0, e.y + hw); ctx.lineTo(W, e.y + hw); ctx.stroke(); ctx.setLineDash([]);
    if (blink) {
      ctx.globalAlpha = 1; ctx.fillStyle = c; const sx = e.side > 0 ? 6 : W - 6;
      for (let k = 0; k < 2; k++) { const ax = sx + e.side * k * 12; ctx.beginPath(); ctx.moveTo(ax + e.side * 10, e.y); ctx.lineTo(ax, e.y - 8); ctx.lineTo(ax, e.y + 8); ctx.fill(); }
      ctx.font = 'bold 11px system-ui'; ctx.textAlign = e.side > 0 ? 'left' : 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('METEOR!', e.side > 0 ? 6 : W - 6, e.y - hw - 2);
    }
    ctx.restore();
  }
  if (e.type === 'bolt') { // ion storm: a pink circle of charge closes in, then the bolt lands
    const c = e.color;
    ctx.save();
    if (e.state === 'warn') {
      const k = Math.max(0, Math.min(1, 1 - e.timer / BOLT_WARN));
      ctx.globalAlpha = 0.35 + k * 0.5; ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.lineDashOffset = time * 30;
      ctx.beginPath(); ctx.arc(e.x, e.y, BOLT_R * (1.6 - k * 0.6), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = 0.07 + k * 0.16; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(e.x, e.y, BOLT_R, 0, Math.PI * 2); ctx.fill();
      if (Math.random() < 0.25 + k * 0.5) { // sparks crawling over the circle
        const a = Math.random() * Math.PI * 2; ctx.globalAlpha = 0.8; ctx.strokeStyle = '#ffd0f0'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(e.x + Math.cos(a) * BOLT_R * 0.3, e.y + Math.sin(a) * BOLT_R * 0.3); ctx.lineTo(e.x + Math.cos(a + 0.5) * BOLT_R * 0.7, e.y + Math.sin(a + 0.5) * BOLT_R * 0.7); ctx.stroke();
      }
    } else { // the strike: a jagged bolt from the top of the screen
      glow(c, 40); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5; ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.moveTo(e.x + (Math.random() - 0.5) * 40, 0);
      for (let i = 1; i < 12; i++) ctx.lineTo(e.x + (Math.random() - 0.5) * 50 * (1 - i / 12), e.y * i / 12);
      ctx.lineTo(e.x, e.y); ctx.stroke();
      ctx.globalAlpha = 0.5; ctx.fillStyle = '#ffd0f0'; ctx.beginPath(); ctx.arc(e.x, e.y, BOLT_R, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

    ctx.save(); ctx.fillStyle = e.color; ctx.beginPath(); ctx.moveTo(e.x, H - 30); ctx.lineTo(e.x - 9, H - 14); ctx.lineTo(e.x + 9, H - 14); ctx.fill();
    ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center'; ctx.fillText('!', e.x, H - 38); ctx.restore();
  }
